var IMG = { prod:{full:'',name:'',thumb:'',previewUrl:''}, sr:{full:'',name:'',thumb:'',previewUrl:''}, mgr:{full:'',name:'',thumb:'',previewUrl:''} };
function getThumb(obj) {
  if (!obj) return ''; var t = String(obj.thumb||'').trim();
  return (t.length>10 && (t.indexOf('data:image')===0 || t.indexOf('http')===0)) ? t : '';
}
function makeThumb(dataUrl, cb) {
  var img = new Image();
  img.onload = function() {
    try {
      var canvas = document.createElement('canvas'); canvas.width=600; canvas.height=600;
      var ctx = canvas.getContext('2d'), s=Math.min(img.width,img.height);
      var sx=(img.width-s)/2, sy=(img.height-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,600,600); cb(canvas.toDataURL('image/jpeg',0.92));
    } catch(e){ cb(''); }
  };
  img.onerror = function(){ cb(''); }; img.src = dataUrl;
}
function setContainerImg(container, src) {
  if (!container) return;
  var old = container.querySelector('img.injected'); if (old) old.remove();
  if (!src) return;
  var im = document.createElement('img');
  im.className='injected';
  im.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;z-index:1';
  im.onerror = function(){ im.remove(); };
  container.appendChild(im); im.src = src;
}
function pickImg(file, previewId, slot, maxMB) {
  if (!file) return;
  if (file.size > maxMB*1024*1024) { toast('ছবি '+maxMB+'MB এর কম হতে হবে'); return; }
  var rd = new FileReader();
  rd.onload = function(e) {
    var full = e.target.result; IMG[slot].full=full; IMG[slot].name=file.name; IMG[slot].previewUrl=full;
    var prv = document.getElementById(previewId); if (prv) setContainerImg(prv, full);
    makeThumb(full, function(thumb){ IMG[slot].thumb=thumb; });
  }; rd.readAsDataURL(file);
}
function thumbImg(obj, radius) {
  var src = getThumb(obj); if (!src) return '';
  return '<img src="'+src+'" alt="" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;border-radius:'+(radius||'inherit')+'" onerror="this.remove()">';
}
// ── Individual person photo (Owner-set) instead of a generic role emoji ──
// Falls back to a role-colored circle with the role emoji when no photo
// has been set for that specific person yet.
function personAvatar(thumb, role, sizePx, fallbackEmoji) {
  var sz = sizePx || 32;
  var emoji = fallbackEmoji || (ROLE_ICONS[role]||'👤');
  var color = ROLE_COLORS[role] || '#546E7A';
  var t = String(thumb||'').trim();
  var valid = t.length>10 && (t.indexOf('data:image')===0 || t.indexOf('http')===0);
  if (valid) {
    return '<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);background:'+color+'">'
      + '<img src="'+t+'" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display=\'none\'"></div>';
  }
  return '<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+color+';display:flex;align-items:center;justify-content:center;font-size:'+Math.round(sz*0.5)+'px;flex:0 0 auto;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)">'+emoji+'</div>';
}

// ── Owner PIN re-verification modal (prevents accidental mis-touches) ──
// Also reused (in "self" mode) to let a staff member re-confirm their OWN
// PIN before submitting a sensitive self-service request (e.g. advance
// payment) — see confirmSelfPin() below.
var _pincResolve = null;
var _pincMode = 'owner'; // 'owner' | 'self'
function confirmOwnerPin(title) {
  _pincMode = 'owner';
  return new Promise(function(resolve) {
    _pincResolve = resolve;
    document.getElementById('pinc-title').textContent = title || 'নিশ্চিত করতে Owner PIN দিন';
    var inp = document.getElementById('pinc-input');
    inp.value = ''; document.getElementById('pinc-err').textContent = '';
    document.getElementById('pinc-bg').style.display = 'flex';
    setTimeout(function(){ inp.focus(); }, 60);
  });
}
// Confirms the PIN entered belongs to the CURRENTLY logged-in user
// (not necessarily Owner) — used as a lightweight "are you sure it's
// you" gate before self-service actions like an advance payment request.
function confirmSelfPin(title) {
  _pincMode = 'self';
  return new Promise(function(resolve) {
    _pincResolve = resolve;
    document.getElementById('pinc-title').textContent = title || 'নিশ্চিত করতে আপনার নিজের PIN দিন';
    var inp = document.getElementById('pinc-input');
    inp.value = ''; document.getElementById('pinc-err').textContent = '';
    document.getElementById('pinc-bg').style.display = 'flex';
    setTimeout(function(){ inp.focus(); }, 60);
  });
}
function _pincCancel() {
  document.getElementById('pinc-bg').style.display = 'none';
  if (_pincResolve) { _pincResolve(false); _pincResolve = null; }
}
async function _pincSubmit() {
  var val = document.getElementById('pinc-input').value.trim();
  var errEl = document.getElementById('pinc-err');
  if (!/^\d{5}$/.test(val)) { errEl.textContent = '৫ সংখ্যার PIN দিন'; return; }
  var r = await apiPost('/api/auth', { password: val });
  if (!r || !r.ok) { errEl.textContent = 'ভুল PIN, আবার চেষ্টা করুন'; return; }

  }
  window._lastOwnerPin = val; // exposed for endpoints that re-verify the PIN themselves (e.g. approval_edit)
  document.getElementById('pinc-bg').style.display = 'none';
  if (_pincResolve) { _pincResolve(true); _pincResolve = null; }
}

// Device-local YYYY-MM (NOT toISOString, which converts to UTC and can
// shift the month/day near midnight if the device is ever in a different
// timezone than intended — staff phones are physically in Bangladesh, so
// their own local clock is the correct source of truth here).
function _localMonthStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function _fmtHM(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var h = d.getHours(), m = d.getMinutes();
  var ap = h >= 12 ? 'PM' : 'AM'; var h12 = h % 12; if (h12===0) h12 = 12;
  return h12 + ':' + String(m).padStart(2,'0') + ' ' + ap;
}
// Update #44 — every generated report/sheet shows WHEN it was generated.
// Small shared line used across the analytics/damage/bonus report screens.
function _genStampHtml(iso) {
  if (!iso) return '';
  return '<div style="font-size:11px;color:var(--mt2);margin:2px 0 8px">🕒 তৈরি হয়েছে: ' + fmtBn(iso) + ', ' + _fmtHM(iso) + '</div>';
}

// Device-local YYYY-MM-DD (staff phones are physically in Bangladesh,
// so device-local time is the correct source of truth on the frontend).
function _localISODate() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

async function doPunch(punchType) {
  showOvl('লোকেশন যাচাই হচ্ছে...');
  var coords = await _getCoords(10000).catch(function(){ return null; });
  showOvl(punchType === 'out' ? 'চেকআউট হচ্ছে...' : 'পাঞ্চ হচ্ছে...');
  var r = await apiPost('/api/attendance?action=punch', {
    userKey: S.userId, userName: S.userName, role: S.role, punchType: punchType,
    lat: coords ? coords.lat : null, lng: coords ? coords.lng : null
  });
  hideOvl();
  if (!r || !r.ok) return toast((r&&r.error)||'❌ পাঞ্চ ব্যর্থ — লোকেশন/অফিসের বাইরে হতে পারে');
  if (r.already) toast('এই পাঞ্চটি আগেই করা হয়েছে');
  else if (punchType === 'out') toast('✅ চেকআউট রেকর্ড হয়েছে!');
  else toast(r.record.status==='late' ? '⏰ লেট পাঞ্চ রেকর্ড হয়েছে' : '✅ প্রেজেন্ট রেকর্ড হয়েছে!');
  renderAttendanceTab();
}

function _getCoords(timeoutMs) {
  return new Promise(function(resolve, reject) {
    if (!navigator.geolocation) return reject('no-geo');
    var to = setTimeout(function(){ reject('timeout'); }, timeoutMs || 8000);
    navigator.geolocation.getCurrentPosition(function(pos){
      clearTimeout(to);
      resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    }, function(err){ clearTimeout(to); reject(err); }, { enableHighAccuracy:true, timeout:timeoutMs||8000, maximumAge:20000 });
  });
}

// ════════════════════════════════════════════════════
//  SHARED: Attendance Calendar + Salary panel
//  (used by: own Attendance tab AND Owner's per-person drill-down)
// ════════════════════════════════════════════════════
var ATT_VIEWS = {}; // scopeId -> { userKey, userName, role, month, days, salary, isOwnerView }

function attScopeInit(scopeId, userKey, userName, role, isOwnerView) {
  ATT_VIEWS[scopeId] = { userKey: userKey, userName: userName, role: role, month: _cyclePeriodToday(), days: {}, salary: null, isOwnerView: !!isOwnerView };
  return ATT_VIEWS[scopeId];
}

function attScopeMonthStr(scopeId, offset) {
  var v = ATT_VIEWS[scopeId]; if (!v) return _cyclePeriodToday();
  var parts = v.month.split('-').map(Number);
  var total = (parts[0]*12 + (parts[1]-1)) + offset;
  var ny = Math.floor(total/12), nm = total%12;
  return ny + '-' + String(nm+1).padStart(2,'0');
}

function _monthLabelBn(monthStr) {
  // monthStr is the pay-cycle's period label (V41 update 7) — show it as
  // "26 <prevMon> – 25 <thisMon> <year>" so it's clear this isn't a plain
  // calendar month.
  var b = _cycleBounds(monthStr);
  var sp = b.start.split('-').map(Number), ep = b.end.split('-').map(Number);
  var sName = new Date(Date.UTC(sp[0], sp[1]-1, 1)).toLocaleDateString('bn-BD', { month:'short', timeZone:'UTC' });
  var eName = new Date(Date.UTC(ep[0], ep[1]-1, 1)).toLocaleDateString('bn-BD', { month:'long', timeZone:'UTC' });
  return sp[2] + ' ' + sName + ' – ' + ep[2] + ' ' + eName + ' ' + ep[0];
}

async function loadAttScope(scopeId, monthStr) {
  var v = ATT_VIEWS[scopeId]; if (!v) return;
  if (monthStr) v.month = monthStr;
  var box = document.getElementById(scopeId+'-box');
  if (box) box.innerHTML = '<div style="text-align:center;padding:20px;color:var(--mt2)">লোড হচ্ছে...</div>';

  var reqs = [ apiGet('/api/attendance?action=calendar&userKey='+encodeURIComponent(v.userKey)+'&month='+v.month) ];
  if (v.role !== 'so') reqs.push(apiGet('/api/attendance?action=salary-summary&userKey='+encodeURIComponent(v.userKey)+'&month='+v.month));
  var results = await Promise.all(reqs);
  v.days = (results[0] && results[0].ok) ? results[0].days : {};
  v.salary = (results[1] && results[1].ok) ? results[1] : null;
  renderAttScope(scopeId);
}

function renderAttScope(scopeId) {
  var v = ATT_VIEWS[scopeId]; if (!v) return;
  var box = document.getElementById(scopeId+'-box'); if (!box) return;

  var monthName = _monthLabelBn(v.month);
  var cycleDates = _cycleDates(v.month);
  var firstDay = new Date(cycleDates[0]+'T00:00:00Z').getUTCDay();
  var todayStr = _localISODate();

  var h = '';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
  h += '<button class="btn btn-gh btn-sm" onclick="loadAttScope(\''+scopeId+'\', attScopeMonthStr(\''+scopeId+'\',-1))">◀</button>';
  h += '<div style="font-size:13px;font-weight:700;color:var(--bl);text-align:center">📅 '+monthName+'</div>';
  h += '<button class="btn btn-gh btn-sm" onclick="loadAttScope(\''+scopeId+'\', attScopeMonthStr(\''+scopeId+'\',1))">▶</button>';
  h += '</div>';

  h += '<div class="cal-legend">';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--grl);border:1.5px solid var(--gr)"></div> সময়মতো</div>';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:#FFF3E0;border:1.5px solid #FF9800"></div> লেট</div>';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--rel);border:1.5px solid var(--re)"></div> অনুপস্থিত</div>';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--seg-bg);border:1.5px solid var(--bdr)"></div> শুক্রবার</div>';
  h += '</div>';

  h += '<div class="card" style="padding:10px;margin-bottom:10px">';
  h += '<div class="cal-grid">';
  ['রবি','সোম','মঙ্গ','বুধ','বৃহ','শুক্র','শনি'].forEach(function(d){ h += '<div class="cal-day-hdr">'+d+'</div>'; });
  for (var i=0;i<firstDay;i++) h += '<div class="cal-cell empty"></div>';

  cycleDates.forEach(function(dateStr){
    var dparts = dateStr.split('-').map(Number);
    var day = dparts[2];
    // The cycle spans two calendar months — show a small month tag on the
    // 1st day of each and on the very first cell, so it's clear where one
    // calendar month hands off to the next inside this pay cycle.
    var isMonthStart = (day === 1) || (dateStr === cycleDates[0]);
    var monTag = isMonthStart ? new Date(Date.UTC(dparts[0],dparts[1]-1,1)).toLocaleDateString('bn-BD',{month:'short',timeZone:'UTC'}) : '';
    var info = v.days[dateStr] || {};
    var isTdy = dateStr === todayStr;
    var cls = 'cal-cell';
    if (isTdy) cls += ' today-cell';
    if (info.isFriday) cls += ' att-cell-off';
    else if (info.isFuture) cls += ' att-cell-future';
    else if (info.override) cls += ' att-cell-green';
    else if (!info.hasIn) cls += ' att-cell-red';
    else if (info.inStatus === 'late') cls += ' att-cell-orange';
    else cls += ' att-cell-green';

    h += '<div class="'+cls+'" onclick="attDayClick(\''+scopeId+'\',\''+dateStr+'\')">';
    if (monTag) h += '<div style="font-size:8px;color:var(--mt2);line-height:1">'+monTag+'</div>';
    h += '<div class="cal-day-num" style="color:'+(isTdy?'var(--bl)':'var(--txt)')+'">'+(isTdy?'<strong>'+day+'</strong>':day)+'</div>';
    if (!info.isFriday && !info.isFuture) {
      if (info.salaryValid) h += '<div style="font-size:9px;margin-top:1px">✓</div>';
      else if (info.hasIn && !info.hasOut) h += '<div style="font-size:9px;margin-top:1px;color:#E65100">½</div>';
    }
    h += '</div>';
  });
  h += '</div></div>';

  if (v.role !== 'so') h += _salaryPanelHtml(scopeId, v);

  box.innerHTML = h;
}

function _salaryPanelHtml(scopeId, v) {
  var s = v.salary; if (!s) return '';
  var h = '<div class="ct">💰 বেতন — '+_monthLabelBn(v.month)+'</div>';

  if (!s.settings) {
    h += '<div class="att-office-card unset">⚠️ এই মাসের বেতন এখনো সেট করা হয়নি।</div>';
  } else {
    h += '<div class="att-mets">';
    h += '<div class="att-met"><div class="ml">বেতন (প্রতি দিন)</div><div class="mv">৳'+fm(s.settings.salaryPerDay)+'</div></div>';
    h += '<div class="att-met"><div class="ml">দৈনিক রেট</div><div class="mv">৳'+fm(s.dailyRate)+'</div></div>';
    h += '<div class="att-met"><div class="ml">গণনাযোগ্য দিন</div><div class="mv" style="color:var(--gr)">'+s.validDays+' / '+s.workingDays+'</div></div>';
    h += '<div class="att-met"><div class="ml">অর্জিত বেতন</div><div class="mv" style="color:var(--gr)">৳'+fm(s.salaryEarned)+'</div></div>';
    h += '</div>';
    if (s.bonusEnabled) {
      h += '<div class="att-mets">';
      h += '<div class="att-met"><div class="ml">অন-টাইম বোনাস</div><div class="mv" style="color:var(--gr)">৳'+fm(s.dailyBonus)+'</div></div>';
      h += '<div class="att-met"><div class="ml">লেট পেনাল্টি</div><div class="mv" style="color:var(--re)">'+(s.penalty?'৳'+fm(s.penalty):'৳০')+'</div></div>';
      h += '</div>';
      if (s.perfectMonth) h += '<div class="att-badge-perfect">🏅 পারফেক্ট মান্থ বোনাস (৳'+fm(s.perfectBonus)+')</div>';
    }
    if (s.fridayBonusDays > 0) {
      h += '<div class="att-badge-perfect" style="background:#E3F2FD;color:#1565C0;border-color:#90CAF9">🗓️ শুক্রবার উপস্থিতি বোনাস — '+s.fridayBonusDays+' দিন · ৳'+fm(s.fridayBonusAmount)+'</div>';
    }
    // V56 §3.4 — "no 3-day gap" full-attendance bonus, its own line, only
    // shown once the Owner has actually configured an amount (>0).
    if (s.settings.noGapBonusAmt > 0) {
      if (s.noGapEligible) h += '<div class="att-badge-perfect" style="background:#E8F5E9;color:#2E7D32;border-color:#A5D6A7">🎯 নো-গ্যাপ উপস্থিতি বোনাস — ৳'+fm(s.noGapBonus)+'</div>';
      else h += '<div class="att-badge-perfect" style="background:#FAFAFA;color:var(--mt2);border-color:#E0E0E0">🎯 নো-গ্যাপ বোনাস — এই মাসে ৩+ দিনের গ্যাপ থাকায় প্রযোজ্য নয়</div>';
    }
    // V56 §3.5 — Owner-settled target bonus: purely informational here,
    // never mixed into the total/payable figures below.
    if (s.targetBonus && s.targetBonus.targetAmount > 0) {
      var tb = s.targetBonus;
      if (tb.status === 'settled') h += '<div class="att-badge-perfect" style="background:#E8F5E9;color:#2E7D32;border-color:#A5D6A7">🏆 টার্গেট বোনাস পরিশোধিত — ৳'+fm(tb.amount)+'</div>';
      else if (tb.status === 'pending') h += '<div class="att-badge-perfect" style="background:#FFF8E1;color:#F57F17;border-color:#FFE082">🏆 টার্গেট বোনাস উপলব্ধ — ৳'+fm(tb.amount)+' (মালিকের চূড়ান্ত পরিশোধের অপেক্ষায়)</div>';
      else if (tb.eligible) h += '<div class="att-badge-perfect" style="background:#FFF8E1;color:#F57F17;border-color:#FFE082">🏆 টার্গেট অর্জিত হয়েছে — বোনাসের জন্য যোগ্য (মালিক এখনো পরিমাণ সেট করেননি)</div>';
    }
    h += '<div class="card" style="text-align:center;background:var(--bll);margin-top:8px">';
    h += '<div style="font-size:11px;color:var(--mt)">এই মাসের মোট</div>';
    h += '<div style="font-size:26px;font-weight:700;color:var(--bl);margin-top:2px">৳'+fm(s.total)+'</div>';
    if (s.advanceApproved > 0) {
      h += '<div style="font-size:12px;color:var(--re);margin-top:4px">➖ অগ্রিম কর্তন: ৳'+fm(s.advanceApproved)+'</div>';
      h += '<div style="font-size:15px;font-weight:700;color:var(--gr);margin-top:2px">পরিশোধযোগ্য: ৳'+fm(s.payable)+'</div>';
    }
    if (s.paid) h += '<div class="att-badge-perfect" style="background:#E8F5E9;color:#2E7D32;border-color:#A5D6A7">✅ পরিশোধিত — ৳'+fm(s.paidAmount)+' ('+fmtBn(_isoOnly(s.paidAt))+')</div>';
    else h += '<div class="att-badge-perfect" style="background:#FFEBEE;color:#C62828;border-color:#EF9A9A">🔴 এই মাসের বেতন বাকি</div>';
    h += '</div>';
  }

  if (v.isOwnerView) {
    h += '<div style="display:flex;gap:8px;margin-top:8px">';
    h += '<button class="btn btn-gh btn-w btn-sm" onclick="openSalarySetModal(\''+scopeId+'\')">⚙️ বেতন সেট করুন</button>';
    if (s.settings && !s.paid && s.total > 0) h += '<button class="btn btn-bl btn-w btn-sm" onclick="ownerPaySalary(\''+scopeId+'\')">💵 পরিশোধ করুন</button>';
    h += '</div>';
  } else {
    // ── Self view: advance payment request box (Manager/DSR/Driver) ──
    h += '<div class="card" style="margin-top:10px">';
    h += '<div style="font-weight:700;font-size:13px;margin-bottom:6px">💵 অগ্রিম টাকা</div>';
    if (s.advancePending > 0) h += '<div style="font-size:12px;color:var(--am);margin-bottom:6px">⏳ পেন্ডিং অনুরোধ: ৳'+fm(s.advancePending)+' — মালিকের অনুমোদনের অপেক্ষায়</div>';
    if (s.advanceApproved > 0) h += '<div style="font-size:12px;color:var(--gr);margin-bottom:6px">✅ এই মাসে অনুমোদিত: ৳'+fm(s.advanceApproved)+' (বেতন থেকে কর্তন হবে)</div>';
    h += '<button class="btn btn-bl btn-w btn-sm" onclick="openAdvanceRequestModal(\''+scopeId+'\')">💵 অগ্রিম টাকার আবেদন করুন</button>';
    h += '</div>';
  }
  return h;
}

// ── Advance salary request modal (self-service, Manager/DSR/SO/Driver) ──
function openAdvanceRequestModal(scopeId) {
  var v = ATT_VIEWS[scopeId]; if (!v) return;
  var modal = document.createElement('div');
  modal.id = 'adv-modal';
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){ if (e.target===modal) document.body.removeChild(modal); };

  var h = '<div class="due-modal">';
  h += '<div class="due-modal-title">💵 অগ্রিম টাকার আবেদন</div>';
  h += '<div style="font-size:11px;color:var(--mt2);margin-bottom:10px">মাস: '+_monthLabelBn(v.month)+' — অনুমোদন হলে এই মাসের বেতন থেকে কেটে নেওয়া হবে</div>';
  h += '<div class="att-salary-form-row"><label>পরিমাণ (৳)</label><input type="number" id="adv-amount" placeholder="যেমন: ২০০০" min="1"></div>';
  h += '<div class="att-salary-form-row"><label>কারণ / নোট (ঐচ্ছিক)</label><input type="text" id="adv-note" maxlength="120" placeholder="যেমন: পারিবারিক প্রয়োজন"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:10px">';
  h += '<button class="btn btn-gh btn-w" onclick="document.body.removeChild(document.getElementById(\'adv-modal\'))">বাতিল</button>';
  h += '<button class="btn btn-bl btn-w" onclick="submitAdvanceRequest(\''+scopeId+'\')">জমা দিন</button>';
  h += '</div></div>';
  modal.innerHTML = h;
  document.body.appendChild(modal);
  setTimeout(function(){ var f=document.getElementById('adv-amount'); if(f) f.focus(); }, 60);
}

async function submitAdvanceRequest(scopeId) {
  var v = ATT_VIEWS[scopeId]; if (!v) return;
  var amount = Number((document.getElementById('adv-amount')||{}).value) || 0;
  var note = ((document.getElementById('adv-note')||{}).value || '').trim();
  if (amount <= 0) return toast('সঠিক পরিমাণ লিখুন');

  // Self-PIN confirmation — verifies it is really the logged-in person
  // submitting the request before it is sent to the Owner for approval.
  var pinOk = await confirmSelfPin('আবেদন নিশ্চিত করতে আপনার নিজের PIN দিন');
  if (!pinOk) return;

  var m = document.getElementById('adv-modal'); if (m) document.body.removeChild(m);
  showOvl('পাঠানো হচ্ছে...');
  var r = await apiPost('/api/attendance?action=advance-request', {
    userKey: S.userId, userName: S.userName, role: S.role, amount: amount, month: v.month, note: note
  });
  hideOvl();
  if (!r || !r.ok) return toast((r&&r.error)||'ব্যর্থ');
  toast('✅ আবেদন মালিকের কাছে পাঠানো হয়েছে');
  loadAttScope(scopeId);
}
function _isoOnly(iso) { return iso ? String(iso).slice(0,10) : ''; }

async function attApproveDay(scopeId, dateStr) {
  var v = ATT_VIEWS[scopeId]; if (!v) return;
  var pinOk = await confirmOwnerPin('এই দিনের বেতন অনুমোদন করতে Owner PIN দিন');
  if (!pinOk) return;
  var reason = prompt('কারণ লিখুন (যেমন: সকালে পাঞ্চ করতে ভুলে গিয়েছিল)') || '';
  showOvl('অনুমোদন হচ্ছে...');
  var r = await apiPost('/api/attendance?action=day-override', {
    userKey: v.userKey, workdayDate: dateStr, reason: reason, approvedBy: S.userName || 'owner'
  });
  hideOvl();
  if (!r || !r.ok) return toast((r&&r.error)||'ব্যর্থ');
  var m = document.getElementById('att-day-modal'); if (m) document.body.removeChild(m);
  toast('✅ দিনটি অনুমোদন করা হয়েছে');
  loadAttScope(scopeId);
}

  var r = await apiPost('/api/attendance?action=salary-set', {
    userKey: v.userKey, userName: v.userName, month: v.month,
    salaryPerDay: salaryPerDay, bonusEnabled: bonusEnabled,
    dailyBonusAmt: dailyBonusAmt, perfectBonusAmt: perfectBonusAmt, latePenaltyAmt: latePenaltyAmt,
    noGapBonusAmt: noGapBonusAmt,
    setBy: S.userName || 'owner'

  hideOvl();
  if (!r || !r.ok) return toast((r&&r.error)||'ব্যর্থ');
  var m = document.getElementById('salset-modal'); if (m) document.body.removeChild(m);
  toast('✅ বেতন সেট হয়েছে');
  loadAttScope(scopeId);
}

async function ownerPaySalary(scopeId) {
  var v = ATT_VIEWS[scopeId]; if (!v || !v.salary) return;
  var payAmt = (typeof v.salary.payable === 'number') ? v.salary.payable : v.salary.total;
  var pinOk = await confirmOwnerPin(esc(v.userName)+' এর ৳'+fm(payAmt)+' পরিশোধ নিশ্চিত করতে Owner PIN দিন');
  if (!pinOk) return;
  if (!confirm(v.userName+' — '+_monthLabelBn(v.month)+' এর ৳'+fm(payAmt)+' পরিশোধিত হিসাবে চিহ্নিত করবেন?')) return;
  showOvl('সেভ হচ্ছে...');
  var r = await apiPost('/api/attendance?action=salary-pay', {
    userKey: v.userKey, userName: v.userName, month: v.month, amount: payAmt, paidBy: S.userName || 'owner'
  });
  hideOvl();
  if (!r || !r.ok) return toast((r&&r.error)||'ব্যর্থ');
  toast('✅ পরিশোধ রেকর্ড হয়েছে');
  loadAttScope(scopeId);
}

// ── Background location ping while app is open (free, §14) ──────────
// Rewritten to be self-healing: watchPosition on mobile WebViews can go
// silently quiet (OS battery throttling, app backgrounded then resumed,
// GPS radio hiccup) without ever firing an error callback — relying on it
// alone caused "sometimes updates, sometimes doesn't". Now every tick
// actively re-checks freshness and forces a fresh fix if the watch has
// gone stale, and the watch itself is periodically torn down/re-armed.
var _locWatchId = null, _locTimer = null, _locRearmTimer = null;
var _lastCoords = null, _lastCoordsAt = 0;

function startLocationTracking() {
  if (_locTimer !== null) return; // already running
  if (!['manager','so','dsr'].includes(S.role)) return;
  if (!navigator.geolocation) return;

  _armWatch();
  _sendLocationPing(); // attempt immediately
  _locTimer = setInterval(_sendLocationPing, 60000); // every ~60s
  _locRearmTimer = setInterval(_armWatch, 300000); // re-arm watch every 5 min, just in case
}

function _armWatch() {
  if (_locWatchId !== null) { try { navigator.geolocation.clearWatch(_locWatchId); } catch(e){} }
  try {
    _locWatchId = navigator.geolocation.watchPosition(function(pos) {
      _lastCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      _lastCoordsAt = Date.now();
    }, function(err) { /* silent — permission denied or temporarily unavailable */ },
    { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
  } catch(e) {}
}

async function _sendLocationPing() {
  var coords = _lastCoords;
  var fresh = _lastCoordsAt && (Date.now() - _lastCoordsAt < 100000);
  if (!fresh) {
    // The passive watch hasn't produced anything recent — actively force
    // a fresh GPS read instead of silently skipping this cycle.
    var forced = await _getCoords(12000).catch(function(){ return null; });
    if (forced) { coords = forced; _lastCoords = forced; _lastCoordsAt = Date.now(); }
  }
  if (!coords) return; // couldn't get a fix this cycle — try again next tick
  try {
    await apiPost('/api/attendance?action=location-ping', {
      userKey: S.userId, userName: S.userName, role: S.role,
      lat: coords.lat, lng: coords.lng
    });
  } catch(e) { /* network hiccup — next tick will retry */ }
}

// ── Live Map — Leaflet + free tiles, styled like a familiar maps app ─
function _gmapHtml(id) {
  return '<div class="gmap-wrap">'
       +   '<div class="gmap-box" id="'+id+'"></div>'
       +   '<div class="gmap-legend" id="'+id+'-legend"></div>'
       +   '<button class="gmap-layer-btn" id="'+id+'-layerbtn" onclick="toggleMapLayer(\''+id+'\')">🛰️ স্যাটেলাইট</button>'
       +   '<button class="gmap-fit-btn" onclick="loadLiveMap(\''+id+'\', _gmapViewerRole[\''+id+'\'], _gmapSoId[\''+id+'\'])" title="সবাইকে দেখান">⤢</button>'
       + '</div>'
       + '<div class="gmap-people" id="'+id+'-people"></div>';
}
var _leafletMaps = {};
var _gmapViewerRole = {}; // remembers which viewerRole each map container was loaded with, for the "fit all" button
var _gmapSoId = {}; // remembers the soId (when viewerRole==='so') for the "fit all" button
var TILE_STREET = { url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', opts:{ maxZoom:20, subdomains:'abcd' } };
var TILE_SAT    = { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', opts:{ maxZoom:20 } };

function toggleMapLayer(containerId) {
  var mm = _leafletMaps[containerId]; if (!mm) return;
  mm.satMode = !mm.satMode;
  mm.map.removeLayer(mm.tileLayer);
  var t = mm.satMode ? TILE_SAT : TILE_STREET;
  mm.tileLayer = L.tileLayer(t.url, t.opts).addTo(mm.map);
  var btn = document.getElementById(containerId+'-layerbtn');
  if (btn) btn.innerHTML = mm.satMode ? '🗺️ স্ট্রিট' : '🛰️ স্যাটেলাইট';
}

// Tap a name in the staff list → fly straight to their pin, no manual hunting on the map
function flyToPerson(containerId, userKey) {
  var mm = _leafletMaps[containerId]; if (!mm || !mm.markerByKey[userKey]) return;
  var mk = mm.markerByKey[userKey];
  mm.map.flyTo(mk.getLatLng(), 17, { duration: 0.6 });
  setTimeout(function(){ mk.openPopup(); }, 650);
}

async function loadLiveMap(containerId, viewerRole, soId) {
  var box = document.getElementById(containerId); if (!box || typeof L === 'undefined') return;
  _gmapViewerRole[containerId] = viewerRole;
  _gmapSoId[containerId] = soId || '';
  var locUrl = '/api/attendance?action=location-list&viewerRole='+viewerRole;
  if (viewerRole === 'so' && soId) locUrl += '&soId='+encodeURIComponent(soId);
  var [locR, offR] = await Promise.all([
    apiGet(locUrl),
    apiGet('/api/attendance?action=office-get')
  ]);
  var locs = (locR && locR.ok) ? locR.locations : [];
  var office = (offR && offR.ok) ? offR.office : null;

  // If the tab re-rendered, the old container div was destroyed and a new
  // one with the same id exists now — the cached Leaflet instance is stale.
  if (_leafletMaps[containerId] && _leafletMaps[containerId].map.getContainer() !== box) {
    try { _leafletMaps[containerId].map.remove(); } catch(e) {}
    delete _leafletMaps[containerId];
  }

  if (!_leafletMaps[containerId]) {
    var map = L.map(containerId, { zoomControl:true, attributionControl:false });
    var tileLayer = L.tileLayer(TILE_STREET.url, TILE_STREET.opts).addTo(map);
    _leafletMaps[containerId] = { map: map, tileLayer: tileLayer, satMode: false, markers: [], markerByKey: {} };
  }
  var mm = _leafletMaps[containerId];
  mm.markers.forEach(function(m){ mm.map.removeLayer(m); });
  mm.markers = []; mm.markerByKey = {};

  var pts = [];
  if (office) {
    var officeIcon = L.divIcon({ className:'', html:'<div style="font-size:22px;transform:translate(-50%,-90%)">🏢</div>', iconSize:[0,0] });
    var om = L.marker([office.lat, office.lng], { icon: officeIcon }).addTo(mm.map)
      .bindPopup('<div class="gmap-pin-pop"><b>🏢 অফিস</b><br>রেডিয়াস: '+office.radiusM+'মি</div>');
    mm.markers.push(om);
    L.circle([office.lat, office.lng], { radius: office.radiusM, color:'#0D47A1', fillColor:'#0D47A1', fillOpacity:.08, weight:1 }).addTo(mm.map);
    pts.push([office.lat, office.lng]);
  }
  locs.forEach(function(p) {
    var color = ROLE_COLORS[p.role] || '#546E7A';
    var t = String(p.thumb||'').trim();
    var hasPhoto = t.length>10 && (t.indexOf('data:image')===0 || t.indexOf('http')===0);
    var innerHtml = hasPhoto
      ? '<img src="'+t+'" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%" onerror="this.style.display=\'none\'">'
      : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">'+(ROLE_ICONS[p.role]||'📍')+'</div>';
    var icon = L.divIcon({
      className:'', iconSize:[0,0],
      html:'<div style="width:30px;height:30px;border-radius:50%;background:'+color+';border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);overflow:hidden;font-size:14px;transform:translate(-50%,-50%)">'+innerHtml+'</div>'
    });
    var mk = L.marker([p.lat, p.lng], { icon: icon }).addTo(mm.map)
      .bindTooltip(esc(p.userName||p.userKey), { permanent:true, direction:'top', offset:[0,-16], className:'gmap-name-label' })
      .bindPopup('<div class="gmap-pin-pop"><b>'+esc(p.userName||p.userKey)+'</b><br>'+(ROLE_LABELS[p.role]||p.role)+'<br><span style="color:#888">সর্বশেষ: '+_fmtHM(p.updatedAt)+'</span></div>');
    mm.markers.push(mk);
    mm.markerByKey[p.userKey] = mk;
    pts.push([p.lat, p.lng]);
  });

  if (pts.length > 1) {
    mm.map.fitBounds(pts, { padding:[40,40], maxZoom:15 });
  } else if (pts.length === 1) {
    mm.map.setView(pts[0], 15); // neighbourhood-level context instead of zooming in tight on one point
  } else {
    mm.map.setView([23.8103, 90.4125], 12); // Dhaka fallback
  }
  setTimeout(function(){ mm.map.invalidateSize(); }, 80);

  var legend = document.getElementById(containerId+'-legend');
  if (legend) {
    var seenRoles = {}; locs.forEach(function(p){ seenRoles[p.role]=1; });
    var lh = '';
    Object.keys(seenRoles).forEach(function(r){ lh += '<span><span class="gmap-dot" style="background:'+(ROLE_COLORS[r]||'#546E7A')+'"></span>'+(ROLE_LABELS[r]||r)+'</span>'; });
    if (office) lh += '<span>🏢 অফিস</span>';
    legend.innerHTML = lh;
  }

  // Tap a name → fly straight to that person's pin (no manual hunting on the map)
  var peopleEl = document.getElementById(containerId+'-people');
  if (peopleEl) {
    if (!locs.length) {
      peopleEl.innerHTML = '<div style="font-size:11px;color:var(--mt2);padding:6px 2px">এখনো কারো লাইভ লোকেশন পাওয়া যায়নি</div>';
    } else {
      var ph = '';
      locs.forEach(function(p) {
        ph += '<button class="gmap-chip" onclick="flyToPerson(\''+containerId+'\',\''+p.userKey+'\')">'
            + personAvatar(p.thumb, p.role, 20)
            + esc(p.userName||p.userKey) + '<span class="gmap-chip-time">'+_fmtHM(p.updatedAt)+'</span></button>';
      });
      peopleEl.innerHTML = ph;
    }
  }
}

// ── Notice ticker engine (smooth, seamless, pixel-based) ──────────────
var _tickerRAF = null;
function _tickerStart() {
  if (_tickerRAF) { cancelAnimationFrame(_tickerRAF); _tickerRAF = null; }
  var el = document.getElementById('notice-ticker-el');
  if (!el) return;
  var track = el.parentElement; // .notice-track
  var trackW = track.clientWidth;
  var textW  = el.scrollWidth;
  var px = trackW + 10; // start fully off-screen right
  var speed = 55; // px/second — comfortable reading pace
  var last = null;
  el.style.transform = 'translateX(' + px + 'px)';
  function tick(ts) {
    if (last === null) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05); // cap at 50ms to avoid jumps after tab switch
    last = ts;
    px -= speed * dt;
    if (px < -(textW + 20)) { px = trackW + 10; } // seamless loop — reset instantly
    el.style.transform = 'translateX(' + px + 'px)';
    _tickerRAF = requestAnimationFrame(tick);
  }
  _tickerRAF = requestAnimationFrame(tick);
}

// ── Shared boxed-option-grid renderer — turns a list of {id,lbl}
// tabs into tappable boxes (icon + label) instead of a cramped,
// free-flowing wrap of text buttons. `lbl` is "ICON লেবেল" — the
// first space splits the emoji from the text. `onClickExpr(id)`
// returns the raw JS to run on tap (same pattern as inline onclick
// elsewhere in this file). ──────────────────────────────────────
function _navBoxBar(tabs, activeId, onClickExpr) {
  var h = '<div class="nav-box-grid">';
  tabs.forEach(function(tb) {
    var sp = tb.lbl.indexOf(' ');
    var ic = sp > -1 ? tb.lbl.slice(0, sp) : tb.lbl;
    var lb = sp > -1 ? tb.lbl.slice(sp + 1) : '';
    h += '<div class="nav-box ' + (activeId === tb.id ? 'active' : '') + '" onclick="' + onClickExpr(tb.id) + '">';
    h += '<div class="nb-ic">' + ic + '</div><div class="nb-lb">' + esc(lb) + '</div></div>';
  });
  h += '</div>';
  return h;
}

function loadSoDash() {
  if (!S.soTxDate) S.soTxDate = iso(new Date());
  if (!S.soTxFrom) S.soTxFrom = iso(new Date());
  if (!S.soTxTo)   S.soTxTo   = iso(new Date());
  showOvl('লোড হচ্ছে...');
  Promise.all([
    apiGet('/api/dashboard?action=load-all'),
    apiGet('/api/dashboard?role=so&userId='+encodeURIComponent(S.userId)),
    apiGet('/api/sr-payments?srId='+encodeURIComponent(S.userId)),
    apiGet('/api/expenses?action=deposit-get')
  ]).then(function(res) {
    hideOvl();
    var allData=res[0], soData=res[1], pays=res[2], dep=res[3];
    if (allData.ok) { S.products=allData.products||[]; S.srs=allData.srs||[]; S.stockMap=allData.stockMap||{}; }

// SO taps into a modal listing this road's shops, each with a one-tap
// "✅ ভিজিট করা হয়েছে" button (api/shops.js action=visit-log) — SOs
// don't carry stock, so there's no sale to auto-log a visit from.
async function _openRoadDutyShops(roadId) {
  showOvl('লোড হচ্ছে...');
  var r = await apiGet('/api/shops?action=search&q=&roadId='+encodeURIComponent(roadId));
  var vr = await apiGet('/api/shops?action=visit-log-list&roadId='+encodeURIComponent(roadId));
  hideOvl();
  var shops = (r && r.ok) ? (r.shops||[]) : [];
  var visited = {};
  if (vr && vr.ok) (vr.visits||[]).forEach(function(v){ if (v.visitRole==='so') visited[v.shopId]=true; });
  var modal = document.createElement('div');
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){ if (e.target === modal) document.body.removeChild(modal); };
  var h = '<div class="due-modal"><div class="due-modal-title">🏪 রোডের শপ — ভিজিট লগ করুন</div>';
  if (!shops.length) h += '<div style="text-align:center;padding:16px;color:var(--mt2)">এই রোডে কোনো শপ নেই</div>';
  else shops.forEach(function(s){
    var done = !!visited[s.id];
    h += '<div class="due-item"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">'+esc(s.name)+'</div>';
    h += '<div style="font-size:11px;color:var(--mt2)">'+esc(s.address||'')+'</div></div>';
    if (done) h += '<span style="font-size:12px;color:var(--gr);font-weight:700">✓ ভিজিট হয়েছে</span>';
    else h += '<button class="btn btn-am btn-sm" onclick="_logSoVisit(\''+s.id+'\',this)">✅ ভিজিট করা হয়েছে</button>';
    h += '</div>';
  });
  h += '<button class="btn btn-gh btn-w" style="margin-top:10px" onclick="document.body.removeChild(document.querySelector(\'.due-modal-bg\'))">বন্ধ</button></div>';
  modal.innerHTML = h;
  document.body.appendChild(modal);
}
async function _logSoVisit(shopId, btn) {
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  var r = await apiPost('/api/shops', { action:'visit-log', shopId: shopId, role:'so', visitorId: S.userId, visitorName: S.userName||'' });
  if (r && r.ok) {
    if (btn) { btn.outerHTML = '<span style="font-size:12px;color:var(--gr);font-weight:700">✓ ভিজিট হয়েছে</span>'; }
    toast('✅ ভিজিট লগ হয়েছে');
  } else { toast((r&&r.error)||'ব্যর্থ'); if (btn) { btn.disabled = false; btn.textContent = '✅ ভিজিট করা হয়েছে'; } }
}

function soPsAddItem() { _soPsItems.push({productId:'',cases:'',pcs:''}); renderSoDash(); }
function soPsRemoveItem(i) { _soPsItems.splice(i,1); renderSoDash(); }

async function soSubmitSale() {
  var cust=(document.getElementById('so-ps-cust')||{}).value||'';
  var dt=(document.getElementById('so-ps-dt')||{}).value||iso(new Date());
  var slip=(document.getElementById('so-ps-slip')||{}).value||'';
  S.soPsCust=cust; S.soPsDate=dt; S.soPsSlip=slip;
  var items=[];
  for (var i=0;i<_soPsItems.length;i++){
    var it=_soPsItems[i];
    if (!it.productId) continue;
    var prod=S.products.find(function(p){return p.id===it.productId;});
    if (!prod) continue;
    var cs=num(it.cases), pc=num(it.pcs);
    if (!cs&&!pc) continue;
    var totalUnits=cs*(num(prod.caseSize)||1)+pc;
    items.push({productId:prod.id,productName:prod.name,sku:prod.sku,cases:cs,pcs:pc,totalUnits:totalUnits,purchasePrice:prod.purchasePrice,sellingPrice:prod.sellingPrice});
  }
  if (!items.length) return toast('অন্তত একটি পণ্য যোগ করুন');
  if (!cust.trim()) return toast('কাস্টমার নাম দিন');
  showOvl('সংরক্ষণ হচ্ছে...');
  var r=await apiPost('/api/transactions',{type:'point_sale',srId:S.userId,srName:S.userName+' → '+cust.trim(),date:dt,slipNo:slip,items:items});
  hideOvl();
  if (!r||!r.ok) return toast(r&&r.error||'ব্যর্থ');
  toast('✅ বিক্রয় সংরক্ষিত'); _soPsItems=[{productId:'',cases:'',pcs:''}]; S.stockMap={};
  loadSoDash();
}

function _soStock() {
  var h='<div class="ct">📦 স্টক ও মূল্য তালিকা</div>';
  h+='<div class="card" style="padding:0;overflow:hidden">';
  var totalV=0, totalB=0, totalPcs=0;
  S.products.forEach(function(p){
    var stk=S.stockMap[p.id]||0, cs=num(p.caseSize)||1;
    var cases=Math.floor(stk/cs), rem=stk%cs;
    var sv=stk*num(p.sellingPrice), bv=stk*num(p.purchasePrice);
    totalV+=sv; totalB+=bv; totalPcs+=stk;
    var sc=stk>10?'var(--gr)':stk>0?'var(--am)':'var(--re)';
    var alert=num(p.lowStockAlert)>0&&stk<=num(p.lowStockAlert), ti=thumbImg(p,'8px');
    h+='<div class="sku-row"><div class="sku-i">'+(ti||'📦')+'</div>';
    h+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12px">'+esc(p.name)+(alert?'<span class="low-alert">কম!</span>':'')+'</div>';
    h+='<div style="font-size:10px;color:var(--mt2)">'+esc(p.sku)+' · বিক্রয়: ৳'+fm(p.sellingPrice)+'/পিস · ক্রয়: ৳'+fm(p.purchasePrice)+'/পিস</div>';
    h+='<div style="font-size:11px;font-weight:600;color:'+sc+';margin-top:2px">';
    if (stk>0){ if(cases)h+=cases+' '+(p.unitType||'কেস')+' '; if(rem)h+=rem+' পিস'; } else h+='স্টক নেই';
    h+='</div></div>';
    h+='<div style="text-align:right"><div style="font-size:12px;font-weight:700;color:var(--bl)">'+fn(stk)+' পিস</div><div style="font-size:10px;color:var(--gr)">৳'+fm(sv)+'</div></div></div>';
  });
  h+='<div style="padding:10px 12px;background:var(--grl);border-top:2px solid var(--gr)">';
  h+='<div style="display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin-bottom:3px"><span>মোট স্টক</span><span style="color:var(--bl)">'+fn(totalPcs)+' পিস</span></div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:11px"><span>মোট মূল্য (বিক্রয়)</span><span style="color:var(--gr);font-weight:700">৳'+fm(totalV)+'</span></div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:2px"><span>মোট মূল্য (ক্রয়)</span><span style="color:var(--mt);font-weight:700">৳'+fm(totalB)+'</span></div>';
  h+='</div></div>';
  return h;
}

  if (S.dsrRoadDuty === undefined) {
    try {
      var rd = await apiGet('/api/dashboard?role=dsr&userId='+encodeURIComponent(S.userId));
      S.dsrRoadDuty = (rd && rd.ok) ? (rd.roadDuty || []) : [];
    } catch (e) { S.dsrRoadDuty = []; }
  }
  var tab = S.dsrTab || 'tx';
  // V33 ম্যাপ ট্যাব ছাড়া অন্য কোথাও গেলে লাইভ GPS watch বন্ধ করে দাও —
  // ব্যাটারি/ডেটা অপচয় এড়াতে।
  if (tab !== 'map' && S.dsrMapWatchId != null) {
    try { navigator.geolocation.clearWatch(S.dsrMapWatchId); } catch(e) {}
    S.dsrMapWatchId = null;
  }
  if (tab === 'tx') {
    _loadDsrTxView();
  } else if (tab === 'dues') {
    _loadDsrDuesView();
  } else if (tab === 'products') {
    _loadDsrProductsView();
  } else if (tab === 'shop') {
    _loadDsrShopView();
  } else if (tab === 'register') {
    _loadDsrRegisterView();
  } else if (tab === 'map') {
    _loadDsrMapView();
  }
}

async function _loadDsrTxView() {
  var mode = S.dsrMode || 'today';
  var date  = S.dsrDate  || iso(new Date());
  var from2 = S.dsrFrom  || iso(new Date());
  var to2   = S.dsrTo    || iso(new Date());
  var qFrom = mode==='range' ? from2 : date;
  var qTo   = mode==='range' ? to2   : date;
  showOvl('লোড হচ্ছে...');
  var r = await apiGet('/api/transactions?from='+qFrom+'&to='+qTo+'&srId='+encodeURIComponent(S.userId));
  hideOvl();
  if (!Array.isArray(r)) return toast('লোড ব্যর্থ');
  S.dsrData = r;
  renderDsrTxTab(r, qFrom, qTo);
}

function renderDsrTxTab(txs, fromDate, toDate) {
  var mode = S.dsrMode || 'today';
  var given={cases:0,pcs:0,rev:0}, ret={cases:0,pcs:0}, dmg={cases:0,pcs:0};
  txs.forEach(function(tx){
    if (tx.type==='give')   { given.cases+=num(tx.cases); given.pcs+=num(tx.pcs); given.rev+=num(tx.totalRevenue); }
    if (tx.type==='return') { ret.cases+=num(tx.cases);   ret.pcs+=num(tx.pcs); }
    if (tx.type==='damage') { dmg.cases+=num(tx.cases);   dmg.pcs+=num(tx.pcs); }
  });

  var h=_dsrTabBar()+_radtWidgetHtml()+'<div class="ct">🚚 আমার লেনদেন</div>';
  h+='<div class="card" style="padding:10px"><div class="seg" style="margin-bottom:10px">';
  h+='<button class="sbt '+(mode==='today'?'active':'')+'" onclick="S.dsrMode=\'today\';S.dsrDate=\''+iso(new Date())+'\';;_loadDsrTxView()">আজ</button>';
  h+='<button class="sbt '+(mode==='custom'?'active':'')+'" onclick="S.dsrMode=\'custom\';renderDsrTxTab(S.dsrData||[],S.dsrDate,S.dsrDate)">তারিখ</button>';
  h+='<button class="sbt '+(mode==='range'?'active':'')+'" onclick="S.dsrMode=\'range\';renderDsrTxTab(S.dsrData||[],S.dsrFrom,S.dsrTo)">রেঞ্জ</button>';
  h+='</div>';
  if (mode==='custom') {
    h+='<div class="fg"><label class="fl">তারিখ নির্বাচন</label><input type="date" id="dsr-dt" value="'+(S.dsrDate||iso(new Date()))+'" onchange="S.dsrDate=this.value;_loadDsrTxView()"></div>';
  } else if (mode==='range') {
    h+='<div class="g2"><div class="fg"><label class="fl">শুরু</label><input type="date" id="dsr-fr" value="'+(S.dsrFrom||iso(new Date()))+'" onchange="S.dsrFrom=this.value"></div>';
    h+='<div class="fg"><label class="fl">শেষ</label><input type="date" id="dsr-to" value="'+(S.dsrTo||iso(new Date()))+'" onchange="S.dsrTo=this.value"></div></div>';

  }
  h+='</div>';

  var dateLabel=(fromDate===toDate)?fmtBn(fromDate):fmtBn(fromDate)+' — '+fmtBn(toDate);
  h+='<div style="font-size:12px;font-weight:700;color:var(--mt);margin-bottom:8px">লেনদেন সারসংক্ষেপ — '+dateLabel+'</div>';
  h+='<div class="dsr-grid">';
  h+='<div class="dsr-cell" style="border-color:var(--bl)"><div style="font-size:11px;color:var(--bl);font-weight:700;margin-bottom:6px">📤 দেওয়া</div><div class="dv2" style="color:var(--bl)">'+given.cases+'<small style="font-size:12px">ইউনিট</small></div><div class="ds2">'+given.pcs+' পিস</div></div>';
  h+='<div class="dsr-cell" style="border-color:var(--te)"><div style="font-size:11px;color:var(--te);font-weight:700;margin-bottom:6px">↩️ ফেরত</div><div class="dv2" style="color:var(--te)">'+ret.cases+'<small style="font-size:12px">ইউনিট</small></div><div class="ds2">'+ret.pcs+' পিস</div></div>';
  h+='<div class="dsr-cell" style="border-color:var(--re)"><div style="font-size:11px;color:var(--re);font-weight:700;margin-bottom:6px">⚠️ ড্যামেজ</div><div class="dv2" style="color:var(--re)">'+dmg.cases+'<small style="font-size:12px">ইউনিট</small></div><div class="ds2">'+dmg.pcs+' পিস</div></div>';
  h+='</div>';
  h+='<div style="font-size:12px;font-weight:600;color:var(--gr);margin-bottom:6px">মোট বিক্রয় মূল্য: ৳'+fm(given.rev)+'</div>';
  if (txs.length) {
    h+='<div class="ct">লেনদেনের বিস্তারিত</div><div class="card" style="padding:0;overflow:hidden">';
    var grp={};
    txs.forEach(function(tx){ if(!grp[tx.txId])grp[tx.txId]={type:tx.type,srName:tx.srName,date:tx.date,items:[]}; grp[tx.txId].items.push(tx); });

      h+='<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>'+txBdg(g.type)+'</span><span style="font-size:11px;color:var(--mt)">'+esc(fmtBn(g.date))+'</span></div>';
      g.items.forEach(function(item){
        var pUnit=(function(){var pr=S.products.find(function(x){return x.id===item.productId;});return pr?pr.unitType||'কেস':'ইউনিট';})();
        h+='<div style="font-size:11px;color:var(--mt);padding:2px 0">'+esc(item.productName)+': '+(num(item.cases)?item.cases+pUnit+' ':'')+(num(item.pcs)?item.pcs+'পিস':'')+' ('+fn(item.totalUnits)+' পিস)</div>';
      });
      h+='</div>';
    });
    h+='</div>';
  } else {
    h+='<div class="card" style="text-align:center;color:var(--mt2);padding:24px">এই তারিখে কোনো লেনদেন নেই</div>';

  document.getElementById('pg-dash').innerHTML = h;
  setTimeout(_tickerStart, 50);
  _fillRadtWidget();
}

async function renderShopsMapTab() {
  var el = document.getElementById('pg-shopsmap'); if (!el) return;
  el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--mt2)">লোড হচ্ছে...</div>';
  if (!S.srs || !S.srs.length) {
    var allR = await apiGet('/api/dashboard?action=load-all');
    if (allR && allR.ok) { S.products = allR.products||[]; S.srs = allR.srs||[]; S.stockMap = allR.stockMap||{}; }
  }
  if (S.role === 'so' && !S.soAssignedDsrs) {
    var soR = await apiGet('/api/dashboard?role=so&userId='+encodeURIComponent(S.userId));
    if (soR && soR.ok) S.soAssignedDsrs = soR.assignedDsrs || [];
  }
  if (!S.roadsLoaded) {
    var rr = await apiGet('/api/srs?action=roads');
    if (rr && rr.ok) S.roads = rr.roads || [];
    S.roadsLoaded = true;
  }
  if (!S.shopsMapMode) S.shopsMapMode = 'list';
  _paintShopsMapTab();
}

function _shopsScopeDsrIds() {
  if (S.role === 'so') return (S.soAssignedDsrs||[]).map(function(d){ return String(d.id||d.userKey||''); });
  return null; // owner/manager — no scope restriction by default
}

    return;
  }

async function _shopsMapSearch() {
  S.shopsQ = (document.getElementById('shmap-q')||{}).value || S.shopsQ || '';
  S.shopsRoadFilter = (document.getElementById('shmap-road')||{}).value || '';
  var url = '/api/shops?action=search&q=' + encodeURIComponent(S.shopsQ || '');
  if (S.shopsRoadFilter) url += '&roadId=' + encodeURIComponent(S.shopsRoadFilter);
  var scopeIds = _shopsScopeDsrIds();
  if (S.role === 'so' && !S.shopsAll && scopeIds && scopeIds.length === 1) url += '&dsrId=' + encodeURIComponent(scopeIds[0]);
  var r = await apiGet(url);
  var shops = (r && r.ok) ? (r.shops || []) : [];
  if (S.role === 'so' && !S.shopsAll && scopeIds && scopeIds.length > 1) {
    var idSet = {}; scopeIds.forEach(function(id){ idSet[id]=1; });
    shops = shops.filter(function(s){ return idSet[s.assignedDsrId]; });
  }
  S.shopsList = shops;
  var countEl = document.getElementById('shmap-count'); if (countEl) countEl.textContent = '('+shops.length+'টি)';
  _paintShopsList(shops);
  // Update #27 — show the viewer's own live GPS position on the map too,
  // best-effort (never blocks the shop list from rendering if denied).
  var myCoords = await _getCoords(6000).catch(function(){ return null; });
  // Update #26 — today's visit ticks, colour-coded SO vs. DSR.
  var visitUrl = '/api/shops?action=visit-log-list';
  if (S.shopsRoadFilter) visitUrl += '&roadId=' + encodeURIComponent(S.shopsRoadFilter);
  var vr = await apiGet(visitUrl);
  var visitsByShop = {};
  if (vr && vr.ok) {
    (vr.visits || []).forEach(function(vis) {
      if (!visitsByShop[vis.shopId]) visitsByShop[vis.shopId] = { so: false, dsr: false };
      visitsByShop[vis.shopId][vis.visitRole] = true;
    });
  }
  _plotShopsOnMap('shmap-map', shops, myCoords, visitsByShop);
}

function _paintShopsList(shops) {
  var el = document.getElementById('shmap-list'); if (!el) return;
  if (!shops.length) { el.innerHTML = '<div class="card" style="text-align:center;padding:24px;color:var(--mt2)">কোনো শপ পাওয়া যায়নি</div>'; return; }
  var h = '';
  shops.forEach(function(s) {
    h += '<div class="sku-row" style="cursor:pointer" onclick="_openShopDetail(\''+s.id+'\')">';
    h += '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">'+esc(s.name)+' <span style="font-size:10px;color:var(--mt2)">('+esc(s.shopNo)+')</span></div>';
    h += '<div style="font-size:11px;color:var(--mt2)">🚚 '+esc(s.assignedDsrName||'—')+(s.address?' · '+esc(s.address):'')+'</div></div>';
    if (num(s.totalDue) > 0) h += '<div style="font-size:12px;font-weight:700;color:var(--re)">৳'+fm(s.totalDue)+'</div>';

async function _openShopDetail(id) {

// ── Update #37 — Owner-only shop edit (name + phone; GPS locked) ──────
async function _shopEditSave(shopId) {

  toast('✅ শপ মুছে ফেলা হয়েছে');

// QR encodes the shop's stable id — scanning it (or typing the shop
// number) is how the DSR "search" flow (§11/§20) instantly finds it again.
function _showShopQr(shop) {
  var wrap = document.getElementById('shreg-qr-wrap'); if (!wrap) return;
  wrap.innerHTML = '<div class="ct">🏷️ '+esc(shop.name)+' — QR স্টিকার</div>'
    + '<div class="card" style="text-align:center;padding:18px">'
    + '<div id="shreg-qr-box" style="display:inline-block;background:#fff;padding:10px;border-radius:8px"></div>'
    + '<div style="font-weight:700;margin-top:8px">'+esc(shop.shopNo)+'</div>'
    + '<div style="font-size:11px;color:var(--mt2)">এই QR প্রিন্ট করে দোকানে লাগিয়ে দিন — পরে স্ক্যান করে সহজে দোকান খুঁজে পাওয়া যাবে</div>'
    + '<button class="btn btn-gh btn-sm" style="margin-top:10px" onclick="window.print()">🖨️ প্রিন্ট করুন</button>'
    + '</div>';
  setTimeout(function() {
    var box = document.getElementById('shreg-qr-box');
    if (box && typeof QRCode !== 'undefined') new QRCode(box, { text: shop.id, width: 180, height: 180 });
  }, 30);
}

// ── QR Scan — uses the native BarcodeDetector API (no extra library,
//    free). Falls back to a friendly message on devices/WebViews that
//    don't support it yet, so typing the shop number always still works.
var _qrStream = null;
function scanShopQr(onFound) {
  if (!('BarcodeDetector' in window)) {
    toast('📷 এই ডিভাইসে সরাসরি QR স্ক্যান সমর্থিত নয় — দোকান নম্বর টাইপ করে খুঁজুন');
    return;
  }
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center';
  var video = document.createElement('video');
  video.style.cssText = 'width:100%;max-width:420px;border-radius:10px';
  video.setAttribute('playsinline', 'true');
  var closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ বন্ধ করুন';
  closeBtn.style.cssText = 'margin-top:16px;padding:10px 20px;border-radius:8px;border:none;background:#fff;font-weight:700;font-size:13px';
  var hint = document.createElement('div');
  hint.textContent = '📷 QR কোডের দিকে ক্যামেরা ধরুন';
  hint.style.cssText = 'color:#fff;font-size:13px;margin-bottom:10px';
  overlay.appendChild(hint); overlay.appendChild(video); overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);

  function cleanup() {
    if (_qrStream) { _qrStream.getTracks().forEach(function(t){ t.stop(); }); _qrStream = null; }
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  }
  closeBtn.onclick = cleanup;

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(stream) {
    _qrStream = stream;
    video.srcObject = stream;
    video.play();
    var detector = new BarcodeDetector({ formats: ['qr_code'] });
    var scanning = true;
    (function tick() {
      if (!scanning) return;
      detector.detect(video).then(function(codes) {
        if (codes && codes.length) {
          scanning = false;
          var value = codes[0].rawValue;
          cleanup();
          onFound(value);
        } else {
          requestAnimationFrame(tick);
        }
      }).catch(function(){ requestAnimationFrame(tick); });
    })();
  }).catch(function() {
    toast('📷 ক্যামেরা চালু করা যায়নি — পারমিশন দিন অথবা নম্বর টাইপ করুন');
    cleanup();
  });
}


function _shopsMapHtml(id) {

       + '</div>';
}

function _plotShopsOnMap(containerId, shops, myCoords, visitsByShop) {
  var box = document.getElementById(containerId); if (!box || typeof L === 'undefined') return;
  if (_leafletMaps[containerId] && _leafletMaps[containerId].map.getContainer() !== box) {
    try { _leafletMaps[containerId].map.remove(); } catch(e) {}
    delete _leafletMaps[containerId];
  }
  if (!_leafletMaps[containerId]) {
    var map = L.map(containerId, { zoomControl:true, attributionControl:false });
    var tileLayer = L.tileLayer(TILE_STREET.url, TILE_STREET.opts).addTo(map);
    _leafletMaps[containerId] = { map: map, tileLayer: tileLayer, satMode:false, markers:[], markerByKey:{}, meMarker:null };
  }
  var mm = _leafletMaps[containerId];
  mm.markers.forEach(function(m){ mm.map.removeLayer(m); });
  mm.markers = [];
  var pts = [];
  (shops||[]).forEach(function(s) {
    if (s.lat == null || s.lng == null) return;
    var due = num(s.totalDue);
    var color = due > 0 ? '#C62828' : '#2E7D32';
    // Update #26 — same-day visit ticks: a small badge for each role that
    // has already visited this shop TODAY. Auto-resets on its own at
    // midnight since the visitsByShop map is always built from a
    // today-only server query — nothing to clear client-side.
    var v = (visitsByShop && visitsByShop[s.id]) || null;
    var badges = '';
    if (v && v.so)  badges += '<div style="position:absolute;top:-6px;left:-6px;width:15px;height:15px;border-radius:50%;background:#1565C0;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff">S</div>';
    if (v && v.dsr) badges += '<div style="position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;background:#2E7D32;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff">D</div>';
    var icon = L.divIcon({
      className:'', iconSize:[0,0],
      html:'<div style="position:relative;width:28px;height:28px;border-radius:50%;background:'+color+';border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:14px;transform:translate(-50%,-50%)">🏪'+badges+'</div>'
    });
    // 🧭 নেভিগেট — Google Maps turn-by-turn directions straight to this
    // shop's saved GPS pin, opened in a new tab (works with or without
    // the Google Maps app installed — falls back to maps.google.com).
    var navUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lng;
    var visitNote = '';
    if (v && (v.so || v.dsr)) {
      visitNote = '<br><span style="color:#1565C0;font-size:11px">✓ আজ ভিজিট: '+(v.so?'SO ':'')+(v.dsr?'DSR':'')+'</span>';
    }
    var mk = L.marker([s.lat, s.lng], { icon: icon }).addTo(mm.map)
      .bindTooltip(esc(s.name), { permanent:true, direction:'top', offset:[0,-16], className:'gmap-name-label' })
      .bindPopup('<div class="gmap-pin-pop"><b>'+esc(s.name)+'</b><br>'+esc(s.shopNo)+'<br>🚚 '+esc(s.assignedDsrName||'—')+(due>0?'<br><span style="color:#C62828">বাকি: ৳'+fm(due)+'</span>':'<br><span style="color:#2E7D32">বাকি নেই</span>')+visitNote+'<br><a href="'+navUrl+'" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#1565C0;text-decoration:none">🧭 নেভিগেট করুন</a></div>');
    mm.markers.push(mk);
    pts.push([s.lat, s.lng]);
  });
  // Own live position (Update #27 — every map viewer sees their own GPS
  // position too, not just the DSR map tab) — a distinct blue dot,
  // separate from the shop markers array so re-plotting shops on a GPS
  // tick doesn't need to touch it, and vice versa (see _setMyPositionMarker).
  if (myCoords && myCoords.lat != null && myCoords.lng != null) {
    _setMyPositionMarker(containerId, myCoords);
    pts.push([myCoords.lat, myCoords.lng]);
  }
  if (pts.length > 1) mm.map.fitBounds(pts, { padding:[40,40], maxZoom:15 });
  else if (pts.length === 1) mm.map.setView(pts[0], 15);
  else mm.map.setView([23.8103, 90.4125], 12);
  setTimeout(function(){ mm.map.invalidateSize(); }, 80);
}

// ── My own live GPS position on a shops map (DSR "ম্যাপ" tab, V33) — a
// pulsing blue dot, kept separate from the shop marker layer so it can
// be updated on every geolocation tick without re-plotting every shop. ──
function _setMyPositionMarker(containerId, coords) {
  var mm = _leafletMaps[containerId]; if (!mm) return;
  var icon = L.divIcon({
    className:'', iconSize:[0,0],
    html:'<div style="width:20px;height:20px;border-radius:50%;background:#1565C0;border:3px solid #fff;box-shadow:0 0 0 4px rgba(21,101,192,.35),0 1px 5px rgba(0,0,0,.4);transform:translate(-50%,-50%)"></div>'
  });
  if (mm.meMarker) {
    mm.meMarker.setLatLng([coords.lat, coords.lng]);
  } else {
    mm.meMarker = L.marker([coords.lat, coords.lng], { icon: icon, zIndexOffset: 1000 }).addTo(mm.map)
      .bindTooltip('📍 আপনি এখানে', { permanent:false, direction:'top', offset:[0,-12] });
  }
}


async function _loadDsrShopView() {
  if (!S.dsrShopMode) S.dsrShopMode = 'list';
  if (S.dsrShopMode === 'detail') return _renderDsrShopDetail();
  if (S.dsrShopMode === 'sale')   return _renderDsrShopSale();
  if (S.dsrShopMode === 'slip')   return _renderDsrSaleSlip();
  showOvl('দোকান খোঁজা হচ্ছে...');
  // Auto-detect: fetch the DSR's current GPS and ask shops.js to sort by
  // proximity, so the nearest shop naturally surfaces first — if it's
  // genuinely close by, we can prompt "you're here, sell now?" below.
  var coords = await _getCoords(8000).catch(function(){ return null; });
  S.dsrShopCoords = coords;
  var url = '/api/shops?action=search&q=' + encodeURIComponent(S.dsrShopQ || '');
  if (!S.dsrShopAll) url += '&dsrId=' + encodeURIComponent(S.userId);
  if (coords) url += '&lat=' + coords.lat + '&lng=' + coords.lng;
  // শপ ভিজিট + ক্লিয়ার প্লেট মার্জ — দুটোই একসাথে লোড হয় এখন, যাতে
  // এক পেজেই দোকানের তালিকা এবং আজকের বাকি আদায়ের অংশ দেখা যায়।
  var plateUrl = '/api/shops?action=clear-plate&dsrId=' + encodeURIComponent(S.userId);
  var results = await Promise.all([apiGet(url), apiGet(plateUrl)]);
  var r = results[0], pr = results[1];
  hideOvl();
  S.dsrShopList  = (r  && r.ok)  ? (r.shops || []) : [];
  S.dsrPlateData = (pr && pr.ok) ? pr : { plate: [], totalAmount: 0, shopCount: 0 };
  _paintDsrShopList();
}
function dsrShopSearch() { S.dsrShopQ = v('dsr-shop-q'); _loadDsrShopView(); }
function dsrToggleShopMap() {
  S.dsrShopMapOpen = !S.dsrShopMapOpen;
  _paintDsrShopList();
  if (S.dsrShopMapOpen) setTimeout(function(){ _plotShopsOnMap('dsr-shop-map', S.dsrShopList || []); }, 60);
}
// ── V29 — GPS auto-detection radius: shops within this distance of the
//    DSR's current position count as "nearby" for the auto-select /
//    chooser flow below. One named constant so it's easy to tune. ──
var DSR_NEARBY_RADIUS_M = 300;
function _dsrNearbyShops() {
  if (!S.dsrShopCoords) return [];
  return (S.dsrShopList || []).filter(function(s) { return s.distanceM != null && s.distanceM <= DSR_NEARBY_RADIUS_M; });
}
// Shared row renderer — used both for manual search results and for the
// "multiple shops nearby, pick one" chooser, so the two look identical.

function _paintDsrShopList() {

  var hasQuery = !!(S.dsrShopQ && S.dsrShopQ.trim());

  // ── V29 — GPS auto-detection. DSR যখন কোনো শপে ভিজিটে থাকে, তার
  //    বর্তমান লোকেশনের কাছাকাছি (৩০০মি এর মধ্যে) নিবন্ধিত শপ স্বয়ংক্রিয়
  //    ভাবে খোঁজা হয়। একটাই কাছাকাছি শপ থাকলে সেটা নিজে থেকেই বেছে

  if (!hasQuery && nearby.length === 1) {
    var nearest = nearby[0];
    h += '<div class="card" style="background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border:1.5px solid var(--gr);margin-bottom:10px">';
    h += '<div style="font-size:13px;font-weight:700;color:#2E7D32">📍 আপনি বর্তমানে <b>'+esc(nearest.name)+'</b> ('+esc(nearest.shopNo)+') এর কাছে আছেন</div>';

    h += '<button class="btn btn-gr btn-w btn-sm" style="margin-top:8px" onclick="dsrOpenShop(\''+nearest.id+'\').then(function(){setTimeout(dsrStartSale,50)})">🛒 এখনই পণ্য দিন</button>';
    h += '</div>';
  } else if (!hasQuery && nearby.length > 1) {
    h += '<div class="card" style="background:#FFF8E1;border:1.5px solid var(--am);margin-bottom:10px">';
    h += '<div style="font-size:13px;font-weight:700;color:#E65100">📍 আপনার কাছাকাছি '+nearby.length+'টি শপ পাওয়া গেছে</div>';
    h += '<div style="font-size:11px;color:var(--mt)">সঠিক শপটি বেছে নিন</div>';
    h += '</div>';
    h += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">';

  } else if (!hasQuery) {
    h += '<div class="card" style="text-align:center;color:var(--mt2);padding:14px;margin-bottom:10px">📍 আপনার কাছাকাছি কোনো নিবন্ধিত শপ পাওয়া যায়নি — নিচে খুঁজুন</div>';
  }

  h += '<div class="card">';

  h += '<button class="btn btn-gh btn-w btn-sm" style="margin-bottom:6px" onclick="scanShopQr(function(id){dsrOpenShop(id)})">📷 QR স্ক্যান করুন</button>';
  h += '<button class="btn btn-gh btn-w btn-sm" style="margin-bottom:6px" onclick="dsrToggleShopMap()">🗺️ ' + (S.dsrShopMapOpen ? 'ম্যাপ লুকান' : 'ম্যাপে দেখুন') + '</button>';
  h += '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mt);margin-bottom:8px"><input type="checkbox" style="width:auto" ' + (S.dsrShopAll ? 'checked' : '') + ' onchange="S.dsrShopAll=this.checked;dsrShopSearch()"> সব দোকানে খুঁজুন (শুধু আমার নয়)</label>';
  h += '<button class="btn btn-bl btn-w btn-sm" onclick="dsrShopSearch()">🔍 খুঁজুন</button>';

  h += '<div class="fg"><label class="fl">ঠিকানা (ঐচ্ছিক)</label><input id="dqr-addr" placeholder="এলাকার নাম" maxlength="300"></div>';

function dsrSaleTogProd(id) { S.dsrSaleSel[id] = !S.dsrSaleSel[id]; if (!S.dsrSaleQty[id]) S.dsrSaleQty[id] = { cases: '', pcs: '' }; _dsrSaleRefreshList(); _refreshDsrSaleTotal(); }

function _dsrSaleUpdateLineTotal(id) {

  // এই পণ্যের মোট কমিশন/ছাড়ও সাথে সাথে আপডেট হওয়া দরকার।

function _dsrSaleComputeBill() {
  // V29 — কমিশন ও ছাড় এখন "প্রতি কেস" হারে ধরা হয়:
  //   মোট কমিশন = কমিশন/কেস × বিক্রিত কেসের সংখ্যা
  //   মোট ছাড়   = ছাড়/কেস   × বিক্রিত কেসের সংখ্যা
  var subtotal = 0, commission = 0, productDiscount = 0;
  Object.keys(S.dsrSaleSel || {}).forEach(function(pid) {
    if (!S.dsrSaleSel[pid]) return;
    var p = S.products.find(function(x){return x.id===pid;}); if (!p) return;
    var q = S.dsrSaleQty[pid] || {}, cs = num(p.caseSize) || 1, ca = num(q.cases) || 0, pc = num(q.pcs) || 0, u = ca * cs + pc;
    subtotal += u * num(p.sellingPrice);
    commission += (num(S.dsrSaleComm[pid]) || 0) * ca;
    productDiscount += (num(S.dsrSaleDisc[pid]) || 0) * ca;
  });
  var invoiceDiscount = num(S.dsrSaleDiscount) || 0;
  var discount = invoiceDiscount + productDiscount;
  var payable = Math.max(0, subtotal - discount - commission);
  return { subtotal: subtotal, discount: discount, invoiceDiscount: invoiceDiscount, productDiscount: productDiscount, commission: commission, payable: payable };
}

//  Only OWNER can set/edit any target — total or per-SO split.

// V41 update 7 — "month" for salary/targets/reports means the company pay
// cycle: 26th of the previous month → 25th of the labeled month (e.g.
// period "2026-06" = 2026-05-26 → 2026-06-25), not the plain calendar
// month. Mirrors cyclePeriodForDate/cyclePeriodBounds in api/_lib/db.js —
// keep both in sync if this logic ever changes.
function _cyclePeriodForDate(dateStr) {
  var p = dateStr.split('-').map(Number), y = p[0], m = p[1], d = p[2];
  if (d <= 25) return y + '-' + String(m).padStart(2,'0');
  var nm = m + 1, ny = y;
  if (nm > 12) { nm = 1; ny++; }
  return ny + '-' + String(nm).padStart(2,'0');
}
function _cyclePeriodToday() { return _cyclePeriodForDate(_localISODate()); }
function _cycleBounds(period) {
  var p = period.split('-').map(Number), y = p[0], m = p[1];
  var py = y, pm = m - 1;
  if (pm < 1) { pm = 12; py--; }
  return { start: py+'-'+String(pm).padStart(2,'0')+'-26', end: y+'-'+String(m).padStart(2,'0')+'-25' };
}
// Every ISO date string in a cycle period, inclusive, in order.
function _cycleDates(period) {
  var b = _cycleBounds(period), out = [], cur = b.start;
  while (cur <= b.end) { out.push(cur); cur = _addDaysISO(cur, 1); }
  return out;
}
function _addDaysISO(dateStr, delta) {
  var p = dateStr.split('-').map(Number);
  var dt = new Date(Date.UTC(p[0], p[1]-1, p[2]));
  dt.setUTCDate(dt.getUTCDate() + delta);
  return dt.toISOString().slice(0,10);
}
function _curPeriod() {
  return _cyclePeriodToday();
}

          h += '</div>';
        }
        h += '</div>';
      });
    }
  }

  h += '<div style="text-align:center;font-size:10px;color:var(--mt2);padding:8px">'+esc(S.shopName||'AXIION DMS')+' · Powered by <span style="color:#FFD700;font-weight:700">AXIION DMS</span></div>';

}

// ════════════════════════════════════════════════════
//  SO ORDERING → APPROVAL → VAN-LOAD WORKFLOW (AXIION §13)
//  One page, three faces:
//   - SO      : place a new order + track its own orders
//   - Owner/Manager : review pending/modified orders, edit qty, assign
//                      a DSR and approve; watch loading progress live

//               can also request a quantity change before loading starts

function _ordStatusBdg(o) {
  if (o.status === 'pending')          return '<span class="bdg b-am">⏳ অপেক্ষমান</span>';
  if (o.status === 'modified_pending')  return '<span class="bdg b-am">✏️ পরিবর্তন পর্যালোচনায়</span>';
  if (o.status === 'rejected')          return '<span class="bdg b-re">❌ বাতিল</span>';
  if (o.status === 'approved') {
    if (o.loadStatus === 'loaded')        return '<span class="bdg b-gr">📦 লোড সম্পন্ন</span>';
    if (o.loadStatus === 'load_complete') return '<span class="bdg b-am">✅ DSR সম্পন্ন করেছে — নিশ্চিতকরণ প্রয়োজন</span>';
    if (o.loadStatus === 'loading')       return '<span class="bdg b-bl">🚚 লোড হচ্ছে</span>';
    return '<span class="bdg b-bl">✅ অনুমোদিত — লোড শুরু হয়নি</span>';
  }
  return '<span class="bdg b-am">'+esc(o.status)+'</span>';
}
function _ordItemsSummary(items) {
  return (items||[]).map(function(it){
    return esc(it.productName)+': '+(num(it.cases)?it.cases+'কেস ':'')+(num(it.pcs)?it.pcs+'পিস':'')+' ('+fn(it.totalUnits)+' পিস)';
  }).join('<br>');
}

function renderOrdersTab() {

// ── SO: place new order + track own orders ─────────────────────────
// Rebuilt to reuse the exact same checklist-select pattern as the
// দেওয়া (Give) screen: tick the products needed from a scrollable
// checklist first, then enter case/pcs amounts only for the products
// actually selected — no more one-by-one dropdown picking.
var _ordItems = [];
var _ordItemSeq = 1;
function renderOrdersSO() {
  if (!S.ordTab) S.ordTab = 'new';
  var el = document.getElementById('pg-orders'); if (!el) return;
  var h = '<div class="seg" style="margin-bottom:12px">';
  h += '<button class="sbt '+(S.ordTab==='new'?'active':'')+'" onclick="S.ordStep=1;S.ordTab=\'new\';renderOrdersSO()">➕ নতুন অর্ডার</button>';
  h += '<button class="sbt '+(S.ordTab==='mine'?'active':'')+'" onclick="S.ordTab=\'mine\';loadMySOOrders()">📋 আমার অর্ডার</button>';
  h += '</div>';

  if (S.ordTab === 'new') _renderOrdBuilder();
  else loadMySOOrders();
}
function _renderOrdBuilder() {
  var body = document.getElementById('ord-body'); if (!body) return;
  if (!S.ordStep) S.ordStep = 1;

  // Step 1 — checklist: tick every product needed for the van, exactly
  // like the দেওয়া (Give) product-selection screen.
  if (S.ordStep === 1) {
    var selCnt = Object.values(S.ordSelProd).filter(Boolean).length;
    var rows = S.products.map(function(p){
      var stk=S.stockMap[p.id]||0, swc=stk>10?'stk-ok':stk>0?'stk-lo':'stk-no';
      var ti=thumbImg(p,'8px');
      return '<div class="psel" onclick="ordTogProd(\''+p.id+'\')">'
        +'<input type="checkbox" '+(S.ordSelProd[p.id]?'checked':'')+' onclick="event.stopPropagation();S.ordSelProd[\''+p.id+'\']=this.checked">'
        +'<div class="sku-i" style="width:36px;height:36px;font-size:16px">'+(ti||'📦')+'</div>'
        +'<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12px">'+esc(p.name)+'</div>'
        +'<div style="font-size:10px;color:var(--mt2)">'+esc(p.sku)+' · ৳'+fm(p.sellingPrice)+'/পিস</div></div>'
        +'<div class="'+swc+'" style="font-size:12px;flex-shrink:0">'+fn(stk)+' পিস</div></div>';
    }).join('');
    var h = '<div class="ct">➕ নতুন অর্ডার — পণ্য বাছাই করুন</div>';
    h += '<div class="card" style="padding:0;overflow:hidden">'
      +'<div class="psel-all"><input type="checkbox" id="ord-chk-all" '+(selCnt===S.products.length&&S.products.length?'checked':'')+' onchange="ordSelAll()"><label for="ord-chk-all" style="cursor:pointer;flex:1">সব পণ্য বাছাই করুন</label><span>'+selCnt+'টি</span></div>'
      +rows+'</div>';
    h += '<button class="btn btn-bl btn-w" style="margin-top:10px" onclick="ordNext1()">পরিমাণ দিন →</button>';
    body.innerHTML = h;
    return;
  }

  // Step 2 — amount per selected product (case/pcs), then submit the order.
  var rows2 = '';
  _ordItems.forEach(function(item,i){
    var p=S.products.find(function(pr){return pr.id===item.productId;}); if(!p)return;
    var ti=thumbImg(p,'7px');
    rows2+='<div class="prow"><div style="display:flex;gap:8px;align-items:center;margin-bottom:7px">'
      +'<div class="sku-i" style="width:34px;height:34px;font-size:14px">'+(ti||'📦')+'</div>'
      +'<div><div style="font-weight:700;font-size:12px">'+esc(p.name)+'</div>'
      +'<div style="font-size:10px;color:var(--mt2)">৳'+fm(p.sellingPrice)+'/পিস · স্টক:'+fn(S.stockMap[p.id]||0)+'পিস</div></div></div>'
      +'<div class="prow-ins">'
      +'<div><label class="fl">'+(p.unitType||'কেস')+'</label><input type="number" inputmode="decimal" min="0" placeholder="০" value="'+(item.cases||'')+'" oninput="_ordItems['+i+'].cases=this.value;updOrdSub('+i+')"></div>'
      +'<div><label class="fl">পিস</label><input type="number" inputmode="decimal" min="0" placeholder="০" value="'+(item.pcs||'')+'" oninput="_ordItems['+i+'].pcs=this.value;updOrdSub('+i+')"></div>'
      +'</div>'
      +'<div class="prow-c" id="ord-sub-'+i+'">—</div>'
      +'</div>';
  });
  var h2 = '<div class="ct">➕ নতুন অর্ডার — পরিমাণ দিন</div>' + rows2
    + '<div id="ord-grand" style="background:var(--bll);border-radius:7px;padding:9px 12px;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--bl);display:flex;justify-content:space-between"><span>মোট: ০ পিস</span><span>৳০</span></div>'
    + '<div style="display:flex;gap:7px"><button class="btn btn-gh" onclick="S.ordStep=1;_renderOrdBuilder()">← পণ্য বদলান</button><button class="btn btn-gr" style="flex:1" onclick="ordSubmit()">✅ অর্ডার করুন</button></div>';
  body.innerHTML = h2;
  setTimeout(function(){ _ordItems.forEach(function(_,i){ updOrdSub(i); }); }, 0);
}
function ordTogProd(id){ S.ordSelProd[id]=!S.ordSelProd[id]; _renderOrdBuilder(); }
function ordSelAll(){ var el=document.getElementById('ord-chk-all'); if(!el)return; S.products.forEach(function(p){ S.ordSelProd[p.id]=el.checked; }); _renderOrdBuilder(); }
function ordNext1(){
  var sel=S.products.filter(function(p){return S.ordSelProd[p.id];});
  if (!sel.length) return toast('কমপক্ষে একটি পণ্য বাছাই করুন');
  var ex={}; _ordItems.forEach(function(i){ ex[i.productId]={cases:i.cases,pcs:i.pcs}; });
  _ordItems = sel.map(function(p){ return {productId:p.id, cases:ex[p.id]?ex[p.id].cases:'', pcs:ex[p.id]?ex[p.id].pcs:''}; });
  S.ordStep = 2; _renderOrdBuilder();
}
function updOrdSub(i) {
  var item=_ordItems[i]; if (!item) return;
  var p=S.products.find(function(pr){return pr.id===item.productId;}); if(!p)return;
  var cs=num(p.caseSize)||1, ca=num(item.cases)||0, pc=num(item.pcs)||0, u=ca*cs+pc;
  var amt=u*num(p.sellingPrice);
  var el=document.getElementById('ord-sub-'+i);
  if(el)el.textContent=u>0?( ca?ca+(p.unitType||'কেস')+'×'+cs+'='+u+'পিস':u+'পিস')+' · ৳'+fm(amt):'—';
  var grand=0,grandU=0;
  _ordItems.forEach(function(it){
    var pr=S.products.find(function(r){return r.id===it.productId;}); if(!pr)return;
    var c2=num(pr.caseSize)||1, ca2=num(it.cases)||0, pc2=num(it.pcs)||0, u2=ca2*c2+pc2;
    grand+=u2*num(pr.sellingPrice); grandU+=u2;
  });
  var gEl=document.getElementById('ord-grand');
  if(gEl)gEl.innerHTML='<span>মোট: '+grandU+' পিস</span><span>৳'+fm(grand)+'</span>';
}
async function ordSubmit() {
  var items=[];
  for (var i=0;i<_ordItems.length;i++){
    var it=_ordItems[i]; if (!it.productId) continue;
    var prod=S.products.find(function(p){return p.id===it.productId;}); if (!prod) continue;
    var cs=num(it.cases), pc=num(it.pcs); if (!cs&&!pc) continue;
    var totalUnits=cs*(num(prod.caseSize)||1)+pc;
    items.push({id:'oi'+(_ordItemSeq++)+'_'+Date.now(), productId:prod.id, productName:prod.name, sku:prod.sku, cases:cs, pcs:pc, totalUnits:totalUnits, purchasePrice:prod.purchasePrice, sellingPrice:prod.sellingPrice});
  }
  if (!items.length) return toast('অন্তত একটি পণ্যের পরিমাণ দিন');
  showOvl('জমা হচ্ছে...');
  var r = await apiPost('/api/sr-payments', {action:'order_submit', soId:S.userId, soName:S.userName, items:items});
  hideOvl();
  if (!r||!r.ok) return toast(r&&r.error||'ব্যর্থ');
  toast('✅ অর্ডার জমা হয়েছে — অনুমোদনের অপেক্ষায়');
  _renderOrderMemo(items); // Update #29 — auto-generated, downloadable/printable memo
  _ordItems=[]; S.ordSelProd={}; S.ordStep=1;
  S.ordTab='mine'; loadMySOOrders();
}
// ══════════════════════════════════════════════════
//  Update #29 — Auto-Generated Order Memo
//  When an SO completes (submits) an order, build a timestamped memo —
//  Product → Quantity (case+piece) → Rate/case → Total, with a footer
//  of total case count + grand total — and hand it to the app's
//  existing html2canvas-based share panel (_showSlipSharePanel), which
//  already gives print/save-as-JPG/share for free.
// ══════════════════════════════════════════════════
function _renderOrderMemo(items) {
  var now = new Date();
  var memoNo = 'ORD-' + iso(now).replace(/-/g,'') + '-' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
  var totalCases = 0, grand = 0;
  var rows = items.map(function(it){
    var p = S.products.find(function(x){return x.id===it.productId;});
    var cs = (p ? num(p.caseSize) : 0) || 1;
    var caseRate = num(it.sellingPrice) * cs;
    var lineTotal = num(it.totalUnits) * num(it.sellingPrice);
    var ca = num(it.cases) || Math.floor(num(it.totalUnits)/cs);
    totalCases += ca; grand += lineTotal;
    return '<tr>'
      + '<td style="padding:6px 8px;border-bottom:1px solid #E5E7EB;font-size:12px">' + esc(it.productName) + '</td>'
      + '<td style="padding:6px 8px;border-bottom:1px solid #E5E7EB;font-size:12px;text-align:center">' + fmtCasePcs(it.totalUnits, cs) + '</td>'
      + '<td style="padding:6px 8px;border-bottom:1px solid #E5E7EB;font-size:12px;text-align:right">৳' + fm(caseRate) + '</td>'
      + '<td style="padding:6px 8px;border-bottom:1px solid #E5E7EB;font-size:12px;text-align:right;font-weight:700">৳' + fm(lineTotal) + '</td>'
      + '</tr>';
  }).join('');
  var html = ''
    + '<div style="font-family:sans-serif;background:#fff;padding:18px;max-width:420px">'
    + '<div style="text-align:center;margin-bottom:10px"><div style="font-size:16px;font-weight:700;color:#1E88E5">AXIION — অর্ডার মেমো</div>'
    + '<div style="font-size:11px;color:#666">'+esc(S.shopName||'AXIION DMS')+'</div>'
    + '<div style="font-size:10px;color:#999;margin-top:4px">মেমো নং: ' + memoNo + ' · ' + fmtBn(iso(now)) + ' ' + _fmtHM(now.toISOString()) + '</div></div>'
    + '<div style="font-size:11px;margin-bottom:6px"><b>SO:</b> ' + esc(S.userName || '') + '</div>'
    + '<table style="width:100%;border-collapse:collapse">'
    + '<thead><tr style="background:#F3F4F6">'

      h+='<div class="g2"><div class="fg" style="margin:0"><label class="fl">কেস</label><input type="number" min="0" value="'+(it.cases||0)+'" oninput="vanItemChange('+i+',\'cases\',this.value)"></div>';
      h+='<div class="fg" style="margin:0"><label class="fl">পিস</label><input type="number" min="0" value="'+(it.pcs||0)+'" oninput="vanItemChange('+i+',\'pcs\',this.value)"></div></div></div>';
    });
    h+='<div style="display:flex;gap:8px;margin-top:6px">';
    h+='<button class="btn btn-gh" style="flex:1" onclick="_vanEditId=null;_vanEditItems=null;_paintVanOrders(true)">বাতিল</button>';
    h+='<button class="btn btn-am" style="flex:2" onclick="vanSubmitModify(\''+o.id+'\')">📨 পরিবর্তনের অনুরোধ পাঠান</button>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}
async function vanComplete(id) {

  showOvl('পাঠানো হচ্ছে...');
  var r = await apiPost('/api/sr-payments', {action:'van_load_complete', id:id});
  hideOvl();
  if (!r||!r.ok) return toast(r&&r.error||'ব্যর্থ');
  toast('✅ লোড সম্পন্ন — ম্যানেজার/মালিকের নিশ্চিতকরণের অপেক্ষায়');
  renderOrdersDSR();
}
function vanStartEdit(id) {
  var o = (_vanOrders||[]).find(function(x){return x.id===id;});
  if (!o) return;
  _vanEditId = id;
  _vanEditItems = JSON.parse(JSON.stringify(o.items));
  _paintVanOrders(true);
}
function vanItemChange(i, field, val) {
  if (!_vanEditItems || !_vanEditItems[i]) return;
  _vanEditItems[i][field] = num(val);
  var it = _vanEditItems[i];
  var prod = S.products.find(function(p){return p.id===it.productId;});
  var caseSize = prod?(num(prod.caseSize)||1):1;
  it.totalUnits = num(it.cases)*caseSize + num(it.pcs);
}
async function vanSubmitModify(id) {
  showOvl('পাঠানো হচ্ছে...');
  var r = await apiPost('/api/sr-payments', {action:'order_modify', id:id, items:_vanEditItems, requestedBy:'dsr'});
  hideOvl();
  if (!r||!r.ok) return toast(r&&r.error||'ব্যর্থ');
  toast('📨 পরিবর্তনের অনুরোধ ম্যানেজার/মালিকের কাছে পাঠানো হয়েছে');
  _vanEditId=null; _vanEditItems=null;
  renderOrdersDSR();
}
