<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>দোকানদার — এক অ্যাপে পুরো ব্যবসা</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E7145">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --header:#1E7145; --header-dark:#164F32;
    --hdr1:#123D26; --hdr2:#25995C;              /* gradient header pair */
    --hdr1-dark:#0A1F14; --hdr2-dark:#1B6B41;
    --body-bg:#EFF4F1; --body-bg-dark:#0E1310;
    --card:#FFFFFF; --card-dark:#1E241F;
    --bdr:#DCE6E0; --bdr-dark:#2B352E;
    --text:#12201A; --text-dark:#E8EDE9;
    --muted:#6B786F; --muted-dark:#8FA090;
    --success:#3B6D11; --success-dark:#8FC24E;
    --danger:#C1443C; --danger-dark:#E2695C;
    --gold:#F2B84B;
    --kpi-blue:#0C447C;
    --blue-bg:#E6F1FB; --blue-fg:#185FA5;
    --amber-bg:#FAEEDA; --amber-fg:#854F0B;
    --pink-bg:#FBEAF0; --pink-fg:#993556;
    --purple-bg:#EEEDFE; --purple-fg:#534AB7;
    --teal-bg:#E1F5EE; --teal-fg:#0F6E56;
    --terra-bg:#FAECE7; --terra-fg:#993C1D;
    --radius:16px;
    --shadow:0 2px 10px rgba(18,32,26,.07);
    --shadow-dark:0 2px 10px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hind Siliguri',sans-serif;background:var(--body-bg);color:var(--text);transition:background .2s,color .2s;}
  body.dark{background:var(--body-bg-dark);color:var(--text-dark);}
  .brand{font-family:'Baloo Da 2',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:24px;}
  .hidden{display:none !important;}

  /* ── Header (persistent app shell — never re-rendered on navigation) ── */
  .topbar{background:linear-gradient(100deg,var(--hdr1),var(--hdr2));color:#fff;padding:14px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(18,61,38,.25);}
  body.dark .topbar{background:linear-gradient(100deg,var(--hdr1-dark),var(--hdr2-dark));}
  .avatar{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
  .avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;}
  .topbar .shopinfo{flex:1;min-width:0;}
  .topbar .shopname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .shopid{font-size:11px;opacity:.85;}
  .gear{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .backbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .menu-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .refresh-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;transition:transform .5s ease;}
  .refresh-btn.spinning{animation:spin .6s linear;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .hdr-datetime-bar{background:rgba(0,0,0,.12);color:#fff;font-size:11.5px;padding:5px 16px;text-align:right;position:sticky;top:64px;z-index:19;letter-spacing:.2px;}
  body.dark .hdr-datetime-bar{background:rgba(0,0,0,.28);}
  .hidden-shell{display:none !important;}

  /* ── Side menu drawer (☰ top-left) ─────────────────────────────────── */
  .menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s;}
  .menu-overlay.show{opacity:1;pointer-events:auto;}
  .side-menu{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--card);z-index:30;transform:translateX(-105%);transition:transform .25s ease;box-shadow:2px 0 18px rgba(0,0,0,.2);display:flex;flex-direction:column;}
  body.dark .side-menu{background:var(--card-dark);}
  .side-menu.show{transform:translateX(0);}
  .side-menu-hdr{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;padding:22px 16px;display:flex;align-items:center;gap:12px;}
  body.dark .side-menu-hdr{background:linear-gradient(135deg,var(--hdr1-dark),var(--hdr2-dark));}
  .side-menu-hdr .sm-name{font-weight:700;font-size:15px;}
  .side-menu-hdr .sm-role{font-size:11px;opacity:.85;}
  .side-menu-close{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:8px;font-size:16px;}
  .side-menu-items{flex:1;overflow-y:auto;padding:10px 10px 0;}
  .smi{display:flex;align-items:center;gap:12px;padding:11px 12px;margin:0 0 7px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);border:1.5px solid var(--bdr);border-radius:12px;background:var(--card);transition:.12s;}
  body.dark .smi{color:var(--text-dark);background:var(--card-dark);border-color:var(--bdr-dark);}
  .smi:active{transform:scale(.98);}
  .smi .smi-ic{font-size:16px;width:28px;height:28px;border-radius:8px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .smi.active{background:var(--blue-bg);color:var(--blue-fg);border-color:var(--blue-fg);}
  body.dark .smi.active{background:rgba(24,95,165,.18);}
  .smi.active .smi-ic{background:#fff;}
  .smi.logout{color:var(--danger);background:var(--pink-bg);border-color:var(--danger);margin-top:2px;}
  .side-menu-footer{padding:10px 16px 14px;text-align:center;font-size:10.5px;color:var(--muted);border-top:1px solid var(--bdr);}
  body.dark .side-menu-footer{color:var(--muted-dark);border-color:var(--bdr-dark);}
  .side-menu-footer b{color:var(--header);}
  body.dark .side-menu-footer b{color:#8FC24E;}

  /* ── Content fade — smooths the screen swap instead of a hard blank flash */
  #app{animation:fadein .16s ease;}
  @keyframes fadein{from{opacity:.35;}to{opacity:1;}}

  /* ── Icon-tile grid ─────────────────────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 14px;}
  .tile{background:var(--card);border-radius:16px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--bdr);text-align:center;box-shadow:var(--shadow);transition:.12s;}
  body.dark .tile{background:var(--card-dark);border-color:var(--bdr-dark);box-shadow:var(--shadow-dark);}
  .tile:active{transform:scale(.96);}
  .tile .icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
  .tile span{font-size:11.5px;font-weight:700;line-height:1.25;}

  /* ── KPI section ────────────────────────────────────────── */
  .section-divider{background:linear-gradient(90deg,var(--hdr1),var(--hdr2));color:#fff;padding:10px 18px;font-weight:700;font-size:13.5px;margin-top:6px;letter-spacing:.2px;}
  body.dark .section-divider{background:linear-gradient(90deg,var(--hdr1-dark),var(--hdr2-dark));}
  .kpi-card{background:linear-gradient(135deg,var(--kpi-blue),#1665B0);color:#fff;margin:12px 14px;border-radius:18px;padding:18px;box-shadow:0 4px 16px rgba(12,68,124,.28);}
  .kpi-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .kpi-row .big{font-size:23px;font-weight:800;font-family:'Baloo Da 2';}
  .progress-track{background:rgba(255,255,255,.25);height:8px;border-radius:8px;overflow:hidden;}
  .progress-fill{background:var(--gold);height:100%;border-radius:8px;}

  /* ── Generic layout ─────────────────────────────────────── */
  .screen{padding:14px;}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1.5px solid var(--bdr);box-shadow:var(--shadow);}
  body.dark .card{background:var(--card-dark);border-color:var(--bdr-dark);box-shadow:var(--shadow-dark);}
  .card.accent-top{border-top:3px solid var(--header);}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .metric{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow);}
  body.dark .metric{background:var(--card-dark);border-color:var(--bdr-dark);}
  .metric .mv{font-size:18px;font-weight:800;margin:3px 0;}
  .metric .ml{font-size:10.5px;color:var(--muted);font-weight:600;}
  body.dark .metric .ml{color:var(--muted-dark);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .muted{color:var(--muted);font-size:12.5px;}
  body.dark .muted{color:var(--muted-dark);}
  .success{color:var(--success);} body.dark .success{color:var(--success-dark);}
  .danger{color:var(--danger);} body.dark .danger{color:var(--danger-dark);}
  h2.pagetitle{font-size:17px;margin:2px 0 12px;font-weight:700;}
  .searchbar{display:flex;align-items:center;background:var(--card);border-radius:24px;padding:10px 16px;gap:8px;margin-bottom:12px;border:1.5px solid var(--bdr);box-shadow:var(--shadow);}
  body.dark .searchbar{background:var(--card-dark);border-color:var(--bdr-dark);}
  .searchbar input{border:none;background:transparent;outline:none;flex:1;font-size:14px;color:inherit;}
  .fab{position:fixed;bottom:20px;right:calc(50% - 260px + 20px);background:linear-gradient(100deg,var(--hdr1),var(--hdr2));color:#fff;border:none;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:0 4px 14px rgba(18,61,38,.35);z-index:15;}
  @media (max-width:560px){.fab{right:20px;}}
  .list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06);}
  body.dark .list-row{border-color:rgba(255,255,255,.08);}
  .list-row:last-child{border-bottom:none;}
  .circle-avatar{width:38px;height:38px;border-radius:50%;background:var(--header);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  input[type=text],input[type=number],input[type=password],input[type=tel],input[type=date],select,textarea{
    width:100%;padding:10px 12px;border:1px solid rgba(0,0,0,.12);border-radius:10px;font-size:14px;margin-bottom:10px;background:var(--card);color:inherit;
  }
  body.dark input,body.dark select,body.dark textarea{background:var(--card-dark);border-color:rgba(255,255,255,.15);}
  label{font-size:12.5px;font-weight:600;display:block;margin-bottom:4px;color:var(--muted);}
  .btn{display:inline-block;padding:11px 18px;border-radius:11px;border:none;font-weight:700;font-size:14px;text-align:center;transition:.12s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(100deg,var(--hdr1),var(--hdr2));color:#fff;width:100%;box-shadow:0 3px 10px rgba(18,61,38,.3);}
  .btn-outline{background:transparent;border:1.5px solid var(--header);color:var(--header);width:100%;}
  .btn-full{width:100%;margin-top:4px;}
  .btn-danger{background:var(--danger);color:#fff;}
  .pill{background:linear-gradient(100deg,var(--hdr1),var(--hdr2));color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;border:none;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;}
  .badge-danger{background:#FCE7E5;color:var(--danger);}
  .badge-success{background:#E7F1DE;color:var(--success);}
  .badge-warn{background:var(--amber-bg);color:var(--amber-fg);}
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
  .tab{padding:8px 14px;border-radius:999px;background:var(--card);border:none;font-size:13px;font-weight:600;white-space:nowrap;}
  body.dark .tab{background:var(--card-dark);}
  .tab.active{background:var(--header);color:#fff;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:100;max-width:90%;text-align:center;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;max-height:88vh;overflow-y:auto;}
  body.dark .modal-sheet{background:var(--card-dark);}
  .center-screen{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:28px 22px;}
  .logo-wrap{text-align:center;margin-bottom:22px;}
  .logo-wrap .brandname{font-size:30px;font-weight:800;color:var(--header);}
  .logo-wrap .tagline{color:var(--muted);font-size:13px;margin-top:4px;}
  a.linklike{color:var(--header);font-weight:700;text-decoration:none;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th,table td{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(0,0,0,.06);}
  body.dark table th, body.dark table td{border-color:rgba(255,255,255,.08);}
  .qty-stepper{display:flex;align-items:center;gap:8px;}
  .qty-stepper button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:var(--card);font-size:16px;}
  body.dark .qty-stepper button{background:var(--card-dark);border-color:rgba(255,255,255,.2);}

  /* ── Receipt / slip (§7) — "খাতা" ruled-line texture, confined here ──── */
  .receipt-paper{
    background:#fffefb; color:#1a1a1a; font-family:'Hind Siliguri',monospace;
    padding:16px; border-radius:10px;
    background-image:repeating-linear-gradient(#fffefb 0 27px, #e8e4d8 27px 28px);
    background-position: 0 6px;
  }
  .receipt-paper.w58{ width:58mm; margin:0 auto; font-size:11px; }
  .receipt-paper.w80{ width:80mm; margin:0 auto; font-size:12px; }
  .receipt-paper .r-center{text-align:center;}
  .receipt-paper .r-shop{font-weight:800;font-size:1.25em;}
  .receipt-paper hr{border:none;border-top:1px dashed #999;margin:8px 0;}
  .receipt-paper table{width:100%;font-size:.95em;border-collapse:collapse;}
  .receipt-paper td{padding:2px 0;vertical-align:top;}
  .receipt-paper .r-qr{display:flex;justify-content:center;margin:10px 0;}
  .receipt-actions{display:flex;gap:8px;margin-top:14px;}
  .receipt-actions .btn{flex:1;}
  #scan-video-wrap{width:100%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px;}
  #scan-video-wrap video{width:100%;display:block;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;left:0;top:0;width:auto;}
    .receipt-paper{background-image:none;}
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<body>
<div id="toast-holder"></div>

<!-- ═══ Persistent app shell — lives OUTSIDE #app so it is never rebuilt
     on navigation. This is what fixes the "laggy/flashing" feel: previously
     the header was part of the per-screen HTML and was destroyed + rebuilt
     on every single tap. Now only the content below it swaps. ═══ -->
<div class="topbar hidden-shell" id="shell-topbar">
  <button class="menu-btn" id="btn-menu" aria-label="মেনু">☰</button>
  <button class="backbtn hidden-shell" id="btn-back" aria-label="ফিরে যান">←</button>
  <div class="avatar" id="hdr-avatar">?</div>
  <div class="shopinfo">
    <div class="shopname" id="hdr-title"></div>
    <div class="shopid" id="hdr-subtitle"></div>
  </div>
  <button class="refresh-btn" id="btn-refresh" aria-label="রিফ্রেশ">🔄</button>
</div>
<div class="hdr-datetime-bar hidden-shell" id="hdr-datetime-bar"><span id="hdr-datetime">…</span></div>

<div id="app"></div>

<div class="menu-overlay" id="menu-overlay"></div>
<div class="side-menu" id="side-menu">
  <div class="side-menu-hdr">
    <div class="avatar" id="sm-avatar">?</div>
    <div>
      <div class="sm-name" id="sm-shopname"></div>
      <div class="sm-role" id="sm-role"></div>
    </div>
    <button class="side-menu-close" id="btn-menu-close">✕</button>
  </div>
  <div class="side-menu-items" id="side-menu-items"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// দোকানদার (Dokandar) — frontend SPA
// Single index.html per AXIION's proven pattern (§1). Hash-based routing,
// no framework. Every /api/*.js call is action-routed exactly like the
// backend (§Open Q2's 10-file plan).
// ════════════════════════════════════════════════════════════════════════

const API = '/api';
const state = {
  token: localStorage.getItem('dokan_token') || null,
  tenant: null,
  staff: null,
  route: 'boot',
  routeParam: null,
  navHistory: [],   // for Android back-button (§19)
};

function toast(msg, isError){
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.background = '#C1443C';
  el.textContent = msg;
  document.getElementById('toast-holder').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

async function api(action, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  let url = `${API}/${opts.file}?action=${action}`;
  const headers = {'Content-Type':'application/json'};
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const fetchOpts = { method, headers };
  if(opts.query){
    const qs = new URLSearchParams(opts.query).toString();
    url += '&' + qs;
  }
  if(opts.body) fetchOpts.body = JSON.stringify(opts.body);
  try{
    const r = await fetch(url, fetchOpts);
    const j = await r.json();
    if(!j.ok && j.code === 'AUTH_REQUIRED'){ doLogout(true); }
    return j;
  }catch(e){
    return { ok:false, error: 'নেটওয়ার্ক সমস্যা — ইন্টারনেট সংযোগ পরীক্ষা করুন' };
  }
}

// ── PWA / Android back-button contract (§19) ──────────────────────────────
window.__onAndroidBack = function(){
  if(document.getElementById('side-menu').classList.contains('show')){ closeMenu(); return true; }
  if(closeTopModal()) return true;
  if(state.navHistory.length){
    const prev = state.navHistory.pop();
    render(prev.route, prev.param, true);
    return true;
  }
  return false;
};
let modalStack = [];
function closeTopModal(){
  if(modalStack.length){ const fn = modalStack.pop(); fn(); return true; }
  return false;
}

function go(route, param){
  if(state.route !== 'boot') state.navHistory.push({route: state.route, param: state.routeParam});
  render(route, param);
}

// ════════════════════════════════════════════════════════════════════════
// SHELL — persistent header/menu/refresh/clock, wired once, never rebuilt
// ════════════════════════════════════════════════════════════════════════
function wireShellOnce(){
  document.getElementById('btn-menu').onclick = openMenu;
  document.getElementById('btn-menu-close').onclick = closeMenu;
  document.getElementById('menu-overlay').onclick = closeMenu;
  document.getElementById('btn-back').onclick = ()=>window.__onAndroidBack();
  document.getElementById('btn-refresh').onclick = refreshCurrentScreen;
  updateClock();
  setInterval(updateClock, 1000);
}
function openMenu(){
  document.getElementById('side-menu').classList.add('show');
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu(){
  document.getElementById('side-menu').classList.remove('show');
  document.getElementById('menu-overlay').classList.remove('show');
}
function updateClock(){
  const el = document.getElementById('hdr-datetime');
  if(!el) return;
  const n = new Date();
  const dateStr = n.toLocaleDateString('bn-BD', {day:'numeric', month:'long', weekday:'short'});
  let h = n.getHours(), m = n.getMinutes();
  const ap = h>=12?'PM':'AM'; let h12 = h%12; if(h12===0) h12=12;
  el.textContent = `${dateStr} · ${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ap}`;
}
async function refreshCurrentScreen(){
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('spinning');
  await render(state.route, state.routeParam, true);
  toast('✅ রিফ্রেশ সম্পন্ন');
  setTimeout(()=>btn.classList.remove('spinning'), 600);
}
function showShell(show){

// ════════════════════════════════════════════════════════════════════════
// BOOT — sessions are long-lived by design (no server-side expiry); a
// person should only ever be logged out by an explicit "লগ আউট" tap, never
// just because the app was closed/backgrounded or the network hiccuped on
// reopen. So a network failure here retries instead of dropping to login —
// only a genuine AUTH_REQUIRED (invalid/expired/deactivated session) clears
// the saved token.
// ════════════════════════════════════════════════════════════════════════
wireShellOnce();
(async function boot(){
  const params = new URLSearchParams(location.search);
  if(params.get('verify')){
    return renderVerify(params.get('tenant'), params.get('invoice'));
  }
  if(state.token){
    const me = await api('me', {file:'auth'});
    if(me.ok){
      state.tenant = me.tenant; state.staff = me.staff;
      applyUiMode();
      renderSideMenu();
      return go('dashboard');
    }
    if(me.code !== 'AUTH_REQUIRED'){
      return renderBootRetry();
    }
    localStorage.removeItem('dokan_token'); state.token = null;
  }
  render('login');
})();

// Shown only when we have a saved session but couldn't reach the server —
// never shown as a plain login screen, so the person isn't misled into
// thinking they were logged out.
function renderBootRetry(){
  showShell(false);
  const app = document.getElementById('app');
  app.innerHTML = `<div class="center-screen"><div class="card" style="text-align:center;">
    <div style="font-size:34px;">📶</div>
    <h2 class="pagetitle">সংযোগ পাওয়া যাচ্ছে না</h2>
    <div class="muted" style="margin-bottom:14px;">আপনি লগ ইন আছেন — শুধু ইন্টারনেট সংযোগ যাচাই করা হচ্ছে</div>
    <button class="btn btn-primary btn-full" id="boot-retry">আবার চেষ্টা করুন</button>
  </div></div>`;
  document.getElementById('boot-retry').onclick = ()=>location.reload();
  setTimeout(()=>location.reload(), 6000);
}

// ── Public invoice verification (§7 — the QR on a printed receipt links
// here) — no login, no session, deliberately minimal info shown. ─────────
async function renderVerify(tenantId, invoiceNo){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="center-screen"><div class="card"><div class="muted">যাচাই করা হচ্ছে...</div></div></div>`;
  try{
    const r = await fetch(`${API}/pos?action=verify&tenant=${encodeURIComponent(tenantId||'')}&invoiceNo=${encodeURIComponent(invoiceNo||'')}`);
    const j = await r.json();
    if(!j.ok){

    }
    app.innerHTML = `

      <div style="font-size:40px;">✅</div>
      <h2 class="pagetitle">ইনভয়েস যাচাইকৃত</h2>

      <hr style="margin:12px 0;border:none;border-top:1px solid rgba(0,0,0,.1);">

      <div class="row"><span>তারিখ</span><b>${j.date}</b></div>
      <div class="row"><span>পণ্য সংখ্যা</span><b>${j.itemCount}</b></div>
      <div class="row" style="font-weight:800;"><span>মোট</span><b class="num">${fmtMoney(j.total)}</b></div>

function render(route, param, isBack){
  state.route = route; state.routeParam = param;
  const app = document.getElementById('app');
  const renderers = {
    boot: ()=>`<div class="center-screen"><div class="logo-wrap"><div class="brandname">দোকানদার</div><div class="tagline" style="margin-top:16px;">Developed by <b style="color:var(--header);">Axiion Technology</b></div></div></div>`,
    login: screenLogin,
    register: screenRegister,
    dashboard: screenDashboard,
    pos: screenPOS,
    receipt: screenReceipt,
    products: screenProducts,
    'product-form': screenProductForm,
    customers: screenCustomers,
    suppliers: screenSuppliers,
    purchases: screenPurchases,
    staff: screenStaff,
    attendance: screenAttendance,
    salary: screenSalary,
    expenses: screenExpenses,
    closing: screenClosing,
    reports: screenReports,
    search: screenSearch,
    settings: screenSettings,
    approvals: screenApprovals,
  };
  const fn = renderers[route] || renderers.dashboard;
  showShell(!['boot','login','register'].includes(route));
  app.innerHTML = fn(param);
  wireScreen(route, param);
  window.scrollTo(0,0);
}

function wireScreen(route, param){
  const wirers = {
    login: wireLogin, register: wireRegister,
    dashboard: wireDashboard, pos: wirePOS, receipt: wireReceipt, products: wireProducts,
    'product-form': wireProductForm, customers: wireCustomers, suppliers: wireSuppliers,
    purchases: wirePurchases, staff: wireStaff, attendance: wireAttendance, salary: wireSalary,
    expenses: wireExpenses, closing: wireClosing, reports: wireReports, search: wireSearch,
    settings: wireSettings, approvals: wireApprovals,
  };
  if(wirers[route]) wirers[route](param);
}

// `topbar()`/`wireTopbar()` are still called from every screenX()/wireX()
// exactly as before (no per-screen edits needed) — but the header they
// describe now lives in the persistent shell outside #app, so it's never
// destroyed/rebuilt on navigation. That single change is most of the
// "laggy/flashing" fix: previously the whole header (and everything else)
// unmounted and remounted on every single tap.
function topbar(title, opts){
  opts = opts || {};
  document.getElementById('btn-back').classList.toggle('hidden-shell', !opts.back);
  document.getElementById('hdr-avatar').classList.toggle('hidden-shell', !!opts.back);
  document.getElementById('hdr-avatar').textContent = (state.staff && state.staff.name || '?').slice(0,1);
  document.getElementById('hdr-title').textContent = title || (state.tenant && state.tenant.shopName) || '';
  document.getElementById('hdr-subtitle').textContent = !opts.back
    ? `${(state.staff&&roleLabel(state.staff.role))||''} · ${state.tenant?state.tenant.category:''}` : '';
  return ''; // header markup no longer part of the per-screen HTML
}
function wireTopbar(){ /* no-op now — shell buttons are wired once in wireShellOnce() */ }

        const c = list.find(x=>x.id===el.dataset.pickCust);
        posSelectedCustomerId = c.id;
        nameInp.value = c.name; phoneInp.value = c.phone||'';
        document.getElementById('pos-cust-suggest').innerHTML = '';
        selEl.textContent = `✓ বিদ্যমান কাস্টমার নির্বাচিত হয়েছে`;
      });
    }, 250);
  };
  phoneInp.oninput = clearSelection;
}
function wirePOS(){
  wireTopbar();
  cart = [];
  wireCustomerPicker();
  const input = document.getElementById('pos-search');
  let debounce;
  input.oninput = ()=>{
    clearTimeout(debounce);
    debounce = setTimeout(async ()=>{
      const q = input.value.trim();
      if(q.length<1){ document.getElementById('pos-suggest').innerHTML=''; return; }
      const r = await api('list', {file:'products', query:{q}});
      const products = (r.products||[]).slice(0,8);
      document.getElementById('pos-suggest').innerHTML = products.map(p=>`
        <div class="card list-row" data-add="${p.id}" style="cursor:pointer;">
          <div class="circle-avatar">${p.name.slice(0,1)}</div>
          <div style="flex:1;"><b>${p.name}</b><div class="muted">স্টক: ${p.current_stock} · ${fmtMoney(p.selling_price)}</div></div>
        </div>`).join('') || `<div class="muted" style="padding:8px;">পণ্য পাওয়া যায়নি</div>`;
      document.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{
        const p = products.find(x=>x.id===el.dataset.add);
        addToCart(p);
        input.value=''; document.getElementById('pos-suggest').innerHTML='';
      });
    }, 250);
  };
  document.getElementById('pos-checkout').onclick = doCheckout;
  document.getElementById('pos-scan').onclick = ()=>{
    openScanner(async (code)=>{
      const r = await api('lookup', {file:'products', query:{code}});
      if(!r.ok) return toast(r.error, true);
      addToCart(r.product);
      toast(`${r.product.name} কার্টে যোগ হয়েছে`);
    });
  };
  renderCart();
}
function addToCart(p){
  const existing = cart.find(c=>c.productId===p.id);
  if(existing) existing.qty += 1;
  else cart.push({productId:p.id, name:p.name, unit:p.unit, qty:1, unitPrice:Number(p.selling_price), purchasePrice:Number(p.purchase_price), minPrice:p.minimum_selling_price, stock:Number(p.current_stock)});
  renderCart();
}
function renderCart(){
  const el = document.getElementById('pos-cart');
  if(!cart.length){ el.innerHTML = `<div class="muted">কার্ট খালি — পণ্য খুঁজে যোগ করুন</div>`; updatePosTotal(); return; }
  el.innerHTML = cart.map((c,i)=>`
    <div class="list-row">
      <div style="flex:1;">
        <b>${c.name}</b>
        <div class="qty-stepper" style="margin-top:4px;">
          <button data-dec="${i}">−</button><span class="num">${c.qty}</span><button data-inc="${i}">+</button>
          <input type="number" data-price="${i}" value="${c.unitPrice}" style="width:80px;margin:0;padding:6px;">
        </div>
        <div class="muted">${canSeeProfit() ? 'লাভ: '+fmtMoney((c.unitPrice-c.purchasePrice)*c.qty) : ''}</div>
      </div>
      <button data-remove="${i}" style="background:none;border:none;color:var(--danger);font-size:18px;">✕</button>
    </div>`).join('');
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart[b.dataset.inc].qty++;renderCart();});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{if(cart[b.dataset.dec].qty>1)cart[b.dataset.dec].qty--;renderCart();});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(b.dataset.remove,1);renderCart();});
  document.querySelectorAll('[data-price]').forEach(inp=>inp.onchange=()=>{cart[inp.dataset.price].unitPrice=Number(inp.value);renderCart();});
  updatePosTotal();
}
function updatePosTotal(){
  const discount = Number(document.getElementById('pos-discount')?.value || 0);
  const total = cart.reduce((s,c)=>s+c.qty*c.unitPrice,0) - discount;
  const totalEl = document.getElementById('pos-total');
  if(totalEl) totalEl.textContent = fmtMoney(total);
}
async function doCheckout(){
  if(!cart.length) return toast('কার্ট খালি', true);
  const paymentMethod = document.getElementById('pos-pm').value;
  const discount = Number(document.getElementById('pos-discount').value||0);
  const total = cart.reduce((s,c)=>s+c.qty*c.unitPrice,0) - discount;

  // Resolve the customer: already picked from suggestions → use it as-is;
  // a fresh name typed in but never picked → quick-add it now; nothing
  // typed at all → stays null, i.e. a casual/direct sale (no ledger).
  let customerId = posSelectedCustomerId;
  const custName = document.getElementById('pos-cust-name').value.trim();
  const custPhone = document.getElementById('pos-cust-phone').value.trim();
  if(!customerId && custName){
    const cr = await api('quick-customer', {file:'pos', method:'POST', body:{name:custName, phone:custPhone}});
    if(!cr.ok) return toast(cr.error, true);
    customerId = cr.customer.id;
  }
  if(paymentMethod === 'due' && !customerId){
    return toast('বাকিতে বিক্রির জন্য কাস্টমারের নাম দিন', true);
  }

  const body = {
    items: cart.map(c=>({productId:c.productId, qty:c.qty, unitPrice:c.unitPrice})),
    customerId: customerId || null,
    paymentMethod, discount, dueAmount: paymentMethod==='due' ? total : 0
  };
  const r = await api('checkout', {file:'pos', method:'POST', body});
  if(!r.ok){
    if(r.needsApproval) toast(r.error + ' — অনুরোধ পাঠানো হয়েছে', true);
    else toast(r.error, true);
    return;
  }
  toast(`বিক্রি সফল হয়েছে — ইনভয়েস #${r.invoiceNo}`);
  cart = [];
  go('receipt', r.invoiceNo);
}

        <div class="r-center muted" style="font-size:.85em;">যাচাইয়ের জন্য QR স্ক্যান করুন</div>

function captureReceipt(cb){

// ── Camera barcode/QR scanner (§6) — one shared modal used by POS search
// and the product barcode field. Stops the camera cleanly on close so it
// never keeps running in the background. ─────────────────────────────────
function openScanner(onResult){
  let scanner = null;
  openModal(`
    <h2 class="pagetitle">বারকোড/QR স্ক্যান করুন</h2>
    <div id="scan-video-wrap"><div id="scan-video"></div></div>
    <button class="btn btn-outline btn-full" id="scan-cancel">বাতিল</button>
  `, async ()=>{
    document.getElementById('scan-cancel').onclick = ()=>closeTopModal();
    if(!window.Html5Qrcode){ toast('স্ক্যানার লোড করা যায়নি — ইন্টারনেট সংযোগ পরীক্ষা করুন', true); closeTopModal(); return; }
    try{
      scanner = new Html5Qrcode('scan-video');
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 140 } },
        (decodedText)=>{ onResult(decodedText); closeTopModal(); },
        ()=>{ /* per-frame scan miss — expected, ignore */ }
      );
    }catch(e){
      toast('ক্যামেরা চালু করা যায়নি — অনুমতি দিন', true);
      closeTopModal();
    }
  }, ()=>{
    // Runs no matter how the sheet closes (Cancel, tap-outside, Android
    // back) — .stop() on an already-stopped/never-started instance just
    // rejects quietly, which is fine here.
    if(scanner) scanner.stop().catch(()=>{});
  });
}

async function wireProducts(){

// Printable QR label (§6) — client-side only, encodes the product's own
// barcode/SKU/ID, reusing the same html2canvas/print pipeline as the
// receipt. One label per tap; a multi-select bulk sheet is a natural
// follow-up once this is in daily use.
function printProductLabel(p){
  const code = p.barcode || p.sku || p.id;
  openModal(`
    <h2 class="pagetitle">QR কোড — ${p.name}</h2>
    <div id="print-area" style="text-align:center;padding:14px;background:#fff;border-radius:10px;">
      <canvas id="label-qr"></canvas>
      <div style="font-weight:700;margin-top:6px;color:#111;">${p.name}</div>
      <div style="color:#111;">${fmtMoney(p.selling_price)}</div>
      ${p.barcode ? `<div style="font-size:11px;color:#555;">${p.barcode}</div>` : ''}
    </div>
    <div class="receipt-actions" style="margin-top:12px;">
      <button class="btn btn-outline" id="label-print">🖨️ প্রিন্ট</button>
      <button class="btn btn-outline" id="label-download">⬇️ ডাউনলোড</button>
      <button class="btn btn-primary" id="label-share">↗️ শেয়ার</button>
    </div>
    <button class="btn btn-outline btn-full" id="label-done" style="margin-top:8px;">হয়ে গেছে</button>
  `, ()=>{
    if(window.QRCode) QRCode.toCanvas(document.getElementById('label-qr'), String(code), {width:140, margin:1}, ()=>{});
    document.getElementById('label-print').onclick = ()=>window.print();
    document.getElementById('label-done').onclick = ()=>closeTopModal();
    function capture(cb){
      if(!window.html2canvas) return toast('ছবি তৈরি করা যায়নি', true);
      html2canvas(document.getElementById('print-area'), {backgroundColor:'#fff', scale:2}).then(canvas=>{
        canvas.toBlob(blob=>{ if(blob) cb(blob); else toast('ছবি তৈরি করা যায়নি', true); }, 'image/png');
      });
    }
    document.getElementById('label-download').onclick = ()=>capture(blob=>{
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `qr-${(p.sku||p.name||'product')}.png`; a.click();
    });
    document.getElementById('label-share').onclick = ()=>capture(async blob=>{
      const file = new File([blob], `qr-${(p.sku||p.name||'product')}.png`, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:p.name, text:`${p.name} — QR কোড`}); }
        catch(e){ /* user cancelled share sheet */ }
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `qr-${(p.sku||p.name||'product')}.png`; a.click();
      }
    });
  });
}

let pfPhotoDataUrl = null; // set only when the user picks a new photo; stays null = "keep existing"
async function wireProductForm(id){
  wireTopbar();
  pfPhotoDataUrl = null;
  document.getElementById('pf-scan').onclick = ()=>{
    openScanner((code)=>{ document.getElementById('pf-barcode').value = code; toast('বারকোড স্ক্যান হয়েছে'); });
  };
  document.getElementById('pf-photo-inp').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    if(file.size > 5*1024*1024) return toast('ছবি ৫MB এর কম হতে হবে', true);
    const rd = new FileReader();
    rd.onload = ()=>{
      pfPhotoDataUrl = rd.result;
      document.getElementById('pf-photo-prv').innerHTML = `<img src="${rd.result}" style="width:100%;height:100%;object-fit:cover;">`;
    };
    rd.readAsDataURL(file);
  };
  const config = await getCategoryFields();
  function renderExtraFields(){
    const cat = document.getElementById('pf-cat').value;
    const fields = config[cat] || [];
    document.getElementById('pf-extra-fields').innerHTML = fields.map(f=>`
      <label>${f}</label><input type="text" data-extra="${f}">`).join('');
  }
  document.getElementById('pf-cat').onchange = renderExtraFields;
  renderExtraFields();

  if(id){
    const r = await api('get', {file:'products', query:{id}});
    if(r.ok){
      const p = r.product;
      if(p.thumb) document.getElementById('pf-photo-prv').innerHTML = `<img src="${p.thumb}" style="width:100%;height:100%;object-fit:cover;">`;
      document.getElementById('pf-name').value = p.name;
      document.getElementById('pf-sku').value = p.sku||'';
      document.getElementById('pf-barcode').value = p.barcode||'';
      document.getElementById('pf-cat').value = p.category||CATEGORIES[0];
      renderExtraFields();
      const cf = p.category_fields || {};
      document.querySelectorAll('[data-extra]').forEach(inp=>{ inp.value = cf[inp.dataset.extra]||''; });
      document.getElementById('pf-purchase').value = p.purchase_price;
      document.getElementById('pf-selling').value = p.selling_price;
      document.getElementById('pf-minprice').value = p.minimum_selling_price||'';
      document.getElementById('pf-unit').value = p.unit||'pcs';
      document.getElementById('pf-stock').value = p.current_stock;
      document.getElementById('pf-lowstock').value = p.low_stock_alert||'';
      document.getElementById('pf-location').value = p.storage_location||'';
    }
  }

  document.getElementById('pf-save').onclick = async ()=>{
    const categoryFields = {};
    document.querySelectorAll('[data-extra]').forEach(inp=>{ if(inp.value) categoryFields[inp.dataset.extra]=inp.value; });
    const body = {
      name: document.getElementById('pf-name').value.trim(),
      sku: document.getElementById('pf-sku').value.trim(),
      barcode: document.getElementById('pf-barcode').value.trim(),
      category: document.getElementById('pf-cat').value,
      categoryFields,
      purchasePrice: document.getElementById('pf-purchase').value,
      sellingPrice: document.getElementById('pf-selling').value,
      minimumSellingPrice: document.getElementById('pf-minprice').value || null,
      unit: document.getElementById('pf-unit').value.trim(),
      lowStockAlert: document.getElementById('pf-lowstock').value || null,
      storageLocation: document.getElementById('pf-location').value.trim(),
    };
    if(pfPhotoDataUrl) body.thumb = pfPhotoDataUrl; // omitted entirely = keep existing photo on edit
    if(!body.name) return toast('পণ্যের নাম দিন', true);
    let r;
    if(id){ body.id = id; r = await api('update', {file:'products', method:'PUT', body}); }
    else { body.openingStock = document.getElementById('pf-stock').value || 0; r = await api('create', {file:'products', method:'POST', body}); }
    if(!r.ok) return toast(r.error, true);
    toast('সংরক্ষিত হয়েছে');
    if(!id && r.product){
      // Fresh product — immediately surface its QR so the owner/staff can
      // share, download, or print it right away (§ QR scan-to-sell flow).
      printProductLabel(r.product);
    } else {
      go('products');
    }
  };
  const delBtn = document.getElementById('pf-delete');
  if(delBtn) delBtn.onclick = async ()=>{
    if(!confirm('আপনি কি নিশ্চিত?')) return;
    const r = await api('delete', {file:'products', method:'DELETE', query:{id}});
    if(!r.ok) return toast(r.error, true);
    toast('মুছে ফেলা হয়েছে'); go('products');
  };
}

function getGeoForPunch(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation) return resolve({});
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude}),
      ()  => resolve({}),
      {enableHighAccuracy:true, timeout:10000}
    );
  });
}

    document.getElementById('at-in').textContent = 'লোকেশন খোঁজা হচ্ছে...';
    const geo = await getGeoForPunch();
    document.getElementById('at-in').textContent = 'পাঞ্চ ইন';
    const r = await api('punch',{file:'staff',method:'POST',body:{type:'in', ...geo}});
    toast(r.ok?'পাঞ্চ ইন সফল':r.error, !r.ok); load();
  };
  document.getElementById('at-out').onclick = async ()=>{
    document.getElementById('at-out').textContent = 'লোকেশন খোঁজা হচ্ছে...';
    const geo = await getGeoForPunch();
    document.getElementById('at-out').textContent = 'পাঞ্চ আউট';

    toast(r.ok?'পাঞ্চ আউট সফল':r.error, !r.ok); load();
  };
  async function load(){

  const r = await api('tenant-get-location', {file:'staff'});
  const lat = r.ok && r.lat!=null ? r.lat : null;
  const lng = r.ok && r.lng!=null ? r.lng : null;
  const radiusM = (r.ok && r.radiusM) || 150;
  const ontimeHour = (r.ok && r.ontimeHour!=null) ? r.ontimeHour : 10;
  box.innerHTML = `
    <div class="card">
      <div style="font-weight:700;margin-bottom:4px;">📍 শপ লোকেশন ও পাঞ্চ সেটিংস</div>

      </div>
      <button class="btn btn-outline btn-full" id="sl-loc-use">📍 বর্তমান লোকেশন ব্যবহার করুন</button>
      <label style="margin-top:10px;">পাঞ্চের সীমা (মিটার)</label>
      <input type="number" id="sl-loc-radius" value="${radiusM}">
      <label>দোকান খোলার সময় (পাঞ্চ ইন করার শেষ সময়, ০-২৩ ঘণ্টা)</label>
      <input type="number" id="sl-loc-ontime" min="0" max="23" value="${ontimeHour}">
      <div class="muted" style="font-size:11px;margin:4px 0 8px;">এই সময়ের মধ্যে পাঞ্চ ইন করলে "সময়মতো" বোনাস পাবে — যেমন সকাল ৯টা হলে ৯ লিখুন</div>
      <button class="btn btn-primary btn-full" id="sl-loc-save">সংরক্ষণ করুন</button>
    </div>`;
  let picked = (lat!=null) ? {lat, lng} : null;
  document.getElementById('sl-loc-use').onclick = async ()=>{
    document.getElementById('sl-loc-use').textContent = 'লোকেশন খোঁজা হচ্ছে...';
    const geo = await getGeoForPunch();
    document.getElementById('sl-loc-use').textContent = '📍 বর্তমান লোকেশন ব্যবহার করুন';
    if(geo.lat==null) return toast('লোকেশন পাওয়া যায়নি — GPS অন করুন', true);
    picked = geo;
    document.getElementById('sl-loc-status').textContent = `নতুন লোকেশন বাছাই হয়েছে (${geo.lat.toFixed(5)}, ${geo.lng.toFixed(5)}) — সংরক্ষণ করুন চাপুন`;
  };
  document.getElementById('sl-loc-save').onclick = async ()=>{
    if(!picked) return toast('আগে বর্তমান লোকেশন ব্যবহার করুন চাপুন', true);
    const body = { lat: picked.lat, lng: picked.lng, radiusM: document.getElementById('sl-loc-radius').value, ontimeHour: document.getElementById('sl-loc-ontime').value };
    const r2 = await api('tenant-set-location', {file:'staff', method:'PUT', body});

    } else {

    document.getElementById('sl-compute').innerHTML = `

    if(payBtn) payBtn.onclick = async ()=>{

function wireSearch(){
  wireTopbar();
  let deb;
  document.getElementById('gs-input').oninput = (e)=>{
    clearTimeout(deb);
    deb = setTimeout(async ()=>{
      const q = e.target.value.trim();
      if(q.length<2){ document.getElementById('gs-result').innerHTML=''; return; }
      const r = await api('search', {file:'search', query:{q}});
      if(!r.ok) return;
      const res = r.results;
      let html = '';
      const sections = [['products','পণ্য'],['customers','কাস্টমার'],['suppliers','সরবরাহকারী'],['employees','কর্মচারী'],['invoices','ইনভয়েস'],['expenses','খরচ']];
      for(const [key,label] of sections){
        const items = res[key]||[];
        if(!items.length) continue;
        html += `<div class="muted" style="margin:10px 0 4px;font-weight:700;">${label}</div>`;
        html += items.map(it=>`<div class="card">${it.name||it.invoiceNo||it.note||'—'} ${it.phone?('· '+it.phone):''} ${it.selling_price!=null?('· '+fmtMoney(it.selling_price)):''} ${it.amount!=null?('· '+fmtMoney(it.amount)):''}</div>`).join('');
      }
      document.getElementById('gs-result').innerHTML = html || `<div class="card muted" style="text-align:center;">কিছু পাওয়া যায়নি</div>`;
    }, 300);
  };
}

      <div>${(a.payload.items||[]).map(i=>`পণ্য ${i.productId.slice(0,6)}: ${i.qty} × ৳${i.unitPrice}`).join('<br>')}</div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-primary" data-app="${a.id}" style="flex:1;">অনুমোদন</button>
        <button class="btn btn-danger" data-rej="${a.id}" style="flex:1;">বাতিল</button>
      </div>
    </div>`).join('') : `<div class="card muted" style="text-align:center;">কোনো অনুরোধ নেই</div>`;
  document.querySelectorAll('[data-app]').forEach(b=>b.onclick=async()=>{ const r2=await api('approve-sale',{file:'pos',method:'POST',body:{approvalId:b.dataset.app, decision:'approved'}}); toast(r2.ok?'অনুমোদিত হয়েছে':r2.error,!r2.ok); wireApprovals(); });
  document.querySelectorAll('[data-rej]').forEach(b=>b.onclick=async()=>{ await api('approve-sale',{file:'pos',method:'POST',body:{approvalId:b.dataset.rej, decision:'rejected'}}); toast('বাতিল হয়েছে'); wireApprovals(); });
}

// SETTINGS
// ════════════════════════════════════════════════════════════════════════
function screenSettings(){
  const mode = (state.staff&&state.staff.uiMode) || (state.tenant&&state.tenant.uiMode) || 'light';
  return `
  ${topbar('সেটিংস', {back:true, hideGear:true})}
  <div class="screen">
    <div class="card row"><span>ডার্ক মোড</span><input type="checkbox" id="se-dark" ${mode==='dark'?'checked':''}></div>
    <div class="card">
      <label>নতুন PIN সেট করুন</label><input type="password" id="se-pin" maxlength="6" autocomplete="new-password" autocorrect="off" spellcheck="false" name="f-se-pin" readonly onfocus="this.removeAttribute('readonly')">
      <button class="btn btn-primary btn-full" id="se-savepin">PIN পরিবর্তন করুন</button>
    </div>
    ${state.staff.role==='owner' ? `
    <div class="card">
      <label>📍 শপ লোকেশন (পাঞ্চ ইন/আউটের জন্য)</label>
      <div class="muted" style="margin-bottom:8px;">দোকানে দাঁড়িয়ে এই বাটনে চাপুন — স্টাফরা শুধু এই লোকেশনের কাছাকাছি থেকেই পাঞ্চ করতে পারবে।</div>
      <div id="se-geo-status" class="muted" style="margin-bottom:8px;">${(state.tenant.lat!=null) ? `✅ লোকেশন সেট করা আছে (ব্যাসার্ধ ${state.tenant.geoRadiusM||150} মিটার)` : '⚠️ এখনো কোনো লোকেশন সেট করা হয়নি'}</div>
      <label>ব্যাসার্ধ (মিটার)</label>
      <input type="number" id="se-geo-radius" value="${state.tenant.geoRadiusM||150}" min="30" max="2000">
      <button class="btn btn-primary btn-full" id="se-set-location">📍 এই লোকেশনে দোকান সেট করুন</button>
    </div>` : ''}
    <button class="btn btn-outline btn-full" id="se-logout">লগ আউট</button>
    <p style="text-align:center;margin-top:22px;font-size:11px;color:var(--muted);">দোকানদার · Developed by <b style="color:var(--header);">Axiion Technology</b></p>
  </div>`;
}
function wireSettings(){
  wireTopbar();
  document.getElementById('se-dark').onchange = async (e)=>{
    const mode = e.target.checked?'dark':'light';
    document.body.classList.toggle('dark', e.target.checked);
    await api('set-ui-mode', {file:'auth', method:'PUT', body:{mode}});
    if(state.staff) state.staff.uiMode = mode;
  };
  document.getElementById('se-savepin').onclick = async ()=>{
    const newPin = document.getElementById('se-pin').value.trim();
    const r = await api('reset-pin', {file:'staff', method:'PUT', body:{staffId: state.staff.id, newPin}});
    toast(r.ok ? 'PIN পরিবর্তন হয়েছে' : r.error, !r.ok);
  };
  document.getElementById('se-logout').onclick = ()=>doLogout();
  const setLocBtn = document.getElementById('se-set-location');
  if(setLocBtn) setLocBtn.onclick = ()=>{
    if(!navigator.geolocation) return toast('এই ব্রাউজারে GPS সাপোর্ট নেই', true);
    setLocBtn.textContent = 'লোকেশন খোঁজা হচ্ছে...';
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const radiusM = Number(document.getElementById('se-geo-radius').value) || 150;
      const r = await api('tenant-set-location', {file:'staff', method:'PUT', body:{lat: pos.coords.latitude, lng: pos.coords.longitude, radiusM}});
      setLocBtn.textContent = '📍 এই লোকেশনে দোকান সেট করুন';
      if(!r.ok) return toast(r.error, true);
      state.tenant.lat = r.lat; state.tenant.lng = r.lng; state.tenant.geoRadiusM = r.geo_radius_m;
      document.getElementById('se-geo-status').textContent = `✅ লোকেশন সেট করা আছে (ব্যাসার্ধ ${r.geo_radius_m} মিটার)`;
      toast('শপ লোকেশন সেট হয়েছে');
    }, (err)=>{
      setLocBtn.textContent = '📍 এই লোকেশনে দোকান সেট করুন';
      toast('লোকেশন পাওয়া যায়নি — GPS/লোকেশন অনুমতি চেক করুন', true);
    }, {enableHighAccuracy:true, timeout:15000});
  };
}

// ════════════════════════════════════════════════════════════════════════
// MODAL helper (bottom sheet) — registers into the back-button chain (§19)
// ════════════════════════════════════════════════════════════════════════
function openModal(innerHtml, afterRender, onClose){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal-sheet">${innerHtml}</div>`;
  document.body.appendChild(wrap);
  const close = ()=>{ wrap.remove(); if(onClose) onClose(); };
  wrap.onclick = (e)=>{ if(e.target === wrap) close(); };
  modalStack.push(close);
  if(afterRender) afterRender();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
}
</script>
