<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0A0B">
<title>AXIION DMS — Dealer Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<!-- Update #50 — 'Noto Sans' listed before 'Hind Siliguri' in every font-family
     stack in this file so the browser renders digits 0-9 from Noto Sans'
     clean lining numerals (Hind Siliguri's '1' glyph looks visually off /
     inconsistent next to the rest of the UI). Noto Sans has no Bengali
     glyphs, so every Bengali character still falls straight through to
     Hind Siliguri exactly as before — only the digit shapes change. -->
<!-- Live Map (§14) — Leaflet + free tiles, no API key, no billing -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<!-- Shop QR codes (§11) — free, client-side only, no backend cost -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  /* AXIION DMS brand palette — brushed-silver/gold on charcoal, per the
     new logo. --bl/--bl2/--bll keep their old variable names (so none of
     the thousands of existing var(--bl)/.btn-bl usages needed touching)
     but now carry the brand's gold, not the old blue. Status colors
     (green/red/amber/teal/purple) are left as semantic signals —
     success/danger/warning/etc. still need to read as those regardless
     of brand color. */
  --bl:#B8892B;--bl2:#D4AF37;--bll:#FBF3DF;
  --gr:#2E7D32;--grl:#E8F5E9;
  --re:#C62828;--rel:#FFEBEE;
  --am:#E65100;--aml:#FFF3E0;
  --te:#00695C;--tel:#E0F2F1;
  --pu:#6A1B9A;--pul:#F3E5F5;
  --go:#B8860B;--gol:#FFF8E1;
  --bg:#F7F5F0;--card:#fff;--bdr:#E4DFD2;
  --txt:#1C1A16;--mt:#6E6656;--mt2:#A89E88;
  --rad:16px;--shad:0 3px 14px rgba(20,15,5,.08);
  --inp-bg:#fff;--nav-bg:#fff;--seg-bg:#F0ECE0;
  --hdr1:#0A0A0B;--hdr2:#1F1B12;
}
body.dark{
  --bg:#0B0B0C;--card:#1A1917;--bdr:#332E22;
  --txt:#F2EFE9;--mt:#B8AF9E;--mt2:#726A57;
  --shad:0 3px 14px rgba(0,0,0,.5);
  --bll:#2A2413;--grl:#0D2515;--rel:#2A1015;
  --aml:#2A1800;--tel:#0A2020;--pul:#1E0D30;--gol:#2A2110;
  --inp-bg:#1A1917;--nav-bg:#121110;--seg-bg:#211F1A;
  --hdr1:#000000;--hdr2:#161310;
}
/* Theme toggle button */
.theme-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 9px;font-size:14px;cursor:pointer;line-height:1;font-family:inherit;transition:.15s}
.theme-btn:active{transform:scale(.93)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans','Hind Siliguri',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;display:flex;flex-direction:column}

/* SPLASH */
#spl{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(145deg,#0A0A0B,#1F1B12);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#spl.fade{opacity:0;pointer-events:none}
.sl-logo{width:90px;height:90px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;animation:pop .5s cubic-bezier(.34,1.56,.64,1);font-size:44px}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.sl-nm{color:#fff;font-size:28px;font-weight:800;animation:up .5s .25s both;letter-spacing:3px;font-family:'Poppins',sans-serif}
.sl-sb{color:rgba(255,255,255,.65);font-size:12px;margin-top:4px;animation:up .5s .4s both}
.sl-dev{color:rgba(255,215,0,.9);font-size:13px;font-weight:700;margin-top:18px;animation:up .5s .55s both;letter-spacing:2px}
.sl-bar{margin-top:10px;width:160px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;animation:up .5s .6s both}
.sl-prog{height:100%;background:#FFD700;border-radius:2px;animation:prog 2s ease forwards}
@keyframes prog{from{width:0}to{width:100%}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* LAYOUT */
#app{flex:1;display:flex;flex-direction:column;overflow:hidden;opacity:0;transition:opacity .3s}
#app.show{opacity:1}
.hdr{background:linear-gradient(90deg,var(--hdr1),var(--hdr2));color:#fff;padding:8px 12px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr h1{font-size:14px;font-weight:700;line-height:1;font-family:'Poppins',sans-serif;letter-spacing:.5px}
.hdr-s{font-size:9.5px;opacity:.75;margin-top:2px}
.hdr-titlewrap{flex:1;min-width:0;overflow:hidden}
.menu-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;line-height:1;font-family:inherit;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s}
.menu-btn:active{transform:scale(.92);background:rgba(255,255,255,.22)}
.hdr-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
/* ── Secondary bar: date/time (left) + current section (right) ── */
.hdr2{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 13px;background:var(--card);border-bottom:1px solid var(--bdr);gap:8px}
.hdr2-datetime{font-size:11px;font-weight:600;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr2-section{font-size:12px;font-weight:700;color:var(--bl);display:flex;align-items:center;gap:5px;white-space:nowrap}
/* ── Slide-out side menu (replaces old bottom nav) ── */
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;opacity:0;pointer-events:none;transition:opacity .22s}
.menu-overlay.show{opacity:1;pointer-events:auto}
.side-menu{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:300px;background:var(--card);z-index:901;transform:translateX(-105%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:2px 0 24px rgba(0,0,0,.3)}
.side-menu.show{transform:translateX(0)}
.side-menu-hdr{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;padding:20px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.side-menu-hdr .sm-logo{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--bl);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.side-menu-hdr .sm-name{font-size:14px;font-weight:700;line-height:1.3;font-family:'Poppins',sans-serif;letter-spacing:.3px}
.side-menu-hdr .sm-role{font-size:10.5px;opacity:.8;margin-top:1px}
.side-menu-close{margin-left:auto;background:rgba(255,255,255,.14);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0}
.side-menu-items{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 14px;-webkit-overflow-scrolling:touch}
.smi{display:flex;align-items:center;gap:10px;width:calc(100% - 20px);margin:4px 10px;background:var(--card);border:1.5px solid var(--bdr);border-radius:11px;text-align:left;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--txt);cursor:pointer;font-family:'Noto Sans','Hind Siliguri',sans-serif;transition:.12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 3px rgba(20,15,5,.06)}
.side-menu-grouphdr{font-size:10.5px;font-weight:700;color:var(--mt2);text-transform:uppercase;letter-spacing:.6px;margin:14px 16px 2px;font-family:'Poppins',sans-serif}
.side-menu-grouphdr:first-child{margin-top:6px}
.smi:active{background:var(--bll);transform:scale(.98)}
.smi.active{background:var(--bll);color:var(--bl);border-color:var(--bl)}
.smi-ic{font-size:15px;width:27px;height:27px;border-radius:8px;background:var(--bll);display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.smi.active .smi-ic{background:#fff}
.side-menu-sep{height:1px;background:var(--bdr);margin:8px 14px}
.smi-danger{color:var(--re)!important;border-color:var(--rel)!important;background:var(--rel)!important}
.smi-danger .smi-ic{background:rgba(198,40,40,.14)!important}
.smi-danger:active{background:rgba(198,40,40,.16)!important}
.pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding:12px 12px 72px;max-width:640px;margin:0 auto;display:none}
.page.active{display:block}
.nav{flex-shrink:0;background:var(--nav-bg);border-top:1px solid var(--bdr);display:flex;height:56px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nb{flex:1;min-width:44px;max-width:14.28%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:none;font-size:7px;color:var(--mt2);cursor:pointer;padding:3px 1px;font-family:'Noto Sans','Hind Siliguri',sans-serif;transition:.15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.nb.active{color:var(--bl)}.ni{font-size:18px;line-height:1}

.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--shad);padding:12px;margin-bottom:10px;border:1px solid var(--bdr)}
.ct{font-size:13px;font-weight:700;color:var(--bl);margin-bottom:10px}

.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.met{background:var(--card);border-radius:10px;padding:11px;text-align:center;border:1px solid var(--bdr);box-shadow:var(--shad)}
.mv{font-size:18px;font-weight:700;margin:3px 0 1px;line-height:1}
.ml{font-size:10px;color:var(--mt2)}
.met-b{border-top:3px solid var(--bl)}.met-g{border-top:3px solid var(--gr)}
.met-r{border-top:3px solid var(--re)}.met-a{border-top:3px solid var(--am)}

.fl{display:block;font-size:11px;color:var(--mt);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;border:1.5px solid var(--bdr);border-radius:11px;padding:8px 11px;font-size:13px;font-family:'Noto Sans','Hind Siliguri',sans-serif;color:var(--txt);background:var(--inp-bg);outline:none;transition:.12s}
input:focus,select:focus{border-color:var(--bl);box-shadow:0 0 0 2px rgba(13,71,161,.1)}
.fg{margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:11px;border:none;font-size:13px;font-family:'Noto Sans','Hind Siliguri',sans-serif;font-weight:700;cursor:pointer;transition:.12s}
.btn:active{transform:scale(.97)}
.btn-bl{background:var(--bl);color:#fff}.btn-gr{background:var(--gr);color:#fff}
.btn-re{background:var(--re);color:#fff}.btn-am{background:var(--am);color:#fff}
.btn-te{background:var(--te);color:#fff}.btn-pu{background:var(--pu);color:#fff}
.btn-gh{background:var(--bg);color:var(--txt);border:1.5px solid var(--bdr)}
.btn-w{width:100%}.btn-sm{padding:6px 10px;font-size:11px;border-radius:9px}

.seg{display:flex;background:var(--seg-bg);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px;flex-wrap:wrap}
.sbt{flex:1;min-width:50px;padding:6px 4px;border-radius:6px;border:none;background:none;font-size:11px;font-weight:700;color:var(--mt);cursor:pointer;font-family:'Noto Sans','Hind Siliguri',sans-serif;transition:.12s;text-align:center}
.sbt.active{background:var(--card);color:var(--bl);box-shadow:0 1px 3px rgba(13,71,161,.15)}

/* Boxed option grid — used where a panel has many top-level options
   (e.g. SO/DSR dashboard home) so they read as distinct tappable
   buttons/cards instead of a wrapping run of free text. */
.nav-box-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.nav-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:11px 4px;border-radius:10px;border:1.5px solid var(--bdr);background:var(--card);box-shadow:var(--shad);cursor:pointer;transition:.12s;text-align:center}
.nav-box:active{transform:scale(.96)}
.nav-box .nb-ic{font-size:19px;line-height:1}
.nav-box .nb-lb{font-size:10.5px;font-weight:700;color:var(--mt);line-height:1.25}
.nav-box.active{border-color:var(--bl);background:var(--bll)}
.nav-box.active .nb-lb{color:var(--bl)}

.tbar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.tb{flex:1;min-width:70px;padding:8px 4px;border-radius:7px;border:2px solid var(--bdr);background:var(--card);font-size:11px;font-weight:700;cursor:pointer;color:var(--mt);transition:.12s;text-align:center;font-family:'Noto Sans','Hind Siliguri',sans-serif}
.tb.tg{border-color:var(--bl);background:var(--bll);color:var(--bl);box-shadow:0 0 0 2px var(--bl),0 0 13px 3px var(--bl);animation:tbGlow 1.4s ease-in-out infinite}
.tb.tr_{border-color:var(--te);background:var(--tel);color:var(--te);box-shadow:0 0 0 2px var(--te),0 0 13px 3px var(--te);animation:tbGlow 1.4s ease-in-out infinite}
.tb.td_{border-color:var(--re);background:var(--rel);color:var(--re);box-shadow:0 0 0 2px var(--re),0 0 13px 3px var(--re);animation:tbGlow 1.4s ease-in-out infinite}
.tb.tb_{border-color:var(--gr);background:var(--grl);color:var(--gr);box-shadow:0 0 0 2px var(--gr),0 0 13px 3px var(--gr);animation:tbGlow 1.4s ease-in-out infinite}
.tb.tpu{border-color:var(--pu);background:var(--pul);color:var(--pu);box-shadow:0 0 0 2px var(--pu),0 0 13px 3px var(--pu);animation:tbGlow 1.4s ease-in-out infinite}
@keyframes tbGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}

.img-sq{width:80px;height:80px;border-radius:10px;border:2px solid var(--bdr);background:#EEF2FF;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
.img-sq img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px}
.img-cam{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;transition:.2s;border-radius:8px}
.img-sq:hover .img-cam{opacity:1}

.sr-av{width:52px;height:52px;border-radius:50%;border:2px solid var(--bdr);background:#EEF2FF;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--bl)}
.sr-av img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.sr-av-lg{width:76px;height:76px;border-radius:50%;border:2px solid var(--bdr);background:#EEF2FF;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--bl);cursor:pointer}
.sr-av-lg img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.sr-av-lg .img-cam{border-radius:50%}
.sr-av-lg:hover .img-cam{opacity:1}
.up-lbl{display:block;text-align:center;margin-top:5px;font-size:10px;font-weight:700;color:var(--bl);cursor:pointer;background:var(--bll);border:1.5px dashed var(--bl);border-radius:6px;padding:4px 6px}

.pc{display:flex;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid #EEF2FF}
.pc:last-child{border-bottom:none}
.pc-img{width:52px;height:52px;border-radius:8px;border:1.5px solid var(--bdr);background:#EEF2FF;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:22px}
.pc-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}

.sku-i{width:44px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid var(--bdr);background:#EEF2FF;position:relative;display:flex;align-items:center;justify-content:center;font-size:20px}
.sku-i img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.sku-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #EEF2FF}
.sku-row:last-child{border-bottom:none}

.psel{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid #EEF2FF;cursor:pointer}
.psel:last-child{border-bottom:none}
.psel input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--bl)}
.psel-all{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--bll);border-bottom:2px solid var(--bl);font-weight:700;color:var(--bl);font-size:12px}

.prow{background:#F8FAFF;border:1px solid var(--bdr);border-radius:9px;padding:9px;margin-bottom:7px}
.prow-h{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.prow-h select{flex:1;font-size:12px}
.prow-del{background:var(--rel);color:var(--re);border:none;border-radius:6px;padding:7px 9px;cursor:pointer;font-size:14px;flex-shrink:0}
.prow-ins{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.prow-c{font-size:11px;color:var(--bl);margin-top:5px;font-weight:600;background:var(--bll);padding:4px 9px;border-radius:5px}

.tbl-w{overflow-x:auto;border-radius:8px;border:1px solid var(--bdr)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:360px}
th{text-align:left;padding:7px 9px;background:var(--bl);color:#fff;font-weight:600;font-size:11px;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid #EEF2FF;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#F5F7FF}
.tf td{background:var(--bll);font-weight:700;border-top:2px solid var(--bl)}

.bdg{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
.b-bl{background:var(--bll);color:var(--bl)}.b-gr{background:var(--grl);color:var(--gr)}
.b-re{background:var(--rel);color:var(--re)}.b-am{background:var(--aml);color:var(--am)}
.b-pu{background:var(--pul);color:var(--pu)}
.b-te{background:var(--tel);color:var(--te)}.b-gy{background:#ECEFF1;color:var(--mt)}
.b-go{background:var(--gol);color:var(--go)}

.prof{border-radius:10px;padding:14px;text-align:center;margin-bottom:10px;color:#fff}
.prof-v{font-size:26px;font-weight:700}.prof-l{font-size:11px;opacity:.85;margin-top:2px}

.ib{background:var(--bll);border-left:3px solid var(--bl);border-radius:5px;padding:8px 11px;font-size:11px;color:var(--bl2);margin-bottom:10px;font-weight:600}
.wb{background:#FFF8E1;border-left:3px solid #FFA000;border-radius:5px;padding:8px 11px;font-size:11px;color:var(--am);margin-bottom:10px;font-weight:600}
.gib{background:var(--grl);border-left:3px solid var(--gr);border-radius:5px;padding:8px 11px;font-size:11px;color:var(--gr);margin-bottom:10px;font-weight:600}
.rib{background:var(--rel);border-left:3px solid var(--re);border-radius:5px;padding:8px 11px;font-size:11px;color:var(--re);margin-bottom:10px;font-weight:600}

.step-ind{display:flex;align-items:center;gap:5px;margin-bottom:12px}
.sdi{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sdi-a{background:var(--bl);color:#fff}.sdi-i{background:#E0E0E0;color:var(--mt)}
.sdl{flex:1;height:2px;background:#E0E0E0}.sdl.done{background:var(--bl)}

.dr{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid #EEF2FF}
.dr:last-child{border-bottom:none}
.stk-ok{color:var(--gr);font-weight:700}.stk-lo{color:var(--am);font-weight:700}.stk-no{color:var(--re);font-weight:700}

.dmg-card{border:2px solid var(--re);border-radius:10px;overflow:hidden;margin-bottom:10px}
.dmg-h{background:var(--re);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.bon-card{border:2px solid var(--am);border-radius:10px;overflow:hidden;margin-bottom:10px}
.bon-h{background:var(--am);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.dm-img{width:40px;height:40px;border-radius:7px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.2);position:relative;display:flex;align-items:center;justify-content:center;font-size:20px}
.dm-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}

.exp-cat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #EEF2FF}
.exp-cat-row:last-child{border-bottom:none}
.exp-inp-row{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid #EEF2FF}
.exp-inp-row:last-child{border-bottom:none}
.exp-inp-row label{font-size:12px;font-weight:600;min-width:110px;flex-shrink:0}
.exp-inp-row input{flex:1;padding:7px 10px}

/* DSR Dashboard */
.dsr-big{background:var(--card);border-radius:var(--rad);padding:16px;margin-bottom:10px;text-align:center;border:1px solid var(--bdr);box-shadow:var(--shad)}
.dsr-big .dv{font-size:32px;font-weight:700;line-height:1}
.dsr-big .dl{font-size:11px;color:var(--mt2);margin-top:4px}
.dsr-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.dsr-cell{background:var(--card);border-radius:10px;padding:12px;text-align:center;border:2px solid var(--bdr)}
.dsr-cell .dv2{font-size:20px;font-weight:700}
.dsr-cell .dl2{font-size:9px;color:var(--mt2);margin-top:2px}
.dsr-cell .ds2{font-size:11px;color:var(--mt);margin-top:1px}

/* Low stock alert badge */
.low-alert{background:var(--rel);color:var(--re);font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;margin-left:4px}

/* Product Showcase */
.showcase-wrap{padding:0}
.showcase-header{background:linear-gradient(135deg,#0A0A0B,#1F1B12);border-radius:var(--rad);padding:16px 14px 14px;margin-bottom:12px;color:#fff;text-align:center;border:1px solid rgba(212,175,55,.25)}
.showcase-header h2{font-size:15px;font-weight:700;letter-spacing:1px;margin-bottom:2px}
.showcase-header p{font-size:11px;opacity:.75}
.showcase-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.sc-card{background:#fff;border-radius:12px;border:1.5px solid var(--bdr);box-shadow:0 2px 10px rgba(13,71,161,.08);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.15s}
.sc-card:active{transform:scale(.97);box-shadow:0 1px 4px rgba(13,71,161,.12)}
.sc-img{width:100%;aspect-ratio:1/1;min-height:0;background:#fff;position:relative;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;border-bottom:1px solid #EEF2FF}
.sc-img img{position:absolute;top:8px;left:8px;right:8px;bottom:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;display:block;background:#fff}
.sc-no-img{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mt2)}
.sc-no-img span{font-size:36px}
.sc-no-img small{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.sc-info{padding:8px 9px 9px;display:flex;flex-direction:column;gap:0}
.sc-name{font-size:12px;font-weight:700;color:var(--txt);line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;min-height:2.6em}
.sc-sku{display:inline-block;background:var(--bll);color:var(--bl);font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;margin-bottom:3px}
.sc-price{font-size:12px;font-weight:700;color:var(--gr);line-height:1.2}
.sc-price-sub{font-size:9px;color:var(--mt2);font-weight:400}
.sc-offer{font-size:9px;color:var(--am);font-weight:700;margin-top:2px;background:var(--aml);padding:1px 5px;border-radius:5px;display:inline-block}
.sc-modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sc-modal{background:#fff;border-radius:16px;width:100%;max-width:380px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.35);animation:modalup .2s cubic-bezier(.34,1.4,.64,1)}
@keyframes modalup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.sc-modal-img{width:100%;aspect-ratio:1/1;background:#fff;border-bottom:1px solid #EEF2FF;position:relative;display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden}
.sc-modal-img img{position:absolute;top:8px;left:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;display:block;background:#fff}
.sc-modal-body{padding:16px}
.sc-modal-name{font-size:17px;font-weight:700;color:var(--txt);margin-bottom:6px}
.sc-modal-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #EEF2FF;font-size:12px}
.sc-modal-row:last-child{border-bottom:none}
.sc-modal-label{color:var(--mt);font-weight:600}
.sc-modal-val{font-weight:700;color:var(--txt)}
.sc-close{position:absolute;top:10px;right:10px;width:32px;height:32px;background:rgba(255,255,255,.9);border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:1}
.sc-filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.sc-search{flex:1;min-width:120px}
.sc-empty{text-align:center;padding:32px 16px;color:var(--mt2)}
.sc-empty span{font-size:40px;display:block;margin-bottom:8px}
.sc-empty p{font-size:12px;font-weight:600}

/* Payment breakdown */
.pay-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #EEF2FF;font-size:12px}
.pay-row:last-child{border-bottom:none}

.ovl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px}
.spin{width:36px;height:36px;border:3px solid var(--bll);border-top-color:var(--bl);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ovl-m{font-size:12px;color:var(--mt);font-weight:600}
.tst{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:#1A237E;color:#fff;padding:9px 20px;border-radius:20px;font-size:12px;z-index:9998;white-space:nowrap;animation:tin .18s ease;pointer-events:none;font-weight:700;box-shadow:0 4px 14px rgba(26,35,126,.3)}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* PIN Screen */
#pin-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(145deg,#0A0A0B,#1F1B12);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;padding:24px;touch-action:manipulation;overflow:hidden}
.pin-logo{width:80px;height:80px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:14px;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.pin-title{color:#fff;font-size:26px;font-weight:800;margin-bottom:2px;letter-spacing:3px;font-family:'Poppins',sans-serif}
.pin-co{color:rgba(255,215,0,.85);font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:4px}
.pin-sub{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:22px}
.pin-dots{display:flex;gap:12px;margin-bottom:16px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent;transition:background-color .25s,border-color .25s,transform .25s}
.pin-dot.filled{background:#FFD700;border-color:#FFD700;transform:scale(1.15)}
.pin-err{color:#FF5252;font-size:12px;font-weight:700;margin-bottom:12px;min-height:16px;text-align:center}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px;touch-action:manipulation}
.pin-btn{height:64px;border-radius:14px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:22px;font-weight:700;cursor:pointer;transition:background-color .12s,transform .12s;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans','Hind Siliguri',sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.pin-btn:active{background:rgba(255,255,255,.35);transform:scale(.94)}
.pin-btn.flash{background:#43A047 !important;transform:scale(.92)}
.pin-btn.del{font-size:18px;background:rgba(255,82,82,.25)}
.pin-btn.del.flash{background:#E53935 !important}
.pin-hint{margin-top:20px;color:rgba(255,255,255,.3);font-size:10px;text-align:center}
.pw-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #EEF2FF}
.pw-row:last-child{border-bottom:none}
.pw-role-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.pw-badge-owner{background:#FAEEDA;color:#854F0B}
.pw-badge-manager{background:#E6F1FB;color:#185FA5}
.pw-badge-so{background:#E1F5EE;color:#0F6E56}
.pw-badge-dsr{background:#FAECE7;color:#993C1D}
.pw-badge-driver{background:#ECEFF1;color:#37474F}
.pw-section-hdr{font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px;display:flex;align-items:center;gap:7px}
.pw-section-count{background:#E8EAF6;color:var(--bl);border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700;text-transform:none;letter-spacing:0}
.pw-empty-row{background:#F8FAFF;border:1px dashed var(--bdr);border-radius:8px;padding:11px;text-align:center;color:var(--mt2);font-size:12px;margin-bottom:14px}

/* ME Logo */
.me-logo{font-family:'Noto Sans','Hind Siliguri',sans-serif;font-size:30px;font-weight:900;color:#D4AF37;letter-spacing:-1px;line-height:1}
.me-logo-pin{font-family:'Noto Sans','Hind Siliguri',sans-serif;font-size:26px;font-weight:900;color:#D4AF37;letter-spacing:-1px;line-height:1}
.brand-axiion{color:#FFD700;font-weight:700;letter-spacing:1px}

/* Due Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px}
.cal-day-hdr{text-align:center;font-size:10px;font-weight:700;color:var(--mt);padding:4px 0}
.cal-cell{min-height:52px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:3px 2px;position:relative;transition:.12s}
.cal-cell:active{transform:scale(.95)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default}
.cal-cell.today-cell{border-color:var(--bl);background:var(--bll)}
.cal-cell.has-due{background:var(--rel);border-color:var(--re)}
.cal-cell.has-due.all-paid{background:var(--grl);border-color:var(--gr)}
.cal-cell.has-due.partial{background:#FFF3E0;border-color:#FF9800}
.cal-cell.has-due.mixed{background:#FFF8E1;border-color:var(--am)}
.cal-cell.due-heavy{border-width:2.5px}
.cal-day-num{font-size:13px;font-weight:700;line-height:1}
.cal-dot{width:6px;height:6px;border-radius:50%;margin-top:2px}
.cal-dot-re{background:var(--re)}
.cal-dot-gr{background:var(--gr)}
.cal-dot-am{background:var(--am)}
.cal-dot-or{background:#FF9800}
.cal-amt-badge{font-size:7.5px;color:var(--mt);margin-top:1px;font-weight:600;letter-spacing:-0.2px}
.cal-legend{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cal-leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mt)}
.cal-leg-dot{width:10px;height:10px;border-radius:3px}
.due-item{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid #EEF2FF}
.due-item:last-child{border-bottom:none}
.due-modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:5000;display:flex;align-items:flex-end;justify-content:center}
.due-modal{background:var(--card);border-radius:16px 16px 0 0;padding:20px 16px 30px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.due-modal-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--bl)}
.status-pending{color:var(--re);font-weight:700;font-size:11px}
.status-cleared{color:var(--gr);font-weight:700;font-size:11px}
.status-partial{color:#FF9800;font-weight:700;font-size:11px}
.pay-prog-bar{height:6px;border-radius:3px;background:#eee;overflow:hidden;margin-top:4px}
.pay-prog-fill{height:100%;border-radius:3px;background:var(--gr);transition:.3s}

/* ── Extra Features Tab ── */
.xf-subnav{display:flex;flex-wrap:wrap;background:var(--seg-bg);border-radius:8px;padding:3px;gap:2px;margin-bottom:14px}
.xf-subnav::-webkit-scrollbar{display:none}
.xf-sbt{flex:0 0 auto;padding:7px 11px;border-radius:6px;border:none;background:none;font-size:11px;font-weight:700;color:var(--mt);cursor:pointer;font-family:'Noto Sans','Hind Siliguri',sans-serif;transition:.12s;text-align:center;white-space:nowrap}
.xf-sbt.active{background:#fff;color:var(--bl);box-shadow:0 1px 3px rgba(13,71,161,.15)}
.xf-sbt:disabled{opacity:.45;cursor:default}
.xf-coming-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px;text-align:center}
.xf-coming-icon{font-size:52px;margin-bottom:14px;line-height:1}
.xf-coming-title{font-size:17px;font-weight:700;color:var(--txt);margin-bottom:6px}
.xf-coming-sub{font-size:12px;color:var(--mt);margin-bottom:16px;line-height:1.6}
.xf-coming-badge{display:inline-block;background:var(--aml);color:var(--am);border:1px solid #FFCC80;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;letter-spacing:.5px}
.xf-section-hdr{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#0A0A0B,#1F1B12);border-radius:9px;padding:11px 13px;margin-bottom:12px;color:#fff}
.xf-section-hdr .xf-icon{font-size:22px;flex-shrink:0}
.xf-section-hdr .xf-title{font-size:13px;font-weight:700;line-height:1.2}
.xf-section-hdr .xf-desc{font-size:10px;opacity:.75;margin-top:1px}
/* ── Attendance / Punch / Live Map (§14 + §15) ── */
.att-punch-card{background:linear-gradient(145deg,#0A0A0B,#1F1B12);border-radius:16px;padding:22px 16px;text-align:center;color:#fff;margin-bottom:12px;border:1px solid rgba(212,175,55,.25)}
.att-punch-btn{width:110px;height:110px;border-radius:50%;background:#fff;color:var(--bl);border:none;font-size:15px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:6px auto 10px;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:.15s}
.att-punch-btn:active{transform:scale(.95)}
.att-punch-btn.done{background:#2E7D32;color:#fff}
.att-punch-btn.late{background:#E65100;color:#fff}
.att-punch-ic{font-size:30px;line-height:1}
.att-punch-status{font-size:12px;opacity:.85;margin-top:2px}
.att-mets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.att-met{background:var(--card);border-radius:10px;padding:11px;text-align:center;border:1px solid var(--bdr);box-shadow:var(--shad)}
.att-met .mv{font-size:17px;font-weight:700}
.att-badge-perfect{display:inline-block;background:#FFF8E1;color:#F57F17;border:1px solid #FFE082;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;margin-top:6px}
.att-so-note{background:var(--bll);color:var(--bl);border-radius:9px;padding:10px 12px;font-size:11.5px;line-height:1.5;margin-bottom:10px}
.gmap-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--bdr);box-shadow:var(--shad);margin-bottom:8px}
.gmap-box{width:100%;height:340px;background:#E5E3DF}
.gmap-legend{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.95);border-radius:8px;padding:6px 10px;font-size:10px;box-shadow:0 1px 4px rgba(0,0,0,.2);display:flex;gap:10px;flex-wrap:wrap;z-index:500}
.gmap-legend span{display:flex;align-items:center;gap:4px}
.gmap-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.gmap-pin-pop{font-size:12px;line-height:1.5}
.gmap-layer-btn{position:absolute;top:8px;right:8px;z-index:500;background:#fff;border:none;border-radius:8px;padding:7px 11px;font-size:11px;font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.3);cursor:pointer;font-family:'Noto Sans','Hind Siliguri',sans-serif;color:var(--txt)}
.gmap-fit-btn{position:absolute;top:8px;left:8px;z-index:500;background:#fff;border:none;border-radius:8px;width:32px;height:32px;font-size:15px;font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.3);cursor:pointer;color:var(--bl)}
.gmap-people{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 12px;-webkit-overflow-scrolling:touch}
.gmap-people::-webkit-scrollbar{display:none}
.gmap-chip{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:6px 12px 6px 8px;font-size:11px;font-weight:700;color:var(--txt);cursor:pointer;white-space:nowrap;font-family:'Noto Sans','Hind Siliguri',sans-serif}
.gmap-chip:active{background:var(--bll)}
.gmap-chip-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.gmap-chip-time{font-size:9.5px;color:var(--mt2);font-weight:600}
.gmap-name-label{background:rgba(255,255,255,.95)!important;border:1px solid rgba(0,0,0,.15)!important;box-shadow:0 1px 4px rgba(0,0,0,.25)!important;border-radius:6px!important;padding:1px 7px!important;font-size:10.5px!important;font-weight:700!important;color:#222!important;font-family:'Noto Sans','Hind Siliguri',sans-serif!important;white-space:nowrap}
.gmap-name-label::before{display:none}
.att-office-card{background:var(--grl);border:1px solid #A5D6A7;border-radius:10px;padding:12px;margin-bottom:12px;font-size:11.5px;color:var(--txt);line-height:1.6}
.att-office-card.unset{background:var(--rel);border-color:#EF9A9A}
/* ── Attendance calendar day-status colors (§ salary system) ── */
.att-cell-green{background:var(--grl);border-color:var(--gr)}
.att-cell-orange{background:#FFF3E0;border-color:#FF9800}
.att-cell-red{background:var(--rel);border-color:var(--re)}
.att-cell-off{background:var(--seg-bg);border-color:var(--bdr);opacity:.55}
.att-cell-future{opacity:.4}
.att-person-row{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-bottom:1px solid #EEF2FF;cursor:pointer}
.att-person-row:last-child{border-bottom:none}
.att-person-row:active{background:var(--bll)}
.att-person-name{font-weight:700;font-size:13px}
.att-person-sub{font-size:10.5px;color:var(--mt2);margin-top:1px}
.att-salary-form-row{margin-bottom:10px}
.att-salary-form-row label{display:block;font-size:11px;color:var(--mt);margin-bottom:4px;font-weight:700}
.att-salary-form-row input[type=number]{width:100%;padding:10px;border-radius:9px;border:1px solid var(--bdr);font-size:14px;box-sizing:border-box;background:var(--card);color:var(--txt)}
.att-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
/* ── Group Chat ── */
.gc-wrap{display:flex;flex-direction:column;height:calc(100svh - 238px);min-height:320px}
.gc-wrap-direct{display:flex;flex-direction:column;height:calc(100svh - 168px);min-height:320px}
.gc-msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 6px;display:flex;flex-direction:column;gap:0}
.gc-msg{display:flex;flex-direction:column;margin-bottom:8px;max-width:82%;word-break:break-word}
.gc-msg.mine{align-self:flex-end;align-items:flex-end}
.gc-msg.other{align-self:flex-start;align-items:flex-start}
.gc-bubble{padding:8px 11px;border-radius:14px;font-size:13px;line-height:1.5;font-family:'Noto Sans','Hind Siliguri',sans-serif}
.gc-msg.mine .gc-bubble{background:var(--bl);color:#fff;border-bottom-right-radius:3px}
.gc-msg.other .gc-bubble{background:var(--card);color:var(--txt);border:1px solid var(--bdr);border-bottom-left-radius:3px}
.gc-meta{font-size:10px;color:var(--mt);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.gc-role-badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:9px;font-weight:700;letter-spacing:.2px}
.gc-role-owner{background:#FFF8E1;color:#E65100;border:1px solid #FFCC80}
.gc-role-manager{background:#E8EAF6;color:#3949AB;border:1px solid #9FA8DA}
.gc-role-so{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7}
.gc-role-dsr{background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9}
.gc-role-driver{background:#ECEFF1;color:#37474F;border:1px solid #B0BEC5}
.gc-time{font-size:9.5px;color:var(--mt2);margin-top:2px}
.gc-msg.mine .gc-time{align-self:flex-end}
.gc-input-row{display:flex;gap:8px;align-items:flex-end;padding:8px 0 2px;border-top:1px solid var(--bdr);background:var(--bg)}
.gc-input-row textarea{flex:1;border:1.5px solid var(--bdr);border-radius:10px;padding:9px 11px;font-size:13px;font-family:'Noto Sans','Hind Siliguri',sans-serif;resize:none;max-height:90px;min-height:42px;outline:none;background:var(--inp-bg);color:var(--txt);line-height:1.4}
.gc-input-row textarea:focus{border-color:var(--bl)}
.gc-send-btn{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--bl);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.gc-send-btn:active{background:var(--bl2);transform:scale(.93)}
.gc-send-btn:disabled{background:#B0BEC5;cursor:default}
.gc-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mt);font-size:13px;gap:8px}
.gc-date-sep{text-align:center;font-size:10px;color:var(--mt);margin:6px 0;position:relative}
.gc-date-sep::before,.gc-date-sep::after{content:'';position:absolute;top:50%;width:30%;height:1px;background:var(--bdr)}
.gc-date-sep::before{left:0}.gc-date-sep::after{right:0}
.gc-conn-dot{width:7px;height:7px;border-radius:50%;background:#9E9E9E;display:inline-block;margin-right:4px}
.gc-conn-dot.live{background:#4CAF50;box-shadow:0 0 0 2px #C8E6C9}
/* ── Notice Banner ── */
.notice-banner{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#FFF8E1,#FFFDE7);border:1.5px solid #FFB300;border-radius:9px;padding:8px 11px;margin-bottom:10px;overflow:hidden}
.notice-banner-icon{flex-shrink:0;font-size:15px}
.road-duty-banner{display:flex;align-items:center;gap:8px;border-radius:9px;padding:8px 11px;margin-bottom:10px;cursor:pointer}
.road-duty-banner-so{background:linear-gradient(90deg,#E3F2FD,#EAF4FE);border:1.5px solid #1565C0}
.road-duty-banner-dsr{background:linear-gradient(90deg,#E8F5E9,#EFFAF0);border:1.5px solid #2E7D32;cursor:default}
.notice-track{flex:1;overflow:hidden;position:relative;height:20px}
.notice-scroll{position:absolute;top:0;left:0;display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;color:#E65100;line-height:20px;will-change:transform}
.notice-short{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700;color:#E65100;line-height:20px}
/* ── Important Contacts ── */
.ic-tbl-hdr{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.5fr) minmax(0,2fr) 72px;background:#E8EAF6;padding:7px 12px;font-size:10px;font-weight:700;color:var(--mt);border-bottom:1px solid var(--bdr);gap:6px}
.ic-tbl-hdr.no-act{grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.5fr) minmax(0,2fr)}
.ic-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.5fr) minmax(0,2fr) 72px;padding:10px 12px;border-bottom:1px solid #EEF2FF;gap:6px;align-items:center;transition:.12s}
.ic-row:last-child{border-bottom:none}
.ic-row.no-act{grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.5fr) minmax(0,2fr)}
.ic-row:hover{background:#F5F7FF}
.ic-name{font-size:13px;font-weight:700;color:var(--txt);word-break:break-word}
.ic-role-pill{display:inline-block;background:#E3F2FD;color:var(--bl);border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ic-phone-lnk{color:var(--bl);font-weight:600;font-size:12px;text-decoration:none;word-break:break-all}
.ic-note-txt{font-size:11px;color:var(--mt);word-break:break-word;line-height:1.4}
.ic-edit-block{background:#FFFDE7;padding:11px 12px;border-bottom:1px solid #FFE082}
@media(max-width:460px){
  .ic-tbl-hdr,.ic-tbl-hdr.no-act{grid-template-columns:1fr 1fr;gap:4px}
  .ic-tbl-hdr span:nth-child(3),.ic-tbl-hdr span:nth-child(4),.ic-tbl-hdr span:nth-child(5){display:none}
  .ic-row,.ic-row.no-act{grid-template-columns:1fr 1fr;gap:4px;row-gap:3px}
  .ic-row .ic-note-txt{grid-column:1/-1;font-size:11px}
  .ic-row .ic-act-cell{grid-column:2;grid-row:1;justify-self:end}
}
</style>
</head>

<script>
// ════════════════════════════════════════════════════
//  API HELPER — replaces google.script.run
// ════════════════════════════════════════════════════
async function apiFetch(url, opts) {
  try {
    var options = Object.assign({ headers: {'Content-Type':'application/json'} }, opts || {});
    var res = await fetch(url, options);
    return await res.json();
  } catch(e) {
    return { ok: false, error: e.message };
  }
}
function apiGet(url) { return apiFetch(url); }
function apiPost(url, data) { return apiFetch(url, { method:'POST', body: JSON.stringify(data) }); }
function apiPut(url, data) { return apiFetch(url, { method:'PUT', body: JSON.stringify(data) }); }
function apiDel(url, data) { return apiFetch(url, { method:'DELETE', body: JSON.stringify(data) }); }

// ── Manager approval intercept ──────────────────────────────────────
// If current user is manager, routes submission to the pending-approvals
// staging table instead of writing directly to the main tables.
async function mgrPost(inputType, realUrl, data) {
  if (S.role === 'manager') {
    return apiPost('/api/sr-payments?action=approval_submit', {
      managerId:   S.userId,
      managerName: S.userName,
      inputType:   inputType,
      inputData:   data
    }).then(function(r){ return r && r.ok ? { ok:true, _mgr:true } : r; });
  }
  return apiPost(realUrl, data);
}

// ════════════════════════════════════════════════════
//  AUTH — 5-DIGIT PIN (auto role detect via /api/auth)
// ════════════════════════════════════════════════════
var ROLE_LABELS = { owner:'👑 Owner', manager:'🧑 Manager', so:'📊 SO', dsr:'🚚 DSR', driver:'🚛 Driver' };
var _pinBuf = '';

// ── Tiny beep via Web Audio API — no external audio file needed ──────
var _pinAudioCtx = null;
function _pinBeep(freq) {
  try {
    if (!_pinAudioCtx) _pinAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_pinAudioCtx.state === 'suspended') _pinAudioCtx.resume();
    var osc = _pinAudioCtx.createOscillator();
    var gain = _pinAudioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq || 880;
    gain.gain.setValueAtTime(0.09, _pinAudioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, _pinAudioCtx.currentTime + 0.09);
    osc.connect(gain); gain.connect(_pinAudioCtx.destination);
    osc.start(); osc.stop(_pinAudioCtx.currentTime + 0.09);
  } catch(e) {}
}
function _pinFlash(btn) {
  if (!btn) return;
  btn.classList.add('flash');
  setTimeout(function(){ btn.classList.remove('flash'); }, 120);
}

function pinKey(k, btn) {
  if (_pinBuf.length >= 5) return;
  _pinFlash(btn); _pinBeep(880);
  _pinBuf += k; updatePinDots();
  document.getElementById('pin-err').textContent = '';
  if (_pinBuf.length === 5) checkPin();
}
function pinDel(btn) {
  _pinFlash(btn); _pinBeep(420);
  _pinBuf = _pinBuf.slice(0,-1); updatePinDots();
  document.getElementById('pin-err').textContent = '';
}
function updatePinDots() {
  for (var i=0;i<5;i++) document.getElementById('pd'+i).classList.toggle('filled', i < _pinBuf.length);
}
async function checkPin() {
  var pin = _pinBuf;
  _pinBuf = ''; updatePinDots();
  document.getElementById('pin-err').textContent = '';

  var r = await apiPost('/api/auth', { password: pin });

  if (r && r.ok) {
    // V44 #18 — first-ever login (Owner, starter PIN) must set a real
    // password before proceeding any further. Not skippable: no close
    // button, backdrop click does nothing, hardware back is a no-op
    // for this screen (__onAndroidBack doesn't know this modal's class).
    if (r.mustChangePw) { _showForcedPwSetup(r, pin); return; }
    _completeLogin(r);
  } else {
    _pinBuf = ''; updatePinDots();
    document.getElementById('pin-err').textContent = '❌ ' + ((r && r.error) || 'ভুল PIN');
    var d = document.querySelector('.pin-dots');
    if (d) ['-8px','8px','-4px','0'].forEach(function(v,i){ setTimeout(function(){ d.style.transform='translateX('+v+')'; }, i*80); });
  }
}

function _completeLogin(r) {
  S.role     = r.role;
  S.userId   = r.userId;
  S.userName = r.userName;
  S.userThumb = r.thumb || '';
  sessionStorage.setItem('axiion_session', JSON.stringify({ role: r.role, userId: r.userId, userName: r.userName, thumb: r.thumb || '' }));
  document.getElementById('pin-screen').style.display = 'none';
  applyRole();
  // Always skip splash on login — go straight to app
  var spl = document.getElementById('spl');
  spl.classList.add('fade');
  spl.style.opacity = '0';
  spl.style.pointerEvents = 'none';
  document.getElementById('app').classList.add('show');
  loadAll();
  startLocationTracking();
}

function _showForcedPwSetup(r, tempPin) {
  var modal = document.createElement('div');
  modal.className = 'forced-pw-bg';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,20,.92);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px';

    + '<div style="font-size:12px;color:var(--mt2);margin-bottom:14px">নিরাপত্তার জন্য এগিয়ে যাওয়ার আগে আপনার নিজের একটি নতুন ৫-সংখ্যার PIN সেট করুন। এই ধাপ এড়িয়ে যাওয়া যাবে না।</div>'
    + '<div class="fg"><label class="fl">নতুন PIN (৫ সংখ্যা)</label><input type="number" id="fpw-new" placeholder="নতুন PIN" maxlength="5" oninput="this.value=this.value.slice(0,5)"></div>'
    + '<div class="fg" style="margin-top:8px"><label class="fl">নিশ্চিত করুন</label><input type="number" id="fpw-con" placeholder="আবার লিখুন" maxlength="5" oninput="this.value=this.value.slice(0,5)"></div>'
    + '<div id="fpw-err" style="color:var(--re);font-size:12px;min-height:16px;margin-top:6px"></div>'
    + '<button class="btn btn-bl btn-w" style="margin-top:8px" id="fpw-submit">✅ PIN সেট করুন ও চালিয়ে যান</button>'
    + '</div>';
  document.body.appendChild(modal);
  document.getElementById('fpw-submit').onclick = function() { _submitForcedPwSetup(r, tempPin, modal); };
}
async function _submitForcedPwSetup(r, tempPin, modal) {
  var newPass = (document.getElementById('fpw-new') || {}).value || '';
  var conPass = (document.getElementById('fpw-con') || {}).value || '';
  var errEl = document.getElementById('fpw-err');
  if (!/^\d{5}$/.test(newPass)) { errEl.textContent = 'নতুন PIN অবশ্যই ৫ সংখ্যার হতে হবে'; return; }
  if (newPass !== conPass) { errEl.textContent = 'নতুন পাসওয়ার্ড মিলছে না'; return; }
  if (newPass === tempPin) { errEl.textContent = 'শুরুর PIN থেকে আলাদা একটি নতুন PIN দিন'; return; }
  var btn = document.getElementById('fpw-submit');
  btn.disabled = true; btn.textContent = '...';
  var res = await apiPut('/api/auth', { action:'change', userKey: r.userId, oldPass: tempPin, newPass: newPass });
  if (res && res.ok) {
    document.body.removeChild(modal);
    toast('✅ নতুন PIN সেট হয়েছে');
    _completeLogin(r);
  } else {
    btn.disabled = false; btn.textContent = '✅ PIN সেট করুন ও চালিয়ে যান';
    errEl.textContent = '❌ ' + ((res && res.error) || 'ব্যর্থ — আবার চেষ্টা করুন');
  }
}

// V58 — groups the flat menu into labelled sections (tree nav) so a role
// with many permitted tabs isn't one long undifferentiated scroll. Purely
// a rendering grouping over the same MENU_ITEMS/MENU_PERMS/selectMenuItem
// wiring above — no tab, id, or permission logic changes here.
var MENU_GROUPS = [
  { lb: '',                        ids: ['dash'] },
  { lb: 'পণ্য ও বিক্রয়',           ids: ['prod', 'tx', 'target', 'orders'] },
  { lb: 'টিম ও উপস্থিতি',          ids: ['sr', 'attendance', 'chat', 'ownerapproval'] },
  { lb: 'দোকান ও এলাকা',           ids: ['shopsmap', 'cal'] },
  { lb: 'রিপোর্ট ও হিসাব',         ids: ['rep', 'exp', 'numbers'] },
  { lb: 'সিস্টেম',                  ids: ['pwmgr', 'notice', 'reset'] }
];

function buildSideMenu() {
  var perms = MENU_PERMS[S.role] || ['dash'];
  var el = document.getElementById('side-menu-items');
  if (!el) return;
  var byId = {};
  MENU_ITEMS.forEach(function(it) { byId[it.id] = it; });
  var h = '';
  MENU_GROUPS.forEach(function(g) {
    var idsHere = g.ids.filter(function(id) { return perms.indexOf(id) >= 0 && byId[id]; });
    if (!idsHere.length) return;
    if (g.lb) h += '<div class="side-menu-grouphdr">' + g.lb + '</div>';
    idsHere.forEach(function(id) {
      var it = byId[id];
      // NOTE: no ontouchstart+preventDefault here on purpose — these buttons
      // live inside a scrollable list. Firing on touchstart and blocking the
      // default behaviour is exactly what was stopping the list from
      // scrolling at all (every touch was treated as an instant tap before
      // the browser could tell it was actually a swipe). onclick alone is
      // correct and reliable for a list like this.
      var lbl = (it.id==='pwmgr') ? _pwMgrMenuLabel() : it.lb;
      h += '<button class="smi'+(S.tab===it.id?' active':'')+'" id="smi-'+it.id+'" onclick="selectMenuItem(\''+it.id+'\')"><span class="smi-ic">'+it.ic+'</span><span>'+lbl+'</span></button>';
    });
  });
  // Dark mode + logout live here too now, boxed like every other option —
  // logout styled red so it's unmistakable, matching common app patterns.
  h += '<div class="side-menu-sep"></div>';
  var isDark = document.body.classList.contains('dark');
  h += '<button class="smi" id="smi-theme" onclick="toggleTheme()"><span class="smi-ic">'+(isDark?'☀️':'🌙')+'</span><span>'+(isDark?'লাইট মোড':'ডার্ক মোড')+'</span></button>';
  h += '<button class="smi smi-danger" id="smi-logout" onclick="logout()"><span class="smi-ic">🔒</span><span>লগ আউট</span></button>';
  el.innerHTML = h;
}

function selectMenuItem(id) {
  gTab(id);
  closeMenu();
}

function openMenu() {
  document.getElementById('side-menu').classList.add('show');
  document.getElementById('menu-overlay').classList.add('show');
}
function closeMenu() {
  document.getElementById('side-menu').classList.remove('show');
  document.getElementById('menu-overlay').classList.remove('show');
}

// ════════════════════════════════════════════════════
//  ANDROID BACK BUTTON COORDINATION
//  Called by the wrapper APK (window.__onAndroidBack) every time the
//  hardware/gesture back button is pressed. We handle it ourselves
//  whenever there's something in-app to go back to — closing an open
//  modal/sheet, closing the side menu, or returning to the previously
//  opened section — and only return false (letting the APK exit or
//  fall back to WebView history) when there's truly nothing left,
//  exactly like a normal native app's back stack.
// ════════════════════════════════════════════════════
window.__onAndroidBack = function() {
  try {
    // 1) Slip / share preview panel
    var slipOv = document.getElementById('slip-overlay');
    if (slipOv) { slipOv.remove(); return true; }

    // 2) Any ad-hoc bottom-sheet modal (day detail, salary, due-calendar, etc.)
    var dueModals = document.querySelectorAll('.due-modal-bg');
    if (dueModals.length) { dueModals[dueModals.length-1].remove(); return true; }

    // 3) Product showcase modal
    var scModal = document.getElementById('sc-modal-bg');
    if (scModal) { closeShowcaseModal(); return true; }

    // 3b) Owner-approval detail modal (§9)
    var oaModal = document.getElementById('oa-detail-bg');
    if (oaModal) { closeApprovalDetail(); return true; }

    // 4) Owner PIN re-verification popup — must go through _pincCancel()
    //    so the pending promise resolves(false) instead of hanging forever
    var pincBg = document.getElementById('pinc-bg');
    if (pincBg && pincBg.style.display !== 'none') { _pincCancel(); return true; }

    // 5) Side menu
    var sideMenu = document.getElementById('side-menu');
    if (sideMenu && sideMenu.classList.contains('show')) { closeMenu(); return true; }

    // 6) Go back to whichever section/tab was open before this one
    if (_tabHistory.length > 1) {
      _tabHistory.pop();
      gTab(_tabHistory[_tabHistory.length-1], true);
      return true;
    }

    // 7) Nothing left inside the app — let the APK handle it
    //    (WebView history fallback, then press-again-to-exit)
    return false;
  } catch (e) {
    return false;
  }
};

// V44 #19 — Owner sees the full "manage everyone's PIN" label; every
// other role only ever changes their own PIN from this page, so the
// menu/header label reflects that instead of implying admin power.
function _pwMgrMenuLabel() { return S.role === 'owner' ? 'পাসওয়ার্ড ম্যানেজার' : 'আমার পাসওয়ার্ড'; }

function updateHdrSection(t) {
  var item = MENU_ITEMS.filter(function(it){ return it.id===t; })[0];
  if (!item) return;
  document.getElementById('hdr-section-ic').textContent = item.ic;
  document.getElementById('hdr-section-lb').textContent = (t==='pwmgr') ? _pwMgrMenuLabel() : item.lb;
  var items = document.querySelectorAll('.smi');
  for (var i=0;i<items.length;i++) items[i].classList.toggle('active', items[i].id==='smi-'+t);
}

// Live date + time clock in the second header bar
function _updateHdrClock() {
  var el = document.getElementById('hdr-datetime');
  if (!el) return;
  var n = new Date();
  var dateStr = n.toLocaleDateString('bn-BD', { day:'numeric', month:'long', weekday:'short' });
  var h = n.getHours(), m = n.getMinutes();
  var ap = h >= 12 ? 'PM' : 'AM'; var h12 = h % 12; if (h12===0) h12 = 12;
  var timeStr = h12 + ':' + String(m).padStart(2,'0') + ' ' + ap;
  el.textContent = dateStr + ' · ' + timeStr;
}
setInterval(_updateHdrClock, 15000);
function logout() {
  if (!confirm('লগআউট করবেন?')) return;
  sessionStorage.removeItem('axiion_session');
  if (_locWatchId !== null) { try { navigator.geolocation.clearWatch(_locWatchId); } catch(e){} _locWatchId = null; }
  if (_locTimer) { clearInterval(_locTimer); _locTimer = null; }
  if (_locRearmTimer) { clearInterval(_locRearmTimer); _locRearmTimer = null; }
  _lastCoords = null; _lastCoordsAt = 0;
  S.role = ''; S.userId = ''; S.userName = ''; _dashCache = null; S.dsrMode = 'today';
  S.dsrRoadDuty = undefined; S.soDashData = null; // V56 §5 — never leak stale road-duty across users
  _pinBuf = ''; updatePinDots();
  document.getElementById('app').classList.remove('show');
  // Fully reset splash so re-login works correctly
  var spl = document.getElementById('spl');
  spl.classList.remove('fade');
  spl.style.opacity = '1';
  spl.style.pointerEvents = '';
  spl.style.display = 'flex';
  document.getElementById('pin-screen').style.display = 'flex';
  document.getElementById('pin-err').textContent = '';
}

    setTimeout(loadPwMgr, 0);

}

function renderNoticeTab() {
  var el = document.getElementById('pg-notice'); if (!el) return;
  var h = '<div class="ct">📢 Important Notice</div>';
  h += '<div id="np-wrap"><div style="text-align:center;padding:20px;color:var(--mt2)">লোড হচ্ছে...</div></div>';
  el.innerHTML = h;
  setTimeout(loadNoticePanel, 0);
}

// ════════════════════════════════════════════════════
//  NOTICE PANEL — Owner UI
// ════════════════════════════════════════════════════
async function loadNoticePanel() {
  var el = document.getElementById('np-wrap'); if (!el) return;
  var r = await apiGet('/api/expenses?action=notice-get');
  if (!r || !r.ok) { el.innerHTML = '<div style="padding:16px;color:var(--re)">লোড ব্যর্থ</div>'; return; }
  S.activeNotice = r.notice;
  _renderNoticePanel(r.notice);
}

function _renderNoticePanel(notice) {
  var el = document.getElementById('np-wrap'); if (!el) return;
  var hasActive = notice && notice.content;
  var h = '';

  // Current status box
  h += '<div class="ct" style="margin-bottom:8px">📋 বর্তমান নোটিশ</div>';
  if (hasActive) {
    h += '<div class="card" style="margin-bottom:12px;border-left:4px solid #FFB300;padding:12px 14px">';
    h += '<div style="font-size:11px;color:var(--mt);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">';
    h += '<span style="display:inline-block;background:#E8F5E9;color:#2E7D32;border-radius:20px;padding:2px 10px;font-size:10px;font-weight:700;border:1px solid #A5D6A7">✅ সক্রিয়</span>';
    h += '<span style="display:flex;gap:6px">';
    h += '<button class="btn" style="background:var(--am);color:#fff;padding:5px 12px;font-size:11px" ontouchstart="noticePause();event.preventDefault()" onclick="noticePause()">⏸ বিরতি</button>';
    h += '<button class="btn" style="background:var(--re);color:#fff;padding:5px 12px;font-size:11px" ontouchstart="noticeClear();event.preventDefault()" onclick="noticeClear()">🗑 মুছুন</button>';
    h += '</span></div>';
    h += '<div style="font-size:13px;font-weight:600;color:var(--txt);line-height:1.5;word-break:break-word">'+notice.content+'</div>';
    h += '</div>';
  } else {
    h += '<div class="card" style="margin-bottom:12px;text-align:center;padding:18px;color:var(--mt2);font-size:13px">';
    h += '<div style="font-size:28px;margin-bottom:6px">📭</div>কোনো সক্রিয় নোটিশ নেই';
    h += '</div>';
  }

  // Write / publish box
  h += '<div class="ct" style="margin-bottom:8px">'+(hasActive?'🔄 নোটিশ পরিবর্তন করুন':'✏️ নতুন নোটিশ লিখুন')+'</div>';
  h += '<div class="card" style="margin-bottom:12px">';
  h += '<div class="fg"><label class="fl">নোটিশ টেক্সট</label>';
  h += '<textarea id="np-input" rows="3" placeholder="এখানে নোটিশ লিখুন..." maxlength="200" style="width:100%;border:1.5px solid var(--bdr);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;resize:none;outline:none;color:var(--txt);background:var(--inp-bg);line-height:1.5" oninput="document.getElementById(\'np-count\').textContent=this.value.length"></textarea>';
  h += '<div style="text-align:right;font-size:10px;color:var(--mt2)"><span id="np-count">0</span>/200</div>';
  h += '</div>';
  h += '<button class="btn btn-bl btn-w" style="margin-top:8px" ontouchstart="noticePublish();event.preventDefault()" onclick="noticePublish()">📢 '+(hasActive?'পরিবর্তন করে প্রকাশ করুন':'প্রকাশ করুন')+'</button>';
  h += '</div>';

  el.innerHTML = h;
}

async function noticePublish() {
  var ta = document.getElementById('np-input'); if (!ta) return;
  var content = ta.value.trim();
  if (!content) return toast('নোটিশ টেক্সট লিখুন');
  showOvl('প্রকাশ হচ্ছে...');
  var r = await apiPost('/api/expenses?action=notice-publish', { content });
  hideOvl();
  if (!r || !r.ok) return toast(r.error || 'ব্যর্থ');
  S.activeNotice = { content };
  toast('✅ নোটিশ প্রকাশ হয়েছে');
  loadNoticePanel();
}

async function noticePause() {
  if (!confirm('নোটিশটি বিরতিতে দিবেন? ব্যবহারকারীরা দেখতে পাবে না।')) return;
  showOvl('আপডেট হচ্ছে...');
  var r = await apiPost('/api/expenses?action=notice-pause', {});
  hideOvl();
  if (!r || !r.ok) return toast(r.error || 'ব্যর্থ');
  S.activeNotice = null;
  toast('⏸ নোটিশ বিরতিতে আছে');
  loadNoticePanel();
}

async function noticeClear() {
  if (!confirm('নোটিশটি সম্পূর্ণ মুছে ফেলবেন?')) return;
  showOvl('মুছে যাচ্ছে...');
  var r = await apiPost('/api/expenses?action=notice-clear', {});
  hideOvl();
  if (!r || !r.ok) return toast(r.error || 'ব্যর্থ');
  S.activeNotice = null;
  toast('🗑 নোটিশ মুছে গেছে');
  loadNoticePanel();
}

// ════════════════════════════════════════════════════
//  IMPORTANT NUMBERS — Contact Directory
// ════════════════════════════════════════════════════
var _impContacts = [];
var _impEditId     = null;
var _impManageOpen = false;
var _impSearchQ    = '';

async function loadImpNumbers() {
  var el = document.getElementById('imp-wrap'); if (!el) return;
  el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--mt2)">লোড হচ্ছে...</div>';
  var r = await apiGet('/api/expenses?action=contacts-list');
  if (!r || !r.ok) { el.innerHTML = '<div style="padding:16px;color:var(--re)">লোড ব্যর্থ</div>'; return; }
  _impContacts   = r.contacts || [];
  _impEditId     = null;
  _impManageOpen = false;
  _impSearchQ    = '';
  renderImpNumbers();
}

function renderImpNumbers() {
  var el = document.getElementById('imp-wrap'); if (!el) return;
  var h = '';

  if (!_impManageOpen) {
    // ══ MAIN VIEW: Manage Contacts card (Owner only) + read-only list ══

    // ── ⚙️ Manage Contacts tappable card — OWNER ONLY. Everyone else
    //    (Manager/SO/DSR) only ever sees the read-only list below. ────
    if (S.role === 'owner') {
      h += '<div class="card" style="display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;border:1.5px solid var(--bdr);margin-bottom:14px;transition:.15s;user-select:none" ontouchstart="impOpenManage();event.preventDefault()" onclick="impOpenManage()">';
      h += '<div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--bl),var(--bl2));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">\u2699\ufe0f</div>';
      h += '<div style="flex:1">';
      h += '<div style="font-size:14px;font-weight:700;color:var(--txt)">Manage Contacts</div>';
      h += '<div style="font-size:11px;color:var(--mt2);margin-top:2px">\u0995\u09a8\u09cd\u099f\u09be\u0995\u09cd\u099f \u09af\u09cb\u0997, \u09b8\u09ae\u09cd\u09aa\u09be\u09a6\u09a8\u09be \u0993 \u09ae\u09c1\u099b\u09c1\u09a8</div>';
      h += '</div>';
      h += '<div style="color:var(--mt2);font-size:20px;font-weight:300">\u203a</div>';
      h += '</div>';
    }

    // ── Search bar — filter by shop/contact name, tap to call directly ──
    h += '<div class="fg" style="margin-bottom:10px">';
    h += '<input type="text" id="imp-search" placeholder="🔍 নাম দিয়ে খুঁজুন..." value="'+esc(_impSearchQ)+'" oninput="impSearchInput(this.value)" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--bdr);font-size:14px;box-sizing:border-box;background:var(--card);color:var(--txt)">';
    h += '</div>';

    // ── Read-only All Numbers list ────────────────────────
    h += '<div id="imp-list-box"></div>';

  } else {
    // ══ MANAGE VIEW: back button + add form + list with edit/delete ══

    h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">';
    h += '<button class="btn btn-gh" style="padding:7px 14px;font-size:12px;font-weight:700" ontouchstart="impCloseManage();event.preventDefault()" onclick="impCloseManage()">\u2190 \u09ab\u09bf\u09b0\u09c7 \u09af\u09be\u09a8</button>';
    h += '<div style="font-size:13px;font-weight:700;color:var(--txt)">\u2699\ufe0f \u0995\u09a8\u09cd\u099f\u09be\u0995\u09cd\u099f \u09aa\u09b0\u09bf\u099a\u09be\u09b2\u09a8\u09be</div>';
    h += '</div>';

    h += '<div class="ct">\u2795 \u09a8\u09a4\u09c1\u09a8 \u0995\u09a8\u09cd\u099f\u09be\u0995\u09cd\u099f \u09af\u09cb\u0997 \u0995\u09b0\u09c1\u09a8</div>';
    h += '<div class="card" style="margin-bottom:12px">';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
    h += '<div class="fg"><label class="fl">\u09a8\u09be\u09ae *</label><input type="text" id="ic-name" placeholder="\u09af\u09c7\u09ae\u09a8: \u09ae\u09bf\u09b2\u09a8 \u09ad\u09be\u0987" maxlength="80"></div>';
    h += '<div class="fg"><label class="fl">\u09aa\u09a6\u09ac\u09bf / \u09ad\u09c2\u09ae\u09bf\u0995\u09be</label><input type="text" id="ic-role" placeholder="DSR, Supplier\u2026" maxlength="60"></div>';
    h += '</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">';
    h += '<div class="fg"><label class="fl">\u09ab\u09cb\u09a8 \u09a8\u09ae\u09cd\u09ac\u09b0</label><input type="tel" id="ic-phone" placeholder="01XXXXXXXXX" maxlength="20"></div>';
    h += '<div class="fg"><label class="fl">\u09ac\u09bf\u09b6\u09c7\u09b7 \u09a8\u09cb\u099f</label><input type="text" id="ic-note" placeholder="\u09af\u09c7\u0995\u09cb\u09a8\u09cb \u09a4\u09a5\u09cd\u09af" maxlength="120"></div>';
    h += '</div>';
    h += '<button class="btn btn-bl btn-w" style="margin-top:10px" ontouchstart="impAdd();event.preventDefault()" onclick="impAdd()">\u2795 \u09af\u09cb\u0997 \u0995\u09b0\u09c1\u09a8</button>';
    h += '</div>';

    h += '<div class="ct">\ud83d\udcde \u0995\u09a8\u09cd\u099f\u09be\u0995\u09cd\u099f \u09a4\u09be\u09b2\u09bf\u0995\u09be <span style="font-size:11px;font-weight:400;color:var(--mt2)">('+_impContacts.length+'\u099f\u09bf \u098f\u09a8\u09cd\u099f\u09cd\u09b0\u09bf)</span></div>';

    if (!_impContacts.length) {
      h += '<div class="card" style="text-align:center;padding:28px;color:var(--mt2)"><div style="font-size:36px;margin-bottom:8px">\ud83d\udced</div>\u098f\u0996\u09a8\u09cb \u0995\u09cb\u09a8\u09cb \u0995\u09a8\u09cd\u099f\u09be\u0995\u09cd\u099f \u09af\u09cb\u0997 \u0995\u09b0\u09be \u09b9\u09af\u09bc\u09a8\u09bf</div>';
    } else {
      h += '<div class="card" style="padding:0;overflow:hidden">';
      h += '<div class="ic-tbl-hdr"><span>\u09a8\u09be\u09ae</span><span>\u09aa\u09a6\u09ac\u09bf</span><span>\u09ab\u09cb\u09a8 \u09a8\u09ae\u09cd\u09ac\u09b0</span><span>\u09ac\u09bf\u09b6\u09c7\u09b7 \u09a8\u09cb\u099f</span><span style="text-align:center">\u0985\u09cd\u09af\u09be\u0995\u09b6\u09a8</span></div>';
      _impContacts.forEach(function(c) {
        if (_impEditId === c.id) {
          h += '<div class="ic-edit-block">';
          h += '<div class="ct" style="font-size:12px;margin-bottom:8px">\u270f\ufe0f \u098f\u09a8\u09cd\u099f\u09cd\u09b0\u09bf \u09b8\u09ae\u09cd\u09aa\u09be\u09a6\u09a8\u09be \u0995\u09b0\u09c1\u09a8</div>';
          h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">';
          h += '<div class="fg"><label class="fl">\u09a8\u09be\u09ae *</label><input type="text" id="ie-name" value="'+esc(c.name)+'" maxlength="80"></div>';
          h += '<div class="fg"><label class="fl">\u09aa\u09a6\u09ac\u09bf</label><input type="text" id="ie-role" value="'+esc(c.role)+'" maxlength="60"></div>';
          h += '</div>';
          h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px">';
          h += '<div class="fg"><label class="fl">\u09ab\u09cb\u09a8</label><input type="tel" id="ie-phone" value="'+esc(c.phone)+'" maxlength="20"></div>';
          h += '<div class="fg"><label class="fl">\u09a8\u09cb\u099f</label><input type="text" id="ie-note" value="'+esc(c.note)+'" maxlength="120"></div>';
          h += '</div>';
          h += '<div style="display:flex;gap:7px;margin-top:9px">';
          h += '<button class="btn btn-bl" style="flex:1;font-size:12px" ontouchstart="impSaveEdit(\''+c.id+'\');event.preventDefault()" onclick="impSaveEdit(\''+c.id+'\')">\u2705 \u09b8\u09c7\u09ad \u0995\u09b0\u09c1\u09a8</button>';
          h += '<button class="btn btn-gh" style="flex:1;font-size:12px" ontouchstart="_impEditId=null;renderImpNumbers();event.preventDefault()" onclick="_impEditId=null;renderImpNumbers()">\u274c \u09ac\u09be\u09a4\u09bf\u09b2</button>';
          h += '</div></div>';
        } else {
          h += '<div class="ic-row">';
          h += '<div class="ic-name">'+esc(c.name)+'</div>';
          h += '<div>'+(c.role ? '<span class="ic-role-pill">'+esc(c.role)+'</span>' : '<span style="color:var(--mt2);font-size:11px">\u2014</span>')+'</div>';
          h += '<div>'+(c.phone ? '<a class="ic-phone-lnk" href="tel:'+esc(c.phone)+'">\ud83d\udcde '+esc(c.phone)+'</a>' : '<span style="color:var(--mt2);font-size:11px">\u2014</span>')+'</div>';
          h += '<div class="ic-note-txt">'+(c.note ? esc(c.note) : '<span style="color:var(--mt2)">\u2014</span>')+'</div>';
          h += '<div class="ic-act-cell" style="display:flex;gap:5px;justify-content:center">';
          h += '<button class="btn" style="background:var(--am);color:#fff;padding:5px 9px;font-size:11px" ontouchstart="impEdit(\''+c.id+'\');event.preventDefault()" onclick="impEdit(\''+c.id+'\')">\u270f\ufe0f</button>';
          h += '<button class="btn" style="background:var(--re);color:#fff;padding:5px 9px;font-size:11px" ontouchstart="impDel(\''+c.id+'\',\''+esc(c.name)+'\');event.preventDefault()" onclick="impDel(\''+c.id+'\',\''+esc(c.name)+'\')">\ud83d\uddd1</button>';
          h += '</div></div>';
        }
      });
      h += '</div>';
    }
  }

  el.innerHTML = h;
  if (!_impManageOpen) renderImpList();
}

function impSearchInput(val) {
  _impSearchQ = val || '';
  renderImpList();
}

function renderImpList() {
  var box = document.getElementById('imp-list-box'); if (!box) return;
  var q = _impSearchQ.trim().toLowerCase();
  var list = q ? _impContacts.filter(function(c){ return (c.name||'').toLowerCase().indexOf(q) !== -1; }) : _impContacts;
  var h = '<div class="ct">\ud83d\udcde \u09b8\u0995\u09b2 \u09a8\u09ae\u09cd\u09ac\u09b0 <span style="font-size:11px;font-weight:400;color:var(--mt2)">('+list.length+'\u099f\u09bf)</span></div>';

  if (!_impContacts.length) {
    h += '<div class="card" style="text-align:center;padding:32px;color:var(--mt2)"><div style="font-size:40px;margin-bottom:10px">\ud83d\udced</div><div style="font-size:13px">\u098f\u0996\u09a8\u09cb \u0995\u09cb\u09a8\u09cb \u0995\u09a8\u09cd\u099f\u09be\u0995\u09cd\u099f \u09af\u09cb\u0997 \u0995\u09b0\u09be \u09b9\u09af\u09bc\u09a8\u09bf</div><div style="font-size:11px;margin-top:6px">\u2699\ufe0f Manage Contacts \u09a5\u09c7\u0995\u09c7 \u09af\u09cb\u0997 \u0995\u09b0\u09c1\u09a8</div></div>';
  } else if (!list.length) {
    h += '<div class="card" style="text-align:center;padding:28px;color:var(--mt2)"><div style="font-size:32px;margin-bottom:8px">\ud83d\udd0d</div><div style="font-size:13px">"'+esc(_impSearchQ)+'" \u098f\u09b0 \u09b8\u09be\u09a5\u09c7 \u09ae\u09bf\u09b2\u09c7 \u098f\u09ae\u09a8 \u0995\u09cb\u09a8\u09cb \u09a8\u09be\u09ae \u09aa\u09be\u0993\u09af\u09bc\u09be \u09af\u09be\u09af\u09bc\u09a8\u09bf</div></div>';
  } else {
    var avatarColors = ['#1565C0','#2E7D32','#C62828','#6A1B9A','#00838F','#E65100','#283593','#558B2F'];
    list.forEach(function(c, i) {
      var initial = (c.name || '?').charAt(0).toUpperCase();
      var aColor  = avatarColors[i % avatarColors.length];
      h += '<div class="card" style="display:flex;align-items:center;gap:13px;padding:12px 14px;margin-bottom:8px">';
      h += '<div style="width:44px;height:44px;border-radius:50%;background:'+aColor+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0">'+initial+'</div>';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px">';
      h += '<span style="font-size:14px;font-weight:700;color:var(--txt)">'+esc(c.name)+'</span>';
      if (c.role) h += '<span class="ic-role-pill">'+esc(c.role)+'</span>';
      h += '</div>';
      if (c.phone) h += '<a class="ic-phone-lnk" href="tel:'+esc(c.phone)+'" style="display:inline-block;margin-top:1px;font-size:12px">\ud83d\udcde '+esc(c.phone)+'</a>';
      if (c.note)  h += '<div style="font-size:11px;color:var(--mt);font-style:italic;margin-top:3px;line-height:1.4">'+esc(c.note)+'</div>';
      h += '</div></div>';
    });
  }
  box.innerHTML = h;
}

function impOpenManage() {
  if (S.role !== 'owner') return; // safety — only Owner may manage contacts
  _impManageOpen = true;
  renderImpNumbers();
}

function impCloseManage() {
  _impManageOpen = false;
  _impEditId     = null;
  renderImpNumbers();
}

async function impAdd() {
  var name  = ((document.getElementById('ic-name') ||{}).value||'').trim();
  var role  = ((document.getElementById('ic-role') ||{}).value||'').trim();
  var phone = ((document.getElementById('ic-phone')||{}).value||'').trim();
  var note  = ((document.getElementById('ic-note') ||{}).value||'').trim();
  if (!name) return toast('নাম লিখুন');
  showOvl('যোগ হচ্ছে...');
  var r = await apiPost('/api/expenses?action=contacts-add', { name, role, phone, note, createdBy: S.userId, role_actor: S.role });
  hideOvl();
  if (!r || !r.ok) return toast((r&&r.error)||'যোগ ব্যর্থ');
  toast('✅ কন্টাক্ট যোগ হয়েছে');
  loadImpNumbers();
}

function impEdit(id) {
  _impEditId = id;
  renderImpNumbers();
  setTimeout(function() { var f=document.getElementById('ie-name'); if(f) f.focus(); }, 60);
}

async function impSaveEdit(id) {
  var name  = ((document.getElementById('ie-name') ||{}).value||'').trim();
  var role  = ((document.getElementById('ie-role') ||{}).value||'').trim();
  var phone = ((document.getElementById('ie-phone')||{}).value||'').trim();
  var note  = ((document.getElementById('ie-note') ||{}).value||'').trim();
  if (!name) return toast('নাম লিখুন');
  showOvl('সেভ হচ্ছে...');
  var r = await apiPost('/api/expenses?action=contacts-edit', { id, name, role, phone, note, role_actor: S.role });
  hideOvl();
  if (!r || !r.ok) return toast((r&&r.error)||'সেভ ব্যর্থ');
  toast('✅ আপডেট হয়েছে');
  loadImpNumbers();
}

async function impDel(id, name) {
  if (!confirm('"'+name+'" মুছে ফেলবেন?')) return;
  showOvl('মুছছে...');
  var r = await apiDel('/api/expenses?action=contacts-del', { id, role_actor: S.role });
  hideOvl();
  if (!r || !r.ok) return toast((r&&r.error)||'মুছতে ব্যর্থ');
  toast('🗑 মুছে গেছে');
  loadImpNumbers();

function oaTypeLabel(inputType, d) {
  var txMap = {give:'স্টক সরবরাহ',return:'ফেরত',damage:'ড্যামেজ',buy:'কেনা',point_sale:'পয়েন্ট সেল',point_damage_return:'পয়েন্ট ফেরত',dsr_sale:'দোকানে বিক্রয় (DSR)'};
  if (inputType==='transaction') return txMap[d.type]||d.type||'লেনদেন';
  if (inputType==='payment') return 'পেমেন্ট';
  if (inputType==='expense') return 'খরচ';
  return inputType;
}

function oaSummary(inputType, d) {
  if (inputType==='transaction') {
    var items = d.items||[];
    var total = items.reduce(function(s,i){return s+num(i.totalUnits);},0);
    var names = items.slice(0,2).map(function(i){return i.productName||'';}).filter(Boolean).join(', ');
    return (d.srName?'DSR: '+d.srName+' · ':'')+(names||'')+' · '+total+' পিস · '+fmtBn(d.date);
  }
  if (inputType==='payment') {
    var tot=(num(d.cashAmount)+num(d.commissionAmt)+num(d.discountAmt)+num(d.damageAmt))||num(d.amount);
    return (d.srName?d.srName+' · ':'')+' ৳'+fm(tot)+' · '+fmtBn(d.date);
  }
  if (inputType==='expense') {
    var ent=d.entries||[];
    var total2=ent.reduce(function(s,e){return s+num(e.amount);},0);
    return '৳'+fm(total2)+' · '+fmtBn(d.date);
  }
  return '';
}

async function saveApprovalEdit() {
  var a = _oaData.find(function(x){ return x.id === _oaDetailId; });
  if (!a) return;
  var d = JSON.parse(JSON.stringify(a.inputData || {}));

  if (a.inputType === 'transaction') {
    (d.items||[]).forEach(function(it, i) {
      var cs = num(v('oae-cs-'+i)), pc = num(v('oae-pc-'+i)), pr = num(v('oae-pr-'+i));
      var p = S.products.find(function(x){ return x.id === it.productId; });
      var caseSize = p ? (num(p.caseSize)||1) : 1;
      it.cases = cs; it.pcs = pc; it.totalUnits = cs*caseSize + pc;
      if (d.type === 'buy' || d.type === 'damage') it.purchasePrice = pr; else it.sellingPrice = pr;
    });
    d.note = v('oae-note');
  } else if (a.inputType === 'payment') {
    d.cashAmount = num(v('oae-cash')); d.commissionAmt = num(v('oae-comm'));
    d.discountAmt = num(v('oae-disc')); d.damageAmt = num(v('oae-dmg'));
    d.amount = d.cashAmount + d.commissionAmt + d.discountAmt + d.damageAmt;
    d.note = v('oae-note');
  } else if (a.inputType === 'expense') {
    (d.entries||[]).forEach(function(e, i) { e.amount = num(v('oae-ex-'+i)); });
    d.note = v('oae-note');
  }
