function renderProd() {
  var isOwner = S.role==='owner';
  var isMgr   = S.role==='manager';
  var isSO    = S.role==='so';
  var canEdit = isOwner; // only owner can add/edit/delete products
  var canShowcase = isOwner || isMgr; // manager can see product showcase

  var el = document.getElementById('pg-prod');
  var tabs='<div class="seg">';
  if (isSO) {
    tabs += '<button class="sbt active">📦 SKU স্টক</button>';
    tabs += '</div>';
    el.innerHTML = tabs + buildStockPage();
    return;
  }
  tabs += '<button class="sbt '+(S.prodTab==='list'?'active':'')+'\" onclick="S.prodTab=\'list\';renderProd()">📋 তালিকা</button>';
  if (canEdit) tabs += '<button class="sbt '+(S.prodTab==='add'?'active':'')+'\" onclick="S.prodTab=\'add\';renderProd()">➕ যোগ করুন</button>';
  tabs += '<button class="sbt '+(S.prodTab==='stock'?'active':'')+'\" onclick="S.prodTab=\'stock\';renderProd()">🏪 SKU স্টক</button>';
  tabs += '<button class="sbt '+(S.prodTab==='showcase'?'active':'')+'\" onclick="S.prodTab=\'showcase\';renderProd()">🖼️ পণ্যের ছবি</button>';
  tabs += '</div>';

  el.innerHTML = tabs + (S.prodTab==='add'?buildProdForm():S.prodTab==='stock'?buildStockPage():S.prodTab==='showcase'?buildShowcasePage():buildProdList(canEdit));

  if (S.prodTab==='add') {
    var p2 = S.editProdId ? S.products.find(function(x){return x.id===S.editProdId;}) : null;
    setTimeout(function(){
      var prv=document.getElementById('pf-prv'); if (!prv) return;
      prv.setAttribute('data-fallback','📦');
      if (IMG.prod.previewUrl) setContainerImg(prv, IMG.prod.previewUrl);
      else if (p2 && getThumb(p2)) setContainerImg(prv, getThumb(p2));
    }, 0);
  }
}

function buildShowcasePage() {
  if (!S.products.length) return '<div class="sc-empty"><span>📦</span><p>কোনো পণ্য নেই</p></div>';

  var q = (S.showcaseQ||'').toLowerCase();
  var filtered = q ? S.products.filter(function(p){
    return p.name.toLowerCase().indexOf(q)>=0 || p.sku.toLowerCase().indexOf(q)>=0;
  }) : S.products;

  var h = '<div class="showcase-wrap">';

  // Header banner
  h += '<div class="showcase-header">';
  h += '<h2>🖼️ পণ্যের ছবি</h2>';
  h += '<p>ব্যবসায়িক অংশীদারদের জন্য পণ্য ক্যাটালগ</p>';
  h += '</div>';

  // Search filter
  h += '<div class="sc-filter">';
  h += '<input class="sc-search" placeholder="🔍 পণ্য খুঁজুন..." value="'+(q?esc(q):'')+'" oninput="S.showcaseQ=this.value;renderProd()">';
  h += '</div>';

  if (!filtered.length) {
    h += '<div class="sc-empty"><span>🔍</span><p>কোনো পণ্য পাওয়া যায়নি</p></div>';
    h += '</div>';
    return h;
  }

  h += '<div class="showcase-grid">';
  filtered.forEach(function(p) {
    var thumb = getThumb(p);
    var imgHtml = thumb
      ? '<div class="sc-img"><img src="'+thumb+'" alt="'+esc(p.name)+'" onerror="this.style.visibility=\'hidden\'"></div>'
      : '<div class="sc-img"><div class="sc-no-img"><span>📦</span><small>NO IMAGE</small></div></div>';

    var offer = '';
    if (num(p.bonusFreeUnits)) {
      offer = '<div class="sc-offer">🎁 '+p.bonusCasesReq+(p.unitType||'কেস')+'এ '+p.bonusFreeUnits+'পিস ফ্রি'+(num(p.bonusFreeMoney)?' + ৳'+fm(p.bonusFreeMoney):'')+'</div>';
    }

    h += '<div class="sc-card" onclick="openShowcaseModal(\''+p.id+'\')">';
    h += imgHtml;
    h += '<div class="sc-info">';
    h += '<div class="sc-name">'+esc(p.name)+'</div>';
    h += '<div><span class="sc-sku">'+esc(p.sku)+'</span></div>';
    h += '<div class="sc-price">৳'+fm(p.sellingPrice)+' <span class="sc-price-sub">/ পিস</span></div>';
    if (offer) h += offer;
    h += '</div>';
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

function openShowcaseModal(id) {
  var p = S.products.find(function(x){return x.id===id;});
  if (!p) return;
  var thumb = getThumb(p);
  var stk = S.stockMap[p.id]||0;
  var cs = num(p.caseSize)||1;
  var cases = Math.floor(stk/cs), rem = stk%cs;
  var sc = stk>10?'var(--gr)':stk>0?'var(--am)':'var(--re)';

  var imgHtml = thumb
    ? '<img src="'+thumb+'" alt="'+esc(p.name)+'" onerror="this.style.visibility=\'hidden\'">'
    : '<span style="font-size:80px">📦</span>';

  var offer = '';
  if (num(p.bonusFreeUnits)) {
    offer = '<div class="sc-modal-row"><span class="sc-modal-label">🎁 অফার</span><span class="sc-modal-val" style="color:var(--am)">'+p.bonusCasesReq+(p.unitType||'কেস')+'এ '+p.bonusFreeUnits+'পিস ফ্রি'+(num(p.bonusFreeMoney)?' + ৳'+fm(p.bonusFreeMoney):'')+'</span></div>';
  }

  var stkTxt = stk>0?((cases>0?cases+' '+(p.unitType||'কেস')+' ':'')+( rem>0?rem+' পিস':'')):'স্টক নেই';

  var html = '<div class="sc-modal-bg" id="sc-modal-bg" onclick="closeShowcaseModal(event)">';
  html += '<div class="sc-modal" onclick="event.stopPropagation()">';
  html += '<div class="sc-modal-img" style="position:relative">'+imgHtml;
  html += '<button class="sc-close" onclick="closeShowcaseModal()">✕</button>';
  html += '</div>';
  html += '<div class="sc-modal-body">';
  html += '<div class="sc-modal-name">'+esc(p.name)+'</div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">SKU</span><span class="sc-modal-val"><span class="bdg b-bl">'+esc(p.sku)+'</span></span></div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">'+(p.unitType||'কেস')+'এ পিস</span><span class="sc-modal-val">'+p.caseSize+' পিস / '+(p.unitType||'কেস')+'</span></div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">বিক্রয় মূল্য</span><span class="sc-modal-val" style="color:var(--gr);font-size:15px">৳'+fm(p.sellingPrice)+' / পিস</span></div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">'+(p.unitType||'কেস')+' মূল্য</span><span class="sc-modal-val">৳'+fm(num(p.sellingPrice)*cs)+' / '+(p.unitType||'কেস')+'</span></div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">স্টক</span><span class="sc-modal-val" style="color:'+sc+'">'+stkTxt+'</span></div>';
  if (offer) html += offer;
  html += '</div></div></div>';

  var existing = document.getElementById('sc-modal-bg');
  if (existing) existing.remove();
  document.body.insertAdjacentHTML('beforeend', html);
}

function closeShowcaseModal(e) {
  if (e && e.target !== document.getElementById('sc-modal-bg')) return;
  var m = document.getElementById('sc-modal-bg'); if (m) m.remove();
}

function _prodCategoryList() {
  var set = {};
  (S.products||[]).forEach(function(p){ var c=(p.category||'').trim(); if (c) set[c]=1; });
  return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'bn'); });
}
function _prodFilteredList() {
  var q = (S.prodSearchQ||'').toLowerCase();
  var cat = S.prodCatFilter || '';
  return (S.products||[]).filter(function(p){
    if (cat && (p.category||'') !== cat) return false;
    if (q && p.name.toLowerCase().indexOf(q)<0 && p.sku.toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function _prodCatChipsInner() {
  var cats = _prodCategoryList();
  if (!cats.length) return '';
  var h = '<button class="sbt '+(!S.prodCatFilter?'active':'')+'" style="padding:4px 10px;font-size:11px;white-space:nowrap;flex:0 0 auto;border:1px solid var(--bdr);border-radius:14px" onclick="prodSetCatFilter(\'\')">সব ('+S.products.length+')</button>';
  cats.forEach(function(c){
    var cnt = S.products.filter(function(p){ return (p.category||'')===c; }).length;
    h += '<button class="sbt '+(S.prodCatFilter===c?'active':'')+'" style="padding:4px 10px;font-size:11px;white-space:nowrap;flex:0 0 auto;border:1px solid var(--bdr);border-radius:14px" onclick="prodSetCatFilter('+JSON.stringify(c)+')">🏷️ '+esc(c)+' ('+cnt+')</button>';
  });
  return h;
}
function buildProdList(canEdit) {
  if (!S.products.length) return '<div style="padding:24px;text-align:center;color:var(--mt2)">কোনো পণ্য নেই</div>';
  var isOwner = S.role==='owner';
  var chips = _prodCatChipsInner();
  var h='<div class="card" style="padding:0;overflow:hidden">';
  // Search
  h+='<div style="padding:8px 11px;border-bottom:1px solid #EEF2FF"><input placeholder="🔍 পণ্য খুঁজুন..." value="'+esc(S.prodSearchQ||'')+'" oninput="filterProds(this.value)" style="margin:0"></div>';
  if (chips) h+='<div id="prod-cat-chips" style="padding:8px 11px;border-bottom:1px solid #EEF2FF;display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto">'+chips+'</div>';
  if (canEdit) h+='<div style="padding:6px 11px;font-size:10px;color:var(--mt2);border-bottom:1px solid #EEF2FF">🔀 ক্রম বদলাতে ▲▼ চাপুন, অথবা নম্বর ঘরে নতুন পজিশন লিখে Enter চাপুন'+((S.prodSearchQ||S.prodCatFilter)?' (সার্চ/ফিল্টার সরালে ক্রম বদলানো যাবে)':'')+'</div>';
  h+='<div id="prod-list-body">';
  h+=buildProdRows(_prodFilteredList(), canEdit, isOwner);
  h+='</div></div>';
  return h;
}
function buildProdRows(prods, canEdit, isOwner) {
  var h='';
  var reorderable = canEdit && !(S.prodSearchQ) && !(S.prodCatFilter);
  var total = S.products.length;
  prods.forEach(function(p){
    var stk=S.stockMap[p.id]||0, swc=stk>10?'stk-ok':stk>0?'stk-lo':'stk-no';
    var alert=num(p.lowStockAlert)>0&&stk<=num(p.lowStockAlert);
    var ti=thumbImg(p,'7px');
    var posIdx = S.products.findIndex(function(x){return x.id===p.id;}) + 1;
    h+='<div class="pc">';
    if (reorderable) {
      h+='<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;margin-right:4px">';
      h+='<button class="btn btn-gh btn-sm" style="padding:1px 6px;font-size:10px;line-height:1.3" onclick="_prodMove(\''+p.id+'\',-1)"'+(posIdx<=1?' disabled':'')+'>▲</button>';
      h+='<input type="number" min="1" max="'+total+'" value="'+posIdx+'" style="width:36px;text-align:center;padding:2px;font-size:10px;margin:0" onkeydown="if(event.key===\'Enter\'){_prodMoveToPos(\''+p.id+'\',this.value);}">';
      h+='<button class="btn btn-gh btn-sm" style="padding:1px 6px;font-size:10px;line-height:1.3" onclick="_prodMove(\''+p.id+'\',1)"'+(posIdx>=total?' disabled':'')+'>▼</button>';
      h+='</div>';
    } else if (canEdit) {
      h+='<div style="width:20px;text-align:center;flex-shrink:0;font-size:10px;color:var(--mt2);font-weight:700">'+posIdx+'</div>';
    }
    h+='<div class="pc-img">'+(ti||'📦')+'</div>';
    h+='<div style="flex:1;min-width:0">';
    h+='<div style="font-weight:700;font-size:12px">'+esc(p.name)+(alert?'<span class="low-alert">কম স্টক!</span>':'')+'</div>';
    h+='<div style="font-size:10px;color:var(--mt2)"><span class="bdg b-bl">'+esc(p.sku)+'</span> · '+p.caseSize+'পিস/'+(p.unitType||'কেস')+(p.category?' · 🏷️ '+esc(p.category):'')+'</div>';
    if (isOwner) h+='<div style="font-size:10px">ক্রয়:৳'+fm(p.purchasePrice)+' · বিক্রয়:৳'+fm(p.sellingPrice)+' · <span class="'+swc+'">স্টক:'+fn(stk)+'পিস</span></div>';
    else h+='<div style="font-size:10px">বিক্রয়:৳'+fm(p.sellingPrice)+' · <span class="'+swc+'">স্টক:'+fn(stk)+'পিস</span></div>';
    if (num(p.bonusFreeUnits)) h+='<div style="font-size:10px;color:var(--am)">🎁 '+p.bonusCasesReq+(p.unitType||'কেস')+'এ '+p.bonusFreeUnits+'পিস ফ্রি'+(num(p.bonusFreeMoney)?' + ৳'+fm(p.bonusFreeMoney):'')+'</div>';
    h+='</div>';
    if (canEdit) {
      h+='<div style="display:flex;gap:5px;flex-shrink:0">';
      h+='<button class="btn btn-gh btn-sm" onclick="editProd(\''+p.id+'\')">✏️</button>';
      h+='<button class="btn btn-sm" style="background:var(--rel);color:var(--re)" onclick="delProd(\''+p.id+'\')">🗑️</button>';
      h+='</div>';
    }
    h+='</div>';
  });
  return h;
}
function filterProds(q) {
  S.prodSearchQ = q;
  _prodRefreshBody();
}
function prodSetCatFilter(c) {
  S.prodCatFilter = c;
  var chipsEl = document.getElementById('prod-cat-chips'); if (chipsEl) chipsEl.innerHTML = _prodCatChipsInner();
  _prodRefreshBody();
}
function _prodRefreshBody() {
  var el=document.getElementById('prod-list-body'); if(el) el.innerHTML=buildProdRows(_prodFilteredList(), S.role==='owner', S.role==='owner');
}
function _prodMove(id, dir) {
  var idx = S.products.findIndex(function(p){return p.id===id;});
  if (idx<0) return;
  var swapIdx = idx+dir;
  if (swapIdx<0 || swapIdx>=S.products.length) return;
  var arr = S.products.slice();
  var tmp = arr[idx]; arr[idx]=arr[swapIdx]; arr[swapIdx]=tmp;
  _prodPersistOrder(arr);
}
function _prodMoveToPos(id, posVal) {
  var pos = parseInt(posVal, 10);
  if (!pos || pos<1) return toast('সঠিক নম্বর দিন');
  var idx = S.products.findIndex(function(p){return p.id===id;});
  if (idx<0) return;
  var target = Math.max(1, Math.min(S.products.length, pos)) - 1;
  if (target===idx) return;
  var arr = S.products.slice();
  var item = arr.splice(idx,1)[0];
  arr.splice(target,0,item);
  _prodPersistOrder(arr);
}
async function _prodPersistOrder(newArr) {
  S.products = newArr;
  _prodRefreshBody();
  var ids = newArr.map(function(p){return p.id;});
  var r = await apiPut('/api/products', { action:'reorder', order: ids });
  if (!r || !r.ok) { toast((r&&r.error)||'ক্রম পরিবর্তন ব্যর্থ, রিলোড হচ্ছে...'); await loadAll(); renderProd(); }
  else toast('✅ ক্রম পরিবর্তন হয়েছে');
}

function buildStockPage() {
  var totalSell=0, totalCost=0, totalPcs=0;
  var isOwner = S.role==='owner';
  var isSO    = S.role==='so';
  var h='<div class="card" style="padding:0;overflow:hidden">';
  S.products.forEach(function(p){
    var stk=S.stockMap[p.id]||0, cs=num(p.caseSize)||1;
    var cases=Math.floor(stk/cs), rem=stk%cs;
    var sv=stk*num(p.sellingPrice), cv=stk*num(p.purchasePrice);
    totalSell+=sv; totalCost+=cv; totalPcs+=stk;
    var sc=stk>10?'var(--gr)':stk>0?'var(--am)':'var(--re)';
    var alert=num(p.lowStockAlert)>0&&stk<=num(p.lowStockAlert);
    var ti=thumbImg(p,'8px');
    h+='<div class="sku-row"><div class="sku-i">'+(ti||'📦')+'</div>';
    h+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12px">'+esc(p.name)+(alert?'<span class="low-alert">কম!</span>':'')+'</div>';
    h+='<div style="font-size:10px;color:var(--mt2)">'+esc(p.sku)+'</div>';
    // Case + Pcs separate display
    h+='<div style="font-size:11px;font-weight:600;color:'+sc+';margin-top:2px">';
    if (stk>0) {
      if (cases>0) h+=cases+' '+(p.unitType||'কেস')+' ';
      if (rem>0) h+=rem+' পিস';
      if (!cases&&!rem) h=h; // handle edge
    } else { h+='স্টক নেই'; }
    h+='</div>';
    h+='<div style="font-size:10px;color:var(--mt);margin-top:1px">মোট: '+fn(stk)+' পিস</div>';
    h+='</div>';
    h+='<div style="text-align:right">';
    h+='<div style="font-size:12px;font-weight:700;color:var(--gr)">৳'+fm(sv)+'</div>';
    if (isOwner) h+='<div style="font-size:10px;color:var(--mt)">ক্রয়: ৳'+fm(cv)+'</div>';
    h+='</div></div>';
  });
  // Total footer
  h+='<div style="padding:10px 12px;background:var(--grl);border-top:2px solid var(--gr)">';
  h+='<div style="display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin-bottom:3px"><span>মোট স্টক (পিস)</span><span style="color:var(--bl)">'+fn(totalPcs)+' পিস</span></div>';
  h+='<div style="display:flex;justify-content:space-between;font-weight:700;font-size:12px"><span>মোট মূল্য (বিক্রয়)</span><span style="color:var(--gr)">৳'+fm(totalSell)+'</span></div>';
  if (isOwner || isSO) {
    h+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mt);margin-top:2px"><span>মোট মূল্য (ক্রয়)</span><span>৳'+fm(totalCost)+'</span></div>';
  }
  if (isOwner) {

async function saveProd() {
  var nm=v('pf-nm').trim(), sku=v('pf-sku').trim();
  if (!nm||!sku) return toast('নাম ও SKU আবশ্যক');
  var existP = S.editProdId ? S.products.find(function(p){return p.id===S.editProdId;}) : null;
  // AXIION §7 — send the bulk case prices the owner typed; products.js
  // derives and stores the per-piece prices server-side (full precision).
  var d={name:nm, sku:sku, caseSize:vn('pf-cs')||12, casePurchasePrice:vn('pf-bcp'),
    casePrice:vn('pf-cp'), bonusFreeUnits:vn('pf-bfu'), bonusCasesReq:vn('pf-bcr')||1,
    bonusFreeMoney:vn('pf-bfm'), lowStockAlert:vn('pf-lsa'), unitType:v('pf-unit')||'কেস',
    category:(v('pf-cat')||'').trim()};
  if (S.editProdId) d.id = S.editProdId;
  d.thumb = IMG.prod.thumb || (existP ? existP.thumb||'' : '');
  showOvl('সংরক্ষণ হচ্ছে...');
  var r = S.editProdId ? await apiPut('/api/products', d) : await apiPost('/api/products', d);
  hideOvl();
  if (r.ok) {
    toast(S.editProdId?'আপডেট হয়েছে':'পণ্য যোগ হয়েছে');
    IMG.prod={full:'',name:'',thumb:'',previewUrl:''};
    cxProd(); loadAll();
  } else toast(r.error||'ব্যর্থ');
}
function editProd(id){S.editProdId=id;IMG.prod={full:'',name:'',thumb:'',previewUrl:''};S.prodTab='add';renderProd();}
function cxProd(){S.editProdId=null;IMG.prod={full:'',name:'',thumb:'',previewUrl:''};S.prodTab='list';renderProd();}
function updProdFormUnit(){
  var u=v('pf-unit')||'কেস';
  var lbl=document.getElementById('pf-bcr-lbl');if(lbl)lbl.textContent='প্রতি কত '+u;
  var csLbl=document.getElementById('pf-cs-lbl');if(csLbl)csLbl.textContent=u+'এ পিস';
  var bcpLbl=document.getElementById('pf-bcp-lbl');if(bcpLbl)bcpLbl.textContent='ক্রয় মূল্য / '+u+' (৳)';
  var cpLbl=document.getElementById('pf-cp-lbl');if(cpLbl)cpLbl.textContent='বিক্রয় মূল্য / '+u+' (৳)';
}
// AXIION §7 — reverse price entry: recompute the read-only per-piece
// price labels live, every time the case price or case size changes.
function updProdFormPrices(){
  var cs = num(v('pf-cs')) || 1;
  var bcp = num(v('pf-bcp'));
  var cp  = num(v('pf-cp'));
  var bpEl = document.getElementById('pf-bp-calc'); if (bpEl) bpEl.textContent = '৳'+(bcp/cs).toFixed(4);
  var spEl = document.getElementById('pf-sp-calc'); if (spEl) spEl.textContent = '৳'+(cp/cs).toFixed(4);
}
async function delProd(id){
  if (!confirm('এই পণ্য মুছবেন?')) return; showOvl('...');
  var r=await apiDel('/api/products',{id:id}); hideOvl();
  if(r.ok){toast('মুছা হয়েছে');loadAll();}else toast(r.error);
}

  var box=document.getElementById('pay-reconcile-box'); if(!box) return;

  if (!r||!r.ok) { box.innerHTML=''; return; }
  var t=r.today||{};
  var givenTodayV=t.givenToday||t.givenTodayRev||0, returnedTodayV=t.returnedToday||t.returnTodayRev||0;
  var commV=t.commissionToday||0, discV=t.discountToday||0, dmgV=t.damageToday||0;

    +'<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0"><span>ফেরত এসেছে</span><span style="font-weight:700">৳'+fm(returnedTodayV)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0"><span>এখনো ভ্যানে/অবিক্রিত</span><span style="font-weight:700">৳'+fm(t.stillWithDsrToday||0)+'</span></div>'

    +'<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0"><span>🏷️ আজকের মোট ছাড়</span><span style="font-weight:700">৳'+fm(discV)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0"><span>⚠️ আজকের মোট ড্যামেজ</span><span style="font-weight:700">৳'+fm(dmgV)+'</span></div>'

async function _loadAndRenderRoads() {
  var r = await apiGet('/api/srs?action=roads');
  S.roads = (r && r.ok) ? (r.roads || []) : [];
  S.roadsLoaded = true;
  // V56 §4 — weekly recurring visit rules for every road, loaded once
  // alongside the road list so each road's card can show its current
  // weekday pattern without an extra round-trip per road.
  var wr = await apiGet('/api/srs?action=road-weekly-list');
  S.roadWeeklyPlans = (wr && wr.ok) ? (wr.plans || []) : [];
  if (!S.srs || !S.srs.length) {
    var allR = await apiGet('/api/dashboard?action=load-all');
    if (allR && allR.ok) { S.products = allR.products||[]; S.srs = allR.srs||[]; S.stockMap = allR.stockMap||{}; }
  }
  _renderRoadsTab();
}
// Sunday-first, matching weekdayOf()'s 0=Sunday convention used server-side.
var WEEKDAY_LABELS_BN = ['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
function _renderRoadsTab() {
  var el = document.getElementById('pg-sr'); if (!el) return;
  var tabs = document.querySelector('#pg-sr .seg');
  var h = '<div class="card" style="margin-top:10px">';
  h += '<div class="fg"><label class="fl">নতুন রোডের নাম</label><input id="road-new-name" placeholder="যেমন: শাহজাদপুর রোড"></div>';
  h += '<button class="btn btn-bl btn-w" onclick="createRoad()">➕ রোড তৈরি করুন</button>';
  h += '</div>';

  h += '<div class="ct" style="margin-top:12px">🛣️ সব রোড ('+S.roads.length+'টি)</div>';
  if (!S.roads.length) {
    h += '<div class="card" style="text-align:center;padding:20px;color:var(--mt2)">এখনো কোনো রোড তৈরি হয়নি</div>';
  } else {
    var soOptions = (S.srs||[]).filter(function(s){return s.role==='so';});
    S.roads.forEach(function(road){
      h += '<div class="card" style="margin-bottom:10px">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start">';
      h += '<div style="font-weight:700;font-size:14px">🛣️ '+esc(road.name)+'</div>';
      h += '<div style="display:flex;gap:5px">'
        +'<button class="btn btn-gh btn-sm" onclick="renameRoadPrompt(\''+road.id+'\',\''+esc(road.name).replace(/'/g,"\\'")+'\')">✏️</button>'
        +'<button class="btn btn-sm" style="background:var(--rel);color:var(--re)" onclick="deleteRoad(\''+road.id+'\')">🗑️</button>'
        +'</div></div>';
      h += '<div style="font-size:12px;color:var(--mt);margin-top:4px">📊 SO: '+(road.soName?esc(road.soName):'<span style="color:var(--re)">নিয়োগ দেওয়া হয়নি</span>')+'</div>';
      h += '<div style="font-size:12px;color:var(--mt)">🚚 DSR (স্বয়ংক্রিয়): '+(road.dsrName?esc(road.dsrName):'—')+'</div>';
      h += '<div class="fg" style="margin-top:8px"><label class="fl">SO নিয়োগ / পরিবর্তন করুন</label><select id="road-so-'+road.id+'">';
      h += '<option value="">নির্বাচন করুন</option>';
      soOptions.forEach(function(so){
        h += '<option value="'+so.id+'"'+(road.soId===so.id?' selected':'')+'>'+(so.displayNo?('SO-'+so.displayNo+' — '):'')+esc(so.name)+'</option>';
      });
      h += '</select></div>';
      h += '<button class="btn btn-am btn-w btn-sm" onclick="assignRoadSo(\''+road.id+'\')">✅ SO নিয়োগ নিশ্চিত করুন</button>';
      if (road.soId) {
        // V56 §4 — weekly recurring pattern: tick which weekday(s) this
        // SO visits this road; the DSR's delivery day is still "the day
        // after" automatically, and the pattern repeats every week
        // without ever needing to touch it again.
        var activeDays = {};
        (S.roadWeeklyPlans||[]).filter(function(p){return p.roadId===road.id;}).forEach(function(p){ activeDays[p.weekday] = true; });
        h += '<div class="fg" style="margin-top:10px"><label class="fl">সাপ্তাহিক ভিজিট-ডে প্যাটার্ন — SO প্রতি সপ্তাহে কবে কবে ভিজিট করবে</label>';
        h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">';
        WEEKDAY_LABELS_BN.forEach(function(lbl, wd){
          var on = !!activeDays[wd];
          h += '<button class="btn btn-sm '+(on?'btn-bl':'btn-gh')+'" style="min-width:52px" onclick="toggleRoadWeekday(\''+road.id+'\','+wd+','+(!on)+')">'+lbl+'</button>';
        });
        h += '</div>';
        h += '<div style="font-size:10px;color:var(--mt2);margin-top:4px">একবার সেট করলে এটি প্রতি সপ্তাহে নিজে থেকেই চলতে থাকবে — প্রতি মাসে আবার সেট করার দরকার নেই। কোনো দিন পরিবর্তন করতে চাইলে পুরনোটা বন্ধ করে নতুনটা চালু করুন।</div>';
        h += '</div>';
      }
      h += '</div>';
    });
  }
  el.innerHTML = (tabs ? tabs.outerHTML : '') + h;
}

function stepBar(step) {
  var labs=['DSR/SO বাছাই','পণ্য বাছাই','পরিমাণ'], h='<div class="step-ind">';
  labs.forEach(function(l,i){
    h+='<div class="sdi '+(i<step?'sdi-a':'sdi-i')+'">'+(i+1)+'</div>';
    if(i<labs.length-1)h+='<div class="sdl '+(i<step-1?'done':'')+'" ></div>';
  });
  return h+'</div>';
}
function genUID(prefix) {
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', u=prefix+'-';
  for(var i=0;i<4;i++) u+=c[Math.floor(Math.random()*c.length)];
  u+='-';
  for(var j=0;j<4;j++) u+=c[Math.floor(Math.random()*c.length)];
  return u;
}
function barcodeDiv(uid) {
  var bars='', code=uid.replace(/-/g,'');
  for(var i=0;i<code.length;i++){
    var ch=code.charCodeAt(i),w=((ch%3)+1)*3,dark=(ch%2===0);
    bars+='<div style="display:inline-block;width:'+w+'px;height:32px;background:'+(dark?'#111':'transparent')+'"></div>';
    bars+='<div style="display:inline-block;width:2px;height:32px;background:transparent"></div>';
  }
  return '<div style="text-align:center;margin:6px 0">'
    +'<div style="display:inline-block;border:1.5px solid #444;padding:4px 10px 2px;border-radius:3px;background:#fff">'
    +'<div style="display:flex;justify-content:center;align-items:flex-end">'+bars+'</div>'
    +'<div style="font-family:monospace;font-size:9px;letter-spacing:3px;font-weight:700;color:#222;margin-top:2px">'+uid+'</div>'
    +'</div></div>';
}

function updGiveSub(i) {
  var item=S.giveItems[i];

  var cs=num(p.caseSize)||1, ca=num(item.cases)||0, pc=num(item.pcs)||0, u=ca*cs+pc;
  var amt=u*num(p.sellingPrice);
  var el=document.getElementById('give-sub-'+i);
  if(el)el.textContent=u>0?( ca?ca+(p.unitType||'কেস')+'×'+cs+'='+u+'পিস':u+'পিস')+' · ৳'+fm(amt):'—';
  // Update grand
  var grand=0,grandU=0;
  S.giveItems.forEach(function(it){
    var pr=S.products.find(function(r){return r.id===it.productId;}); if(!pr)return;
    var c2=num(pr.caseSize)||1, ca2=num(it.cases)||0, pc2=num(it.pcs)||0, u2=ca2*c2+pc2;
    grand+=u2*num(pr.sellingPrice); grandU+=u2;
  });
  var gEl=document.getElementById('give-grand');
  if(gEl)gEl.innerHTML='<span>মোট: '+grandU+' পিস</span><span>৳'+fm(grand)+'</span>';
}

async function saveGive(){
  var valid=S.giveItems.filter(function(i){return i.productId&&(num(i.cases)+num(i.pcs))>0;});
  if(!valid.length)return toast('কমপক্ষে একটি পরিমাণ দিন');
  var items=valid.map(function(i){var p=S.products.find(function(pr){return pr.id===i.productId;});var cs=num(p.caseSize)||1,ca=num(i.cases)||0,pc=num(i.pcs)||0,u=ca*cs+pc;return{productId:p.id,productName:p.name,sku:p.sku,cases:ca,pcs:pc,totalUnits:u,purchasePrice:num(p.purchasePrice),sellingPrice:num(p.sellingPrice),unitType:p.unitType||'কেস',thumb:p.thumb||''};});

  // AXIION: giving stock to a DSR now flows through the same van-load
  // checklist as an approved SO order — it's created as a Load Task, not
  // written to stock immediately. The DSR must physically tick every
  // item and press "Finish Loading" before the real transaction (and
  // the stock deduction) happens. Giving to an SO (no van to load)
  // keeps the original immediate/approval-queue behaviour below.
  var recipient = (S.srs||[]).find(function(s){return s.id===S.giveSRId;});
  var isDsr = recipient && recipient.role === 'dsr';

  if (isDsr && S.role === 'owner') {
    showOvl('ভ্যান-লোড তালিকায় পাঠানো হচ্ছে...');
    var rD = await apiPost('/api/sr-payments', { action:'give_direct', dsrId:S.giveSRId, items:items, requestedBy:'owner', requestedByName:S.userName });
    hideOvl();
    if (!rD||!rD.ok) return toast(rD&&rD.error||'ব্যর্থ');
    toast('✅ '+S.giveSRName+' এর ভ্যান-লোড তালিকায় পাঠানো হয়েছে — টিক দিয়ে লোড শেষ করলে স্টক বিয়োগ হবে');
    S.giveStep=1;S.giveSRId='';S.giveSRName='';S.giveArea='';S.giveSelProd={};S.giveItems=[];
    renderTx();
    return;
  }

  var slipNo=genUID('ME-GV');
  var txPayload={type:'give',srId:S.giveSRId,srName:S.giveSRName,date:S.giveDate,slipNo:slipNo,items:items};
  showOvl('সংরক্ষণ হচ্ছে...');
  var r=await mgrPost('transaction','/api/transactions',txPayload);
  hideOvl();
  if(!r.ok)return toast(r.error||'ব্যর্থ');
  if(r._mgr){
    toast(isDsr?'⏳ অনুমোদনের জন্য জমা হয়েছে — মালিকের অনুমোদনের পর ভ্যান-লোড তালিকায় যাবে':'⏳ অনুমোদনের জন্য জমা হয়েছে!');
    var slip={slipNo:slipNo,date:S.giveDate,srName:S.giveSRName,srArea:S.giveArea,items:items,pendingApproval:true};S.lastSlip=slip;openSlipWin(slip);S.giveStep=1;S.giveSRId='';S.giveSRName='';S.giveArea='';S.giveSelProd={};S.giveItems=[];renderTx();return;}
  var slip={slipNo:slipNo,date:S.giveDate,srName:S.giveSRName,srArea:S.giveArea,items:items};
  S.lastSlip=slip; _dashCache=null;
  toast('✅ স্টক রেকর্ড হয়েছে!');
  openSlipWin(slip);
  items.forEach(function(i){S.stockMap[i.productId]=(S.stockMap[i.productId]||0)-i.totalUnits;});
  S.giveStep=1;S.giveSRId='';S.giveSRName='';S.giveArea='';S.giveSelProd={};S.giveItems=[];
  renderTx();
}

      +'<div><label class="fl">পিস</label><input type="number" inputmode="decimal" min="0" placeholder="০" value="'+(item.pcs||'')+'" id="dmg-p-'+i+'" oninput="S.dmgItems['+i+'].pcs=this.value;updDmgSub('+i+')"></div>'

function dmgNext1(){S.dmgSRId=v('dmg-sr');S.dmgDate=v('dmg-dt')||iso(new Date());if(!S.dmgSRId)return toast('DSR/SO বাছাই করুন');var sr=S.srs.find(function(s){return s.id===S.dmgSRId;});S.dmgSRName=sr?sr.name:'';S.dmgArea=sr?sr.area||'':'';S.dmgStep=2;renderTx();}
function togDmgProd(id){S.dmgSelProd[id]=!S.dmgSelProd[id];renderTx();}
function dmgSelAll(){var el=document.getElementById('dmg-chk-all');if(!el)return;S.products.forEach(function(p){S.dmgSelProd[p.id]=el.checked;});renderTx();}
function dmgNext2(){var sel=S.products.filter(function(p){return S.dmgSelProd[p.id];});if(!sel.length)return toast('কমপক্ষে একটি পণ্য বাছাই করুন');var ex={};S.dmgItems.forEach(function(i){ex[i.productId]={cases:i.cases,pcs:i.pcs};});S.dmgItems=sel.map(function(p){return{productId:p.id,cases:ex[p.id]?ex[p.id].cases:'',pcs:ex[p.id]?ex[p.id].pcs:''};});S.dmgStep=3;renderTx();setTimeout(function(){S.dmgItems.forEach(function(_,i){updDmgSub(i);});},0);}
function updDmgSub(i){
  var item=S.dmgItems[i],p=S.products.find(function(pr){return pr.id===item.productId;});if(!p)return;
  var cs=num(p.caseSize)||1,ca=num(item.cases)||0,pc=num(item.pcs)||0,u=ca*cs+pc;
  var amt=u*num(p.purchasePrice);
  var el=document.getElementById('dmg-sub-'+i);if(el)el.textContent=u>0?(ca?ca+(p.unitType||'কেস')+'×'+cs+'='+u+'পিস':u+'পিস')+' · ৳'+fm(amt):'—';
  var gU=0,gA=0;S.dmgItems.forEach(function(it){var pr=S.products.find(function(r){return r.id===it.productId;});if(!pr)return;var c2=num(pr.caseSize)||1,ca2=num(it.cases)||0,pc2=num(it.pcs)||0,u2=ca2*c2+pc2;gU+=u2;gA+=u2*num(pr.purchasePrice);});
  var gEl=document.getElementById('dmg-grand');if(gEl)gEl.innerHTML='<span>মোট: '+gU+' পিস</span><span>৳'+fm(gA)+'</span>';
}
async function saveDamage(){
  var valid=S.dmgItems.filter(function(i){return i.productId&&(num(i.cases)+num(i.pcs))>0;});
  if(!valid.length)return toast('কমপক্ষে একটি পরিমাণ দিন');
  var slipNo=genUID('ME-DM');
  // V35 — sellingPrice must be the product's REAL selling price (not the
  // purchase price). Damage Report claims use purchasePrice/totalCost
  // (buying price, for the manufacturer/supplier reimbursement claim);
  // the DSR Payment page separately uses this real sellingPrice/total
  // revenue to know how much of today's damage to exclude from the
  // DSR's collectible total. These two stay intentionally different.
  var items=valid.map(function(i){var p=S.products.find(function(pr){return pr.id===i.productId;});var cs=num(p.caseSize)||1,ca=num(i.cases)||0,pc=num(i.pcs)||0,u=ca*cs+pc;return{productId:p.id,productName:p.name,sku:p.sku,cases:ca,pcs:pc,totalUnits:u,purchasePrice:num(p.purchasePrice),sellingPrice:num(p.sellingPrice),unitType:p.unitType||'কেস',thumb:p.thumb||''};});
  var txPayload={type:'damage',srId:S.dmgSRId,srName:S.dmgSRName,date:S.dmgDate,slipNo:slipNo,items:items};
  showOvl('সংরক্ষণ হচ্ছে...');
  var r=await mgrPost('transaction','/api/transactions',txPayload);
  hideOvl();
  if(!r.ok)return toast(r.error||'ব্যর্থ');
  if(r._mgr){toast('⏳ অনুমোদনের জন্য জমা হয়েছে!');var slip={slipNo:slipNo,date:S.dmgDate,srName:S.dmgSRName,srArea:S.dmgArea,items:items,pendingApproval:true};S.lastDmgSlip=slip;openDamageSlip(slip);S.dmgStep=1;S.dmgSRId='';S.dmgSRName='';S.dmgArea='';S.dmgSelProd={};S.dmgItems=[];renderTx();return;}
  var slip={slipNo:slipNo,date:S.dmgDate,srName:S.dmgSRName,srArea:S.dmgArea,items:items};
  S.lastDmgSlip=slip;_dashCache=null;
  toast('✅ ড্যামেজ রেকর্ড হয়েছে!');
  openDamageSlip(slip);
  // V35 — damage no longer reduces stock (report/reimbursement only, the
  // physical stock stays unchanged), so the local stock map is NOT
  // decremented here anymore.
  S.dmgStep=1;S.dmgSRId='';S.dmgSRName='';S.dmgArea='';S.dmgSelProd={};S.dmgItems=[];
  renderTx();
}

    +'<div id="'+px+'-search-res" style="margin-top:5px"></div></div>';

var _psSearchTimer=null;
function psCustSearch(px, q) {
  clearTimeout(_psSearchTimer);
  var box=document.getElementById(px+'-search-res');
  if(!box)return;
  if(!q||q.trim().length<2){ box.innerHTML=''; return; }
  _psSearchTimer=setTimeout(async function(){
    var r=await apiGet('/api/shops?action=pos-customer-search&q='+encodeURIComponent(q.trim()));
    box=document.getElementById(px+'-search-res');
    if(!box)return;
    if(!r||!r.ok||!r.results||!r.results.length){
      box.innerHTML='<div style="font-size:11px;color:var(--mt2);padding:4px 2px">কোনো ফলাফল নেই</div>';
      return;
    }
    if(px==='ps') S._psSearchResults=r.results; else S._psDmgSearchResults=r.results;
    box.innerHTML=r.results.map(function(c,i){
      return '<div onclick="psPickCust(\''+px+'\','+i+')" style="padding:7px 9px;border:1px solid #E1BEE7;border-radius:7px;margin-bottom:5px;cursor:pointer;background:#FAF5FC">'
        +'<div style="font-weight:700;font-size:12px">'+esc(c.name)+(c.source==='shop'?' <span style="font-size:9px;color:var(--pu);font-weight:400">(নিবন্ধিত দোকান)</span>':' <span style="font-size:9px;color:var(--mt2);font-weight:400">(পূর্বের কাস্টমার)</span>')+'</div>'
        +(c.phone||c.address?'<div style="font-size:10.5px;color:var(--mt2)">'+(c.phone?'📞 '+esc(c.phone):'')+(c.phone&&c.address?' · ':'')+(c.address?esc(c.address):'')+'</div>':'')
        +'</div>';
    }).join('');
  },350);
}
function psPickCust(px, i) {
  var list = px==='ps' ? S._psSearchResults : S._psDmgSearchResults;

  if(px==='ps'){

  }
  toast('✅ কাস্টমার তথ্য বসানো হয়েছে');
  renderTx();
}

function _showSlipSharePanel(slipNo, slipBodyHtml) {
  // Overlay
  var ov=document.createElement('div');
  ov.id='slip-overlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9998;display:flex;align-items:center;justify-content:center';

  // Panel
  var panel=document.createElement('div');
  panel.style.cssText='background:#fff;border-radius:14px;width:92%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.3);font-family:\'Noto Sans\',\'Hind Siliguri\',sans-serif';

  panel.innerHTML=
    '<div style="padding:14px 16px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center">'
    +'<span style="font-size:15px;font-weight:700;color:#1a237e">📋 স্লিপ তৈরি হচ্ছে…</span>'
    +'<button onclick="document.getElementById(\'slip-overlay\').remove()" style="border:none;background:#eee;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px">✕</button>'
    +'</div>'
    +'<div id="slip-preview" style="padding:12px;background:#f5f5f5;text-align:center;min-height:120px">'
    +'<div style="padding:30px;color:#777">⏳ রেন্ডার হচ্ছে…</div>'
    +'</div>'
    +'<div id="slip-actions" style="padding:12px;display:none;flex-direction:column;gap:8px"></div>';

  ov.appendChild(panel);
  document.body.appendChild(ov);

  // Hidden iframe to render slip
  var iframe=document.createElement('iframe');
  iframe.style.cssText='position:fixed;left:-9999px;top:-9999px;width:440px;height:800px;border:none;visibility:hidden';
  document.body.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(slipBodyHtml);
  iframe.contentDocument.close();

  // Load html2canvas then capture
  function doCapture(){
    var sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload=function(){
      // Wait for fonts inside iframe
      setTimeout(function(){
        html2canvas(iframe.contentDocument.body,{
          scale:2,useCORS:true,allowTaint:true,
          backgroundColor:'#ffffff',logging:false,
          width:420,windowWidth:440
        }).then(function(canvas){
          iframe.remove();
          var jpgDataUrl=canvas.toDataURL('image/jpeg',0.93);
          var pdfHtml=slipBodyHtml; // for print path

          // Show preview image
          var prev=document.getElementById('slip-preview');
          if(!prev)return;
          var img=document.createElement('img');
          img.src=jpgDataUrl;
          img.style.cssText='width:100%;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.15)';
          prev.innerHTML='';
          prev.appendChild(img);

          // Update title
          panel.querySelector('span').textContent='✅ স্লিপ '+slipNo+' তৈরি হয়েছে';

          // Action buttons
          var acts=document.getElementById('slip-actions');
          if(!acts)return;
          acts.style.display='flex';

          function mkBtn(label,color,fn){
            var b=document.createElement('button');
            b.innerHTML=label;
            b.style.cssText='padding:13px;border:none;border-radius:10px;background:'+color+';color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:\'Noto Sans\',\'Hind Siliguri\',sans-serif;width:100%';
            b.onclick=fn; return b;
          }

          // JPG Download
          var base64Only=jpgDataUrl.split(',')[1];

          // JPG Download
          acts.appendChild(mkBtn('🖼️  JPG ডাউনলোড করুন','#1565C0',function(){
            if(window.AndroidBridge){
              window.AndroidBridge.saveJpg(base64Only,'slip_'+slipNo+'.jpg');
            } else {
              var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click();
            }
          }));

          // PDF / Print
          acts.appendChild(mkBtn('📄  PDF হিসেবে প্রিন্ট করুন','#333',function(){
            var w=window.open('','_blank','width=480,height=740');
            if(w){w.document.write(pdfHtml);w.document.close();setTimeout(function(){w.print();},800);}
          }));

          // WhatsApp
          acts.appendChild(mkBtn('📲  WhatsApp এ পাঠান','#25D366',function(){
            if(window.AndroidBridge){
              window.AndroidBridge.shareWhatsApp(base64Only,'slip_'+slipNo+'.jpg','com.whatsapp');
            } else if(navigator.share&&navigator.canShare){
              fetch(jpgDataUrl).then(function(r){return r.blob();}).then(function(blob){
                var file=new File([blob],'slip_'+slipNo+'.jpg',{type:'image/jpeg'});
                if(navigator.canShare({files:[file]})) navigator.share({files:[file],title:'স্লিপ '+slipNo});
                else { var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click(); }
              });
            } else {
              var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click();
              setTimeout(function(){window.open('https://web.whatsapp.com/','_blank');},1000);
            }
          }));

          // WA Business
          acts.appendChild(mkBtn('💼  WA Business এ পাঠান','#075E54',function(){
            if(window.AndroidBridge){
              window.AndroidBridge.shareWhatsApp(base64Only,'slip_'+slipNo+'.jpg','com.whatsapp.w4b');
            } else if(navigator.share&&navigator.canShare){
              fetch(jpgDataUrl).then(function(r){return r.blob();}).then(function(blob){
                var file=new File([blob],'slip_'+slipNo+'.jpg',{type:'image/jpeg'});
                if(navigator.canShare({files:[file]})) navigator.share({files:[file],title:'স্লিপ '+slipNo});
                else { var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click(); }
              });
            } else {
              var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click();
            }
          }));

          // Close
          acts.appendChild(mkBtn('✕  বন্ধ করুন','#9e9e9e',function(){
            document.getElementById('slip-overlay').remove();
          }));

        }).catch(function(e){
          iframe.remove();
          var prev=document.getElementById('slip-preview');
          if(prev) prev.innerHTML='<div style="padding:20px;color:red">ত্রুটি: '+e+'</div>';
        });
      }, 1200); // wait for Google Fonts inside iframe
    };
    sc.onerror=function(){
      iframe.remove();
      var prev=document.getElementById('slip-preview');
      if(prev) prev.innerHTML='<div style="padding:20px;color:red">html2canvas লোড হয়নি</div>';
    };
    document.head.appendChild(sc);
  }

  // Small delay so iframe renders before we grab it
  setTimeout(doCapture, 300);
}

      + '<div style="font-size:11px;color:#777;margin:6px 0 2px;line-height:1.5">⏰ প্রতিদিন রাত ২টায় (Asia/Dhaka) আগের দিনের রিপোর্ট এমনিতেই স্বয়ংক্রিয়ভাবে তৈরি হয়ে যায় — উপরের বাটন শুধু আলাদা করে বা আবার তৈরি করতে চাইলে ব্যবহার করুন। প্রতিটি SO-এর সবশেষ ৬০ দিনের রিপোর্ট এখানে জমা থাকে।</div>';
  } else {
    html += '<div style="font-size:12px;color:#777;margin:6px 0">সবশেষ ৬০ দিনের রিপোর্ট এখানে দেখতে ও প্রিন্ট/শেয়ার করতে পারবেন।</div>';
  }

  html += '<div id="so-rpt-list-area">' + renderSoRptListHtml() + '</div>';
  el.innerHTML = html;
}

function renderSoRptListHtml() {
  if (!S.soRptSoId) return '<div style="padding:16px;text-align:center;color:#999">উপরে একজন SO নির্বাচন করুন</div>';
  if (!S.soRptList.length) return '<div style="padding:16px;text-align:center;color:#999">এখনো কোনো রিপোর্ট তৈরি হয়নি</div>';
  return S.soRptList.map(function (r) {
    var t = r.soTotals || {};
    return '<div class="pay-row" style="cursor:pointer" onclick="soRptOpenView(\'' + r.soId + '\',\'' + r.reportDate + '\')">'
      + '<div style="flex:1"><b>📅 ' + fmtBn(r.reportDate) + '</b><br><small style="color:#777">লোড ' + fn(t.totalLoad || 0) + ' | বিক্রয় ' + fn(t.sold || 0) + ' | ৳' + fm(t.amount || 0) + '</small></div>'
      + '<div style="text-align:right"><small style="color:#c0392b;font-weight:700">বকেয়া ৳' + fm(r.dueGrandTotal || 0) + '</small><br><small style="color:#999">দেখুন ›</small></div>'
      + '</div>';
  }).join('');
}

function soRptOnSoChange(v) {
  S.soRptSoId = v;
  S.soRptList = [];
  renderSoRptArea();
  if (v) soRptLoadList();
}

async function soRptLoadList() {
  if (!S.soRptSoId) return;
  var r = await apiGet('/api/report?action=daily-list&soId=' + S.soRptSoId);
  if (r.ok) S.soRptList = r.list || [];
  var lst = document.getElementById('so-rpt-list-area');
  if (lst) lst.innerHTML = renderSoRptListHtml();
}

async function soRptGenerateNow() {
  if (!S.soRptSoId && !S.soRptAllSO) return toast('একজন SO নির্বাচন করুন অথবা "সব SO" বাছুন');
  var ok = await confirmOwnerPin('SO ডেইলি রিপোর্ট তৈরি করতে Owner PIN দিন');
  if (!ok) return;
  S.soRptBusy = true; renderSoRptArea();
  showOvl('রিপোর্ট তৈরি হচ্ছে…');
  var r = await apiPost('/api/report?action=daily-generate', {
    ownerPin: window._lastOwnerPin,
    soId: S.soRptAllSO ? 'all' : S.soRptSoId,
    date: S.soRptGenDate
  });
  hideOvl();
  S.soRptBusy = false;
  if (r.ok) {
    toast('✅ রিপোর্ট তৈরি হয়েছে (' + (r.results ? r.results.length : 0) + 'টি SO) — ' + fmtBn(r.reportDate));
    if (S.soRptSoId) await soRptLoadList(); else renderSoRptArea();
  } else {
    toast(r.error || 'ব্যর্থ হয়েছে');
    renderSoRptArea();
  }
}

async function soRptOpenView(soId, date) {
  showOvl('রিপোর্ট লোড হচ্ছে…');
  var r = await apiGet('/api/report?action=daily-get&soId=' + soId + '&date=' + date);
  hideOvl();
  if (!r.ok) return toast(r.error || 'পাওয়া যায়নি');
  var docHtml = buildDailyReportDocHtml(r);
  _showDailyReportSharePanel(esc(r.soName).replace(/\s+/g, '_') + '_' + r.reportDate, docHtml);
}

// ── Builds ONE printable document: SO delivery challan (per route)
//    followed by the Due Report (page-break before, for print) ──────
var LOAD_LABELS_BN = ['১ম লোডিং', '২য় লোডিং', '৩য় লোডিং', '৪র্থ লোডিং', '৫ম লোডিং', '৬ষ্ঠ লোডিং'];

function buildDailyReportDocHtml(row) {
  var rd = row.reportData || {}, dd = row.dueData || {};
  var routes = rd.routes || [];
  var now = new Date();
  var nowStr = String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + now.getFullYear() + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  // Update #39: the document must show WHEN it was generated, not just
  // by whom — prefer the server's actual generation timestamp
  // (row.generatedAt) over "now" (which is only when this copy is being
  // rendered/printed, possibly much later).
  function fmtGenTime(iso) {
    if (!iso) return nowStr;
    var d = new Date(iso); if (isNaN(d.getTime())) return nowStr;
    return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  var genStr = fmtGenTime(row.generatedAt);

  // V47 update #39: route header now also prints the Road (Update #21/
  // #22) this SO/DSR is assigned to, when the report was generated after
  // Roads was set up — older stored snapshots simply have no roadName
  // and this line is omitted, no backward-compat issue.
  function routeHdr(route) {
    return '<div class="rt-hdr"><span>🚐 <b>ডি এস আর / SO নাম:</b> ' + esc(route.routeName) + (route.routePhone ? ' <small>(☎ ' + esc(route.routePhone) + ')</small>' : '') + '</span>'
      + '<span><b>রুট/এলাকা:</b> ' + esc(route.routeArea || '—') + (route.routeRoadName ? ' &nbsp;|&nbsp; <b>রোড:</b> 🛣️ ' + esc(route.routeRoadName) : '') + '</span></div>';
  }

  function routeBlock(route) {
    var hasDamage = (route.products || []).some(function (p) { return p.damage > 0; });
    if (!route.products || !route.products.length) {
      return '<div class="route-block">' + routeHdr(route)
        + '<div class="rt-empty">এই দিনে কোনো লোডিং বা ফেরত হয়নি</div></div>';
    }
    var loadHeads = '';
    for (var i = 0; i < route.loadCount; i++) loadHeads += '<th>' + (LOAD_LABELS_BN[i] || ('লোডিং ' + (i + 1))) + '</th>';
    // Update #40: every quantity here is printed as "X কেস Y পিস" (using
    // this product's own case size) instead of a bare piece count — the
    // one exception is the mixed multi-SKU footer totals row below, where
    // summing different products' case sizes into one "case" figure
    // wouldn't be meaningful, so that row stays in plain piece totals.
    var rowsHtml = route.products.map(function (p) {
      var cs = p.caseSize || 1;
      var loadCells = '';
      for (var i = 0; i < route.loadCount; i++) loadCells += '<td>' + (p.loads[i] ? fmtCasePcs(p.loads[i], cs) : '—') + '</td>';
      return '<tr><td class="pname">' + esc(p.name) + (p.unitType ? '<br><small>' + esc(p.unitType) + '</small>' : '') + '</td>'
        + loadCells
        + '<td class="tot">' + fmtCasePcs(p.totalLoad, cs) + '</td>'
        + '<td class="c-ret">' + (p.returned ? fmtCasePcs(p.returned, cs) : '—') + '</td>'
        + (hasDamage ? '<td class="c-dmg">' + (p.damage ? fmtCasePcs(p.damage, cs) : '—') + '</td>' : '')
        + '<td class="c-sold">' + fmtCasePcs(p.sold, cs) + '</td>'
        + '<td>৳' + fm(p.casePrice) + '</td>'
        + '<td class="amt">৳' + fm(p.amount) + '</td></tr>';
    }).join('');
    var leadCols = 2 + route.loadCount; // পণ্যের নাম + loading columns
    var t = route.totals || {};
    return '<div class="route-block">' + routeHdr(route)
      + '<table class="chln"><thead><tr><th>পণ্যের নাম</th>' + loadHeads + '<th>মোট লোডিং</th><th class="c-ret">ফেরত</th>' + (hasDamage ? '<th class="c-dmg">নষ্ট</th>' : '') + '<th class="c-sold">বিক্রয়</th><th>কেস দর</th><th>টাকা</th></tr></thead>'
      + '<tbody>' + rowsHtml + '</tbody>'
      + '<tfoot><tr><td colspan="' + leadCols + '" style="text-align:right">রুট মোট →</td><td class="c-ret">' + fn(t.returned) + ' পিস</td>' + (hasDamage ? '<td class="c-dmg">' + fn(t.damage) + ' পিস</td>' : '') + '<td class="c-sold">' + fn(t.sold) + ' পিস</td><td></td><td>৳' + fm(t.amount) + '</td></tr></tfoot>'
      + '</table></div>';
  }

  var soT = rd.soTotals || {};
  var routesHtml = routes.map(routeBlock).join('');

  var shopRows = (dd.shops || []).map(function (s) {
    return '<tr><td>' + esc(s.shopName) + (s.shopNo ? '<br><small>নং: ' + esc(s.shopNo) + '</small>' : '') + '</td>'
      + '<td>' + esc(s.shopPhone || '—') + '</td>'
      + '<td>৳' + fm(s.todayDue) + '</td>'
      + '<td>৳' + fm(s.prevDue) + '</td>'
      + '<td style="font-weight:800">৳' + fm(s.totalDue) + '</td></tr>';
  }).join('') || '<tr><td colspan="5" style="text-align:center;color:#777;padding:16px">🎉 কোনো বকেয়া নেই</td></tr>';

  return '<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8">'
    + '<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;900&family=Noto+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">'
    + '<style>'

    + 'body{font-family:\'Noto Sans\',\'Hind Siliguri\',sans-serif;background:#fff;color:#000;padding:16px;width:800px}'

    + '.hdr-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}'
    + '.logo-circle{width:44px;height:44px;border:2px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0}'
    + '.co-name{font-size:26px;font-weight:900;line-height:1;font-family:\'Noto Sans\',\'Hind Siliguri\',sans-serif}'
    + '.hdr-dist{font-size:10.5px;font-weight:600;color:#000;margin-top:2px}'
    + '.hdr-addr{font-size:9.5px;color:#333;margin-top:1px;line-height:1.5}'
    + '.hdr-bot{display:flex;justify-content:space-between;align-items:center;margin-top:5px;border-top:1px solid #000;padding-top:4px}'
    + '.hdr-dist-box{background:#000;color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:2px}'
    + '.hdr-mobile{font-size:9.5px;font-weight:700}'
    + '.slip-t{text-align:center;font-size:13px;font-weight:700;letter-spacing:2px;border:1.5px dashed #555;padding:6px 0;margin:10px 0 8px}'
    + '.meta{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px}.meta td{padding:4px 7px;border:1px solid #999}'
    + '.mk{background:#e8e8e8;font-weight:700;width:120px;font-size:10px}.mv{font-weight:600}'
    + '.stat-row{display:flex;gap:8px;margin-bottom:10px}'
    + '.stat-box{flex:1;border:1.5px solid #333;border-radius:6px;text-align:center;padding:8px 4px;background:#f7f7f7}'
    + '.stat-box.tot{background:#111;color:#fff;border-color:#111}'

    + '.stat-box .sl{font-size:9.5px;color:#666;margin-top:2px}'
    + '.stat-box.tot .sl{color:#ccc}'
    + '.route-block{margin-bottom:16px}'
    + '.rt-hdr{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;background:linear-gradient(135deg,#eef1ff,#e3f2fd);border:1px solid #b9c4f0;border-left:4px solid #3949AB;border-radius:6px;padding:7px 10px;font-size:11px;margin-bottom:5px}'

    + 'table.chln tbody tr:nth-child(even){background:#fafbff}'
    // Update #39: sale/return/damage each get their own colour so they're

// ── Share/Print panel for the (wider, multi-page) daily report doc ──
// Mirrors _showSlipSharePanel's html2canvas → preview → JPG/PDF/WhatsApp
// pattern, sized for an 800px-wide, two-page financial document instead
// of the small 420px delivery slip.
function _showDailyReportSharePanel(docNo, docHtml) {
  var ov = document.createElement('div');
  ov.id = 'so-rpt-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9998;display:flex;align-items:center;justify-content:center';

  var panel = document.createElement('div');
  panel.style.cssText = 'background:#fff;border-radius:14px;width:95%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.3);font-family:\'Noto Sans\',\'Hind Siliguri\',sans-serif';

  panel.innerHTML =
    '<div style="padding:14px 16px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center">'
    + '<span style="font-size:15px;font-weight:700;color:#1a237e">📊 রিপোর্ট তৈরি হচ্ছে…</span>'
    + '<button onclick="document.getElementById(\'so-rpt-overlay\').remove()" style="border:none;background:#eee;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px">✕</button>'
    + '</div>'
    + '<div id="so-rpt-preview" style="padding:12px;background:#f5f5f5;text-align:center;min-height:120px">'
    + '<div style="padding:30px;color:#777">⏳ রেন্ডার হচ্ছে…</div>'
    + '</div>'
    + '<div id="so-rpt-actions" style="padding:12px;display:none;flex-direction:column;gap:8px"></div>';

  ov.appendChild(panel);
  document.body.appendChild(ov);

  var iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:820px;height:1400px;border:none;visibility:hidden';
  document.body.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(docHtml);
  iframe.contentDocument.close();

  function doCapture() {
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload = function () {
      setTimeout(function () {
        html2canvas(iframe.contentDocument.body, {
          scale: 2, useCORS: true, allowTaint: true,
          backgroundColor: '#ffffff', logging: false,
          width: 800, windowWidth: 820
        }).then(function (canvas) {
          iframe.remove();
          var jpgDataUrl = canvas.toDataURL('image/jpeg', 0.93);
          var pdfHtml = docHtml;

          var prev = document.getElementById('so-rpt-preview');
          if (!prev) return;
          var img = document.createElement('img');
          img.src = jpgDataUrl;
          img.style.cssText = 'width:100%;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.15)';
          prev.innerHTML = '';
          prev.appendChild(img);

          panel.querySelector('span').textContent = '✅ রিপোর্ট তৈরি হয়েছে';

          var acts = document.getElementById('so-rpt-actions');
          if (!acts) return;
          acts.style.display = 'flex';

          function mkBtn(label, color, fn) {
            var b = document.createElement('button');
            b.innerHTML = label;
            b.style.cssText = 'padding:13px;border:none;border-radius:10px;background:' + color + ';color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:\'Noto Sans\',\'Hind Siliguri\',sans-serif;width:100%';
            b.onclick = fn; return b;
          }

          var base64Only = jpgDataUrl.split(',')[1];

          acts.appendChild(mkBtn('🖼️  JPG ডাউনলোড করুন', '#1565C0', function () {
            if (window.AndroidBridge) {
              window.AndroidBridge.saveJpg(base64Only, 'report_' + docNo + '.jpg');
            } else {
              var a = document.createElement('a'); a.href = jpgDataUrl; a.download = 'report_' + docNo + '.jpg'; a.click();
            }
          }));

          acts.appendChild(mkBtn('📄  PDF হিসেবে প্রিন্ট করুন (২ পৃষ্ঠা)', '#333', function () {
            var w = window.open('', '_blank', 'width=880,height=900');
            if (w) { w.document.write(pdfHtml); w.document.close(); setTimeout(function () { w.print(); }, 900); }
          }));

          acts.appendChild(mkBtn('📲  WhatsApp এ পাঠান', '#25D366', function () {
            if (window.AndroidBridge) {
              window.AndroidBridge.shareWhatsApp(base64Only, 'report_' + docNo + '.jpg', 'com.whatsapp');
            } else if (navigator.share && navigator.canShare) {
              fetch(jpgDataUrl).then(function (r) { return r.blob(); }).then(function (blob) {
                var file = new File([blob], 'report_' + docNo + '.jpg', { type: 'image/jpeg' });
                if (navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: 'রিপোর্ট ' + docNo });
                else { var a = document.createElement('a'); a.href = jpgDataUrl; a.download = 'report_' + docNo + '.jpg'; a.click(); }
              });
            } else {
              var a = document.createElement('a'); a.href = jpgDataUrl; a.download = 'report_' + docNo + '.jpg'; a.click();
              setTimeout(function () { window.open('https://web.whatsapp.com/', '_blank'); }, 1000);
            }
          }));

          acts.appendChild(mkBtn('✕  বন্ধ করুন', '#9e9e9e', function () {
            document.getElementById('so-rpt-overlay').remove();
          }));

        }).catch(function (e) {
          iframe.remove();
          var prev = document.getElementById('so-rpt-preview');
          if (prev) prev.innerHTML = '<div style="padding:20px;color:red">ত্রুটি: ' + e + '</div>';
        });
      }, 1200);
    };
    sc.onerror = function () {
      iframe.remove();
      var prev = document.getElementById('so-rpt-preview');
      if (prev) prev.innerHTML = '<div style="padding:20px;color:red">html2canvas লোড হয়নি</div>';
    };
    document.head.appendChild(sc);
  }

  setTimeout(doCapture, 300);
}

async function loadReport() {
  var from,to;
  if(S.rptMode==='daily'){from=S.rptDate;to=S.rptDate;}
  if(S.rptMode==='monthly'){var _cb=_cycleBounds(S.rptMonth);from=_cb.start;to=_cb.end;}
  if(S.rptMode==='custom'){from=S.rptFrom;to=S.rptTo;}
  if(!from||!to)return toast('তারিখ নির্বাচন করুন');
  if(from>to)return toast('শুরুর তারিখ আগে হতে হবে');
  showOvl('রিপোর্ট তৈরি হচ্ছে...');
  var r=await apiGet('/api/report?from='+from+'&to='+to);
  hideOvl();
  if(r.ok)renderRepResult(r); else toast(r.error||'ব্যর্থ');
}

// Client-side CSV export — opens straight in Excel/Sheets. A UTF-8 BOM
// is prefixed so Bengali product names/SKUs render correctly in Excel
// instead of turning into mojibake.
function _downloadMonthlyDmgCsv() {
  var r = S._lastMonthlyDmg; if (!r || !r.byProduct || !r.byProduct.length) return toast('ডাউনলোড করার মতো কোনো ডেটা নেই');
  var rows = [['SKU', 'পণ্যের নাম', 'কেস', 'পিস', 'মোট পরিমাণ', 'ক্রয় মূল্য (প্রতি পিস)', 'মোট ক্ষতি']];
  r.byProduct.forEach(function (p) {
    rows.push([p.sku || '', p.name || '', p.cases, p.pieces, p.totalQuantity, p.buyingPrice, p.cost]);
  });
  rows.push(['', 'সর্বমোট', '', '', r.totalUnits, '', r.totalCost]);
  var csv = rows.map(function (row) {
    return row.map(function (cell) {
      var s = String(cell == null ? '' : cell);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\r\n');
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'monthly_damage_' + (S.rptDmgMonth || 'report') + '.csv';
  a.click();
}

function v(id){var e=document.getElementById(id);return e?e.value:'';}
function vn(id){return Number(v(id))||0;}
function sv(id,val){var e=document.getElementById(id);if(e)e.value=val;}
function num(x){return Number(x)||0;}
function fn(n){return Math.round(Number(n)||0);}
// Update #34 (applying Update #15's rule locally to the DSR sell screen):
// convert a raw piece count into "X কেস Y পিস" using the product's own
// case size — never show a bare piece count on this screen.
function fmtCasePcs(units, caseSize) {
  var u = Math.max(0, fn(units)), cs = Math.max(1, fn(caseSize) || 1);
  var ca = Math.floor(u / cs), pc = u % cs;
  if (ca > 0 && pc > 0) return ca + ' কেস ' + pc + ' পিস';
  if (ca > 0) return ca + ' কেস';
  return pc + ' পিস';
}
function fm(n){var v=Number(n)||0;return v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function iso(d){if(d instanceof Date){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}return String(d).slice(0,10);}
function fmtBn(d){if(!d)return'';try{var p=String(d).slice(0,10).split('-');if(p.length!==3)return String(d).slice(0,10);return p[2]+'/'+p[1]+'/'+p[0];}catch(e){return String(d).slice(0,10);}}
function prodUnit(pid){var p=(S.products||[]).find(function(x){return x.id===pid;});return p?p.unitType||'কেস':'কেস';}
function txBdg(t){var m={give:'<span class="bdg b-bl">দেওয়া</span>',return:'<span class="bdg b-te">ফেরত</span>',damage:'<span class="bdg b-re">ড্যামেজ</span>',buy:'<span class="bdg b-gr">কেনা</span>',point_sale:'<span class="bdg b-pu">পয়েন্ট সেল</span>',point_damage_return:'<span class="bdg b-re">পয়েন্ট ফেরত</span>',dsr_sale:'<span class="bdg b-am">দোকানে বিক্রয়</span>'};return m[t]||'<span class="bdg b-gy">'+t+'</span>';}
var _ot;
function showOvl(m){document.getElementById('ovl-m').textContent=m||'লোড হচ্ছে...';document.getElementById('ovl').style.display='flex';clearTimeout(_ot);_ot=setTimeout(hideOvl,30000);}
function hideOvl(){document.getElementById('ovl').style.display='none';clearTimeout(_ot);}
var _tt;
function toast(m){var e=document.getElementById('tst');e.textContent=m;e.style.display='block';clearTimeout(_tt);var dur=Math.max(3200,Math.min(7000,(String(m).length)*70));_tt=setTimeout(function(){e.style.display='none';},dur);}

// ════════════════════════════════════════════════════
//  DUE CALENDAR
// ════════════════════════════════════════════════════
var CAL = { month:'', dues:[], selDate:'' };

function calMonthStr(offset) {
  var d = new Date(); d.setDate(1);
  d.setMonth(d.getMonth() + (offset||0));
  return d.toISOString().slice(0,7);
}

async function loadCal(monthStr) {
  if (!CAL.month) CAL.month = calMonthStr(0);
  if (monthStr) CAL.month = monthStr;
  showOvl('ক্যালেন্ডার লোড হচ্ছে...');
  var calUrl = '/api/due-calendar?month=' + CAL.month;
  if (S.role === 'dsr') calUrl += '&dsrId=' + encodeURIComponent(S.userId);
  var r = await apiGet(calUrl);
  hideOvl();
  if (!r.ok) return toast('লোড ব্যর্থ: ' + (r.error||''));
  CAL.dues = r.dues || [];
  renderCal();
}

function renderCal() {
  var el = document.getElementById('pg-cal');
  var canEdit = S.role === 'owner' || S.role === 'manager';
  var today = iso(new Date());
  var [yr, mo] = CAL.month.split('-').map(Number);
  var monthDate = new Date(yr, mo-1, 1);
  var monthName = monthDate.toLocaleDateString('bn-BD', {year:'numeric', month:'long'});
  var daysInMonth = new Date(yr, mo, 0).getDate();
  var firstDay = new Date(yr, mo-1, 1).getDay();

  var dueMap = {};
  CAL.dues.forEach(function(d) {
    if (!dueMap[d.dueDate]) dueMap[d.dueDate] = [];
    dueMap[d.dueDate].push(d);
  });

  var totalPending = CAL.dues.filter(function(d){return d.status==='pending';}).reduce(function(s,d){return s+num(d.amount)-num(d.paidAmount);},0);
  var totalPartial  = CAL.dues.filter(function(d){return d.status==='partial';}).reduce(function(s,d){return s+num(d.paidAmount);},0);
  var totalCleared  = CAL.dues.filter(function(d){return d.status==='cleared';}).reduce(function(s,d){return s+num(d.amount);},0);

  var maxDayAmt = 0;
  Object.keys(dueMap).forEach(function(date){
    var dayAmt = dueMap[date].reduce(function(s,d){return s+num(d.amount)-num(d.paidAmount);},0);
    if (dayAmt > maxDayAmt) maxDayAmt = dayAmt;
  });

  var h = '';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
  h += '<button class="btn btn-gh btn-sm" onclick="loadCal(prevCalMonth())">◀ আগের মাস</button>';
  h += '<div style="font-size:15px;font-weight:700;color:var(--bl)">📅 '+monthName+'</div>';
  h += '<button class="btn btn-gh btn-sm" onclick="loadCal(nextCalMonth())">পরের মাস ▶</button>';
  h += '</div>';

  h += '<div class="mets" style="grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:12px">';
  h += '<div class="met"><div class="ml">বকেয়া</div><div class="mv" style="color:var(--re);font-size:14px">৳'+fm(totalPending)+'</div></div>';
  h += '<div class="met"><div class="ml">আংশিক</div><div class="mv" style="color:#FF9800;font-size:14px">৳'+fm(totalPartial)+'</div></div>';
  h += '<div class="met"><div class="ml">পরিশোধিত</div><div class="mv" style="color:var(--gr);font-size:14px">৳'+fm(totalCleared)+'</div></div>';
  h += '<div class="met"><div class="ml">এন্ট্রি</div><div class="mv" style="font-size:14px">'+CAL.dues.length+'টি</div></div>';
  h += '</div>';

  h += '<div class="cal-legend">';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--rel);border:1.5px solid var(--re)"></div> বকেয়া</div>';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:#FFF3E0;border:1.5px solid #FF9800"></div> আংশিক</div>';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--grl);border:1.5px solid var(--gr)"></div> পরিশোধিত</div>';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:#FFF8E1;border:1.5px solid var(--am)"></div> মিশ্র</div>';
  h += '</div>';

  // ── Per-person monthly due summary ─────────────────────────
  var personMap = {};
  CAL.dues.forEach(function(d) {
    var key = d.dsrName || '—';
    if (!personMap[key]) personMap[key] = { name: key, clientType: d.clientType || 'dsr', total: 0, remaining: 0 };
    personMap[key].total     += num(d.amount);
    personMap[key].remaining += Math.max(0, num(d.amount) - num(d.paidAmount));
  });
  var personList = Object.values(personMap).filter(function(p){ return p.total > 0; });
  if (personList.length) {
    h += '<div class="ct">👤 ব্যক্তিভিত্তিক মাসিক বাকি সারাংশ</div>';
    h += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">';
    personList.forEach(function(p) {
      var badge = p.clientType === 'custom'
        ? '<span style="font-size:10px;background:#EDE7F6;color:#673AB7;border-radius:4px;padding:1px 5px;margin-left:4px">কাস্টম</span>'
        : '<span style="font-size:10px;background:#E3F2FD;color:var(--bl);border-radius:4px;padding:1px 5px;margin-left:4px">DSR</span>';
      var remColor = p.remaining > 0 ? 'var(--re)' : 'var(--gr)';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #EEF2FF">';
      h += '<div><span style="font-weight:700;font-size:13px">'+esc(p.name)+'</span>'+badge+'</div>';
      h += '<div style="text-align:right"><div style="font-size:13px;font-weight:700;color:'+remColor+'">৳'+fm(p.remaining)+'</div>';
      h += '<div style="font-size:10px;color:var(--mt2)">মোট: ৳'+fm(p.total)+'</div></div>';
      h += '</div>';
    });
    h += '</div>';
  }

  h += '<div class="card" style="padding:10px;margin-bottom:10px">';
  h += '<div class="cal-grid">';
  var dayLabels = ['রবি','সোম','মঙ্গ','বুধ','বৃহ','শুক্র','শনি'];
  dayLabels.forEach(function(d){ h += '<div class="cal-day-hdr">'+d+'</div>'; });

  for (var i=0; i<firstDay; i++) h += '<div class="cal-cell empty"></div>';

  for (var day=1; day<=daysInMonth; day++) {
    var mm = String(mo).padStart(2,'0'), dd = String(day).padStart(2,'0');
    var dateStr = yr+'-'+mm+'-'+dd;
    var dayDues  = dueMap[dateStr] || [];
    var hasDue   = dayDues.length > 0;
    var allPaid    = hasDue && dayDues.every(function(d){return d.status==='cleared';});
    var allPending = hasDue && dayDues.every(function(d){return d.status==='pending';});
    var hasPartial = hasDue && dayDues.some(function(d){return d.status==='partial';});
    var isTdy    = dateStr === today;
    var dayRemaining = dayDues.reduce(function(s,d){return s+num(d.amount)-num(d.paidAmount);},0);
    var heatRatio = maxDayAmt > 0 ? dayRemaining/maxDayAmt : 0;
    var isHeavy = heatRatio >= 0.6;

    var cls = 'cal-cell';
    if (isTdy) cls += ' today-cell';
    if (hasDue && allPaid) cls += ' has-due all-paid';
    else if (hasDue && hasPartial && !allPaid) cls += ' has-due partial';
    else if (hasDue && allPending) cls += ' has-due';
    else if (hasDue) cls += ' has-due mixed';
    if (hasDue && isHeavy && !allPaid) cls += ' due-heavy';

    var dotHtml = '';
    if (hasDue) {
      if (allPaid)         dotHtml = '<div class="cal-dot cal-dot-gr"></div>';
      else if (hasPartial) dotHtml = '<div class="cal-dot cal-dot-or"></div>';
      else if (allPending) dotHtml = '<div class="cal-dot cal-dot-re"></div>';
      else                 dotHtml = '<div class="cal-dot cal-dot-am"></div>';
    }

    h += '<div class="'+cls+'" onclick="calDayClick(\''+dateStr+'\')">';
    h += '<div class="cal-day-num" style="color:'+(isTdy?'var(--bl)':'var(--txt)')+'">'+(isTdy?'<strong>'+day+'</strong>':day)+'</div>';
    h += dotHtml;
    if (hasDue) {
      h += '<div style="font-size:7.5px;color:var(--mt);margin-top:1px">'+dayDues.length+'টি</div>';
      if (!allPaid && dayRemaining > 0) h += '<div class="cal-amt-badge">৳'+fm(dayRemaining)+'</div>';
    }
    h += '</div>';
  }
  h += '</div></div>';

  if (canEdit) {
    h += '<button class="btn btn-bl btn-w" onclick="calAddModal(\'\')">➕ নতুন বাকি যোগ করুন</button>';
    h += '<div style="height:10px"></div>';
  }

  if (CAL.dues.length) {
    h += '<div class="ct">📋 এই মাসের সব এন্ট্রি</div>';
    h += '<div class="card" style="padding:0;overflow:hidden">';
    CAL.dues.slice().sort(function(a,b){return a.dueDate.localeCompare(b.dueDate);}).forEach(function(d){
      var isPending = d.status === 'pending';
      var isPartial = d.status === 'partial';
      var isCleared = d.status === 'cleared';
      var paid      = num(d.paidAmount);
      var total     = num(d.amount);
      var remaining = total - paid;
      var pct       = total > 0 ? Math.round(paid/total*100) : 0;
      var statusCls = isPending ? 'status-pending' : (isPartial ? 'status-partial' : 'status-cleared');
      var statusLbl = isPending ? '🔴 বকেয়া' : (isPartial ? '🟠 আংশিক পরিশোধ' : '🟢 পরিশোধিত');

      // V44 update #12: tapping the row opens full detail — which
      // shop/DSR it belongs to, why the due exists (note), and when it
      // was created — not just the bare date shown inline here.
      h += '<div class="due-item" style="cursor:pointer" onclick="calShowEntryDetail(\''+d.id+'\')">';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-weight:700;font-size:13px">'+fmtBn(d.dueDate)+'</div>';
      h += '<div style="font-size:11px;color:var(--mt)">'+(d.dsrName||'—')+(d.note?' · '+esc(d.note):'')+'</div>';
      if (d.shopName) h += '<div style="font-size:11px;color:#673AB7;font-weight:600">🏪 '+esc(d.shopName)+'</div>';
      h += '<div class="'+statusCls+'">'+statusLbl+'</div>';
      if (isPartial) {
        h += '<div class="pay-prog-bar"><div class="pay-prog-fill" style="width:'+pct+'%"></div></div>';
        h += '<div style="font-size:10px;color:var(--mt)">পরিশোধ: ৳'+fm(paid)+' / বাকি: ৳'+fm(remaining)+'</div>';
      }
      h += '</div>';
      h += '<div style="text-align:right;min-width:90px;margin-left:8px">';
      h += '<div style="font-size:15px;font-weight:700;color:'+(isCleared?'var(--gr)':(isPartial?'#FF9800':'var(--re))'))+'">৳'+fm(total)+'</div>';
      if (canEdit && !isCleared) {
        h += '<button class="btn btn-sm" style="background:var(--grl);color:var(--gr);margin-top:4px" onclick="event.stopPropagation();calPayModal(\''+d.id+'\')">💳 পরিশোধ</button>';
      }
      h += '</div></div>';
    });
    h += '</div>';
  }

  h += '<div style="text-align:center;font-size:10px;color:var(--mt2);padding:8px">'+esc(S.shopName||'AXIION DMS')+' · Powered by <span style="color:#FFD700;font-weight:700">AXIION DMS</span></div>';
  el.innerHTML = h;
}

function prevCalMonth() {
  var [yr,mo] = CAL.month.split('-').map(Number);
  mo--; if(mo<1){mo=12;yr--;}
  return yr+'-'+String(mo).padStart(2,'0');
}
function nextCalMonth() {
  var [yr,mo] = CAL.month.split('-').map(Number);
  mo++; if(mo>12){mo=1;yr++;}
  return yr+'-'+String(mo).padStart(2,'0');
}

// ── Level 1: show people list for a date ─────────────────────
function calDayClick(dateStr) {
  var dayDues = CAL.dues.filter(function(d){return d.dueDate===dateStr;});
  var canEdit  = S.role==='owner'||S.role==='manager';
  var modal = document.createElement('div');
  modal.id = 'cal-day-modal';
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){if(e.target===modal)document.body.removeChild(modal);};
  var h = '<div class="due-modal">';
  h += '<div class="due-modal-title">📅 '+fmtBn(dateStr)+'</div>';
  if (!dayDues.length) {
    h += '<div style="text-align:center;color:var(--mt2);padding:20px 0">এই দিনে কোনো বাকি নেই</div>';
    if (canEdit) h += '<button class="btn btn-bl btn-w" onclick="document.body.removeChild(document.getElementById(\'cal-day-modal\'));calAddModal(\''+dateStr+'\')">➕ এই দিনে বাকি যোগ করুন</button>';
  } else {
    // Build per-person summary
    var pMap = {};
    dayDues.forEach(function(d){
      var pKey = d.dsrName||'—';
      if (!pMap[pKey]) pMap[pKey] = { name: pKey, clientType: d.clientType||'dsr', dues:[], total:0, remaining:0 };
      pMap[pKey].dues.push(d);
      pMap[pKey].total     += num(d.amount);
      pMap[pKey].remaining += Math.max(0, num(d.amount)-num(d.paidAmount));
    });
    var people = Object.values(pMap);
    h += '<div style="font-size:11px;color:var(--mt2);margin-bottom:10px;text-align:center">নামে ট্যাপ করুন বিস্তারিত দেখতে</div>';
    people.forEach(function(p){
      var allCleared = p.dues.every(function(d){return d.status==='cleared';});
      var hasPartial = p.dues.some(function(d){return d.status==='partial';});
      var dotColor   = allCleared ? 'var(--gr)' : (hasPartial ? '#FF9800' : 'var(--re)');
      var remTxt     = p.remaining > 0 ? '৳'+fm(p.remaining)+' বাকি' : '✅ পরিশোধিত';
      var badge = p.clientType==='custom'
        ? '<span style="font-size:10px;background:#EDE7F6;color:#673AB7;border-radius:4px;padding:1px 5px;margin-left:4px">কাস্টম</span>'
        : '<span style="font-size:10px;background:#E3F2FD;color:var(--bl);border-radius:4px;padding:1px 5px;margin-left:4px">DSR</span>';
      var safeKey = encodeURIComponent(p.name);
      h += '<div class="due-item" style="cursor:pointer;border-radius:10px;background:#F8F9FA;margin-bottom:6px;padding:10px 12px;align-items:center" onclick="calPersonDayDetail(\''+dateStr+'\',decodeURIComponent(\''+safeKey+'\'))">';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-weight:700;font-size:14px">'+esc(p.name)+badge+'</div>';
      h += '<div style="font-size:11px;color:var(--mt);margin-top:2px">'+p.dues.length+'টি লেনদেন · মোট: ৳'+fm(p.total)+'</div>';
      h += '</div>';
      h += '<div style="text-align:right;margin-left:10px">';
      h += '<div style="font-size:14px;font-weight:700;color:'+dotColor+'">'+remTxt+'</div>';
      h += '<div style="font-size:11px;color:var(--mt2);margin-top:2px">বিস্তারিত ▶</div>';
      h += '</div></div>';
    });
    if (canEdit) h += '<div style="margin-top:8px"><button class="btn btn-bl btn-w" onclick="document.body.removeChild(document.getElementById(\'cal-day-modal\'));calAddModal(\''+dateStr+'\')">➕ আরো যোগ করুন</button></div>';
  }
  h += '<div style="margin-top:12px"><button class="btn btn-gh btn-w" onclick="document.body.removeChild(document.getElementById(\'cal-day-modal\'))">বন্ধ করুন</button></div>';
  h += '</div>';
  modal.innerHTML = h;
  document.body.appendChild(modal);
}

// ── Level 2: show one person's transactions for a date ────────
function calPersonDayDetail(dateStr, personName) {
  var dayDues = CAL.dues.filter(function(d){return d.dueDate===dateStr && (d.dsrName||'—')===personName;});
  var canEdit  = S.role==='owner'||S.role==='manager';
  // close level-1 modal
  var prev = document.getElementById('cal-day-modal');
  if (prev) document.body.removeChild(prev);
  var modal = document.createElement('div');
  modal.id = 'cal-person-modal';
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){if(e.target===modal)document.body.removeChild(modal);};
  var h = '<div class="due-modal">';
  h += '<div class="due-modal-title" style="font-size:14px">'+esc(personName)+'<div style="font-size:11px;color:var(--mt);font-weight:400;margin-top:2px">📅 '+fmtBn(dateStr)+'</div></div>';
  dayDues.forEach(function(d){
    var isPending = d.status==='pending';
    var isPartial = d.status==='partial';
    var isCleared = d.status==='cleared';
    var paid      = num(d.paidAmount);
    var total     = num(d.amount);
    var remaining = total - paid;
    var pct       = total > 0 ? Math.round(paid/total*100) : 0;
    var statusCls = isPending?'status-pending':(isPartial?'status-partial':'status-cleared');
    var statusLbl = isPending?'🔴 বকেয়া':(isPartial?'🟠 আংশিক পরিশোধ':'🟢 পরিশোধিত');
    h += '<div class="due-item" style="margin-bottom:8px;border:1px solid #EEF2FF;border-radius:10px;padding:10px">';
    h += '<div style="flex:1;min-width:0">';
    if (d.shopName) h += '<div style="font-size:11px;color:#673AB7;font-weight:600;margin-bottom:3px">🏪 '+esc(d.shopName)+'</div>';
    if (d.note) h += '<div style="font-size:11px;color:var(--mt);margin-bottom:3px">📝 '+esc(d.note)+'</div>';
    if (d.createdAt) h += '<div style="font-size:10px;color:var(--mt2);margin-bottom:3px">🕒 তৈরি হয়েছে: '+fmtBn(d.createdAt)+'</div>';
    h += '<div class="'+statusCls+'">'+statusLbl+'</div>';
    if (isPartial) {
      h += '<div class="pay-prog-bar" style="margin-top:5px"><div class="pay-prog-fill" style="width:'+pct+'%"></div></div>';
      h += '<div style="font-size:10px;color:var(--mt);margin-top:2px">পরিশোধ: ৳'+fm(paid)+' · বাকি: ৳'+fm(remaining)+'</div>';
    }
    h += '</div>';
    h += '<div style="text-align:right;margin-left:8px;min-width:80px">';
    h += '<div style="font-size:16px;font-weight:700;color:'+(isCleared?'var(--gr)':(isPartial?'#FF9800':'var(--re)'))+'">\৳'+fm(total)+'</div>';
    if (canEdit && !isCleared) {
      h += '<button class="btn btn-sm" style="background:var(--grl);color:var(--gr);margin-top:4px" onclick="document.body.removeChild(document.getElementById(\'cal-person-modal\'));calPayModal(\''+d.id+'\')">💳 পরিশোধ</button>';
    }
    h += '</div></div>';
  });
  var safeDate = encodeURIComponent(dateStr);
  h += '<div style="margin-top:12px;display:flex;gap:8px">';
  h += '<button class="btn btn-gh" style="flex:1" onclick="document.body.removeChild(document.getElementById(\'cal-person-modal\'));calDayClick(decodeURIComponent(\''+safeDate+'\'))">◀ ফিরে যান</button>';
  h += '<button class="btn btn-gh" onclick="document.body.removeChild(document.getElementById(\'cal-person-modal\'))">বন্ধ</button>';
  h += '</div>';
  h += '</div>';
  modal.innerHTML = h;
  document.body.appendChild(modal);
}
// ── Update #49 — tapping a DSR/SO's due figure on the Owner/Manager
//    dashboard opens their full due transaction history: every
//    contributing give/return transaction (source, date, product,
//    shop when there is one) plus every payment made, instead of just
//    the bare due total.
async function openSrDueHistory(srId, srName) {
  var modal = document.createElement('div');
  modal.id = 'sr-due-hist-modal';
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){ if(e.target===modal) document.body.removeChild(modal); };
  modal.innerHTML = '<div class="due-modal"><div class="due-modal-title">📜 '+esc(srName||'—')+' — বাকির ইতিহাস</div>'
    + '<div style="text-align:center;padding:30px 0;color:var(--mt2)">লোড হচ্ছে...</div></div>';
  document.body.appendChild(modal);

  var r = await apiGet('/api/transactions?action=due-history&srId='+encodeURIComponent(srId));
  var box = modal.querySelector('.due-modal');
