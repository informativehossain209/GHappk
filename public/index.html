function calPayModal(id) {
  var due = CAL.dues.find(function(d){return d.id===id;});
  if (!due) return;
  var total     = num(due.amount);
  var paid      = num(due.paidAmount);
  var remaining = total - paid;
  var modal = document.createElement('div');
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){if(e.target===modal)document.body.removeChild(modal);};
  var h = '<div class="due-modal">';
  h += '<div class="due-modal-title">💳 পরিশোধ করুন</div>';
  h += '<div style="background:#F8F9FA;border-radius:10px;padding:10px;margin-bottom:14px">';
  h += '<div style="font-size:13px;font-weight:700">'+(due.dsrName||'—')+'</div>';
  h += '<div style="font-size:12px;color:var(--mt)">'+fmtBn(due.dueDate)+(due.note?' · '+esc(due.note):'')+'</div>';
  h += '<div style="margin-top:6px;display:flex;gap:16px">';
  h += '<div><div style="font-size:10px;color:var(--mt)">মোট বাকি</div><div style="font-weight:700;color:var(--re)">৳'+fm(total)+'</div></div>';
  h += '<div><div style="font-size:10px;color:var(--mt)">পরিশোধিত</div><div style="font-weight:700;color:var(--gr)">৳'+fm(paid)+'</div></div>';
  h += '<div><div style="font-size:10px;color:var(--mt)">অবশিষ্ট</div><div style="font-weight:700;color:#FF9800">৳'+fm(remaining)+'</div></div>';
  h += '</div>';
  if (paid > 0) {
    var pct = Math.round(paid/total*100);
    h += '<div class="pay-prog-bar" style="margin-top:8px"><div class="pay-prog-fill" style="width:'+pct+'%"></div></div>';
  }
  h += '</div>';
  h += '<div class="fg"><label class="fl">পরিশোধের পরিমাণ (৳) *</label>';
  h += '<input type="number" id="pay-amt" min="0.001" step="0.001" max="'+remaining+'" placeholder="পরিমাণ লিখুন" style="font-size:16px;font-weight:700">';
  h += '<div style="font-size:11px;color:var(--mt);margin-top:3px">সর্বোচ্চ অবশিষ্ট: ৳'+fm(remaining)+'</div></div>';
  h += '<div style="display:flex;gap:6px;margin-bottom:12px">';
  h += '<button class="btn btn-sm btn-gh" onclick="document.getElementById(\'pay-amt\').value='+Number((remaining/4).toFixed(2))+'">২৫%</button>';
  h += '<button class="btn btn-sm btn-gh" onclick="document.getElementById(\'pay-amt\').value='+Number((remaining/2).toFixed(2))+'">৫০%</button>';
  h += '<button class="btn btn-sm btn-gh" onclick="document.getElementById(\'pay-amt\').value='+Number((remaining*3/4).toFixed(2))+'">৭৫%</button>';
  h += '<button class="btn btn-sm" style="background:var(--grl);color:var(--gr)" onclick="document.getElementById(\'pay-amt\').value='+remaining+'">সম্পূর্ণ</button>';
  h += '</div>';
  h += '<div class="fg"><label class="fl">🔐 Owner পাসওয়ার্ড *</label>';
  h += '<input type="password" id="pay-pin" placeholder="PIN দিন" maxlength="10" inputmode="numeric"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:4px">';
  h += '<button class="btn btn-bl" style="flex:1" onclick="calDoPayment(\''+id+'\','+remaining+')">✅ নিশ্চিত করুন</button>';
  h += '<button class="btn btn-gh" onclick="document.body.removeChild(document.querySelector(\'.due-modal-bg\'))">বাতিল</button>';
  h += '</div></div>';
  modal.innerHTML = h;
  document.body.appendChild(modal);
  setTimeout(function(){var el=document.getElementById('pay-amt');if(el)el.focus();},100);
}

async function calDoPayment(id, maxRemaining) {
  var payAmt = parseFloat(document.getElementById('pay-amt').value);
  var pin    = document.getElementById('pay-pin').value.trim();
  if (!payAmt || payAmt <= 0) return toast('পরিমাণ দিন');
  if (payAmt > maxRemaining + 0.01) return toast('পরিমাণ অবশিষ্ট বাকির বেশি হতে পারবে না');
  if (!pin) return toast('Owner পাসওয়ার্ড দিন');
  // Validate owner password via API (works even after password change)
  showOvl('পাসওয়ার্ড যাচাই হচ্ছে...');
  var authR = await apiPost('/api/auth', { password: pin });
  hideOvl();
  if (!authR || !authR.ok) return toast('❌ পাসওয়ার্ড ভুল');
  if (authR.role !== 'owner') return toast('❌ শুধুমাত্র Owner পাসওয়ার্ড গ্রহণযোগ্য');
  var modal = document.querySelector('.due-modal-bg');
  if (modal) document.body.removeChild(modal);
  showOvl('পরিশোধ হচ্ছে...');
  var r = await apiPut('/api/due-calendar', {id:id, payAmount:payAmt});
  hideOvl();
  if (r.ok) {
    var msg = r.status==='cleared' ? '🟢 সম্পূর্ণ পরিশোধিত!' : '🟠 আংশিক পরিশোধ · অবশিষ্ট: ৳'+fm(r.remaining);
    toast(msg);
    loadCal(CAL.month);
  } else toast(r.error||'ব্যর্থ');
}

function calSwitchType(type) {
  var isDsr = type === 'dsr';
  document.getElementById('cal-type-dsr').style.background    = isDsr ? 'var(--bl)' : '#E8EAF6';
  document.getElementById('cal-type-dsr').style.color         = isDsr ? '#fff' : 'var(--bl)';
  document.getElementById('cal-type-custom').style.background = !isDsr ? '#673AB7' : '#EDE7F6';
  document.getElementById('cal-type-custom').style.color      = !isDsr ? '#fff' : '#673AB7';
  document.getElementById('cal-dsr-wrap').style.display    = isDsr  ? '' : 'none';
  document.getElementById('cal-custom-wrap').style.display = !isDsr ? '' : 'none';
  document.getElementById('cal-client-type').value = type;
}

function _odepSetMethod(method) {
  var modal = document.querySelector('.due-modal-bg'); if (!modal) return;
  modal.dataset.method = method;
  var bankBtn = document.getElementById('odep-m-bank'), depotBtn = document.getElementById('odep-m-depot');
  if (bankBtn)  bankBtn.className  = 'sbt' + (method==='bank'  ? ' active' : '');
  if (depotBtn) depotBtn.className = 'sbt' + (method==='depot' ? ' active' : '');
}
async function onlineDepositSave() {
  var date = v('odep-dt');
  var amount = vn('odep-am');
  var modalEl = document.querySelector('.due-modal-bg');
  var method = (modalEl && modalEl.dataset.method) || 'bank';
  if (!date) return toast('তারিখ দিন');
  if (!amount && amount !== 0) return toast('পরিমাণ দিন');
  if (modalEl) document.body.removeChild(modalEl);
  showOvl('সংরক্ষণ হচ্ছে...');
  var r = await apiPost('/api/expenses', {action:'deposit-set', date:date, amount:amount, depositMethod:method, setBy:S.userName, requesterRole:S.role});
  hideOvl();
  if (!r || !r.ok) return toast(r&&r.error||'ব্যর্থ');
  toast('✅ অনলাইন জমা যোগ করা হয়েছে');
  // Re-fetch immediately — today's/month's boxes update right away, no
  // manual page refresh needed (loadDash is a pure AJAX re-fetch).
  loadDash(true);
}
// ── Update #54, extended V55 #55 — tapping "এই মাসের মোট জমা" opens a
//    date-by-date breakdown of the pay-cycle's deposits, now with a
//    ◀ previous / next ▶ month picker and a PDF/JPG slip generator.
//    `period` (optional 'YYYY-MM') lets the modal be re-opened already
//    scoped to a specific past month when navigating.
async function openDepositHistory(period) {
  period = period || _cyclePeriodToday();
  var modal = document.getElementById('dep-hist-modal') || document.createElement('div');
  modal.id = 'dep-hist-modal';
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){ if(e.target===modal) document.body.removeChild(modal); };
  modal.innerHTML = '<div class="due-modal"><div class="due-modal-title">💵 অনলাইন জমার বিস্তারিত</div>'
    + '<div style="text-align:center;padding:30px 0;color:var(--mt2)">লোড হচ্ছে...</div></div>';
  if (!document.body.contains(modal)) document.body.appendChild(modal);

  var r = await apiGet('/api/expenses?action=deposit-history&period='+encodeURIComponent(period));
  var box = modal.querySelector('.due-modal');
  if (!r || !r.ok) { box.innerHTML = '<div class="due-modal-title">💵 অনলাইন জমা</div><div style="text-align:center;padding:20px 0;color:var(--re)">তথ্য লোড ব্যর্থ হয়েছে</div><button class="btn btn-gh btn-w" style="margin-top:10px" onclick="document.body.removeChild(document.getElementById(\'dep-hist-modal\'))">বন্ধ</button>'; return; }

  var isCurrent = period >= _cyclePeriodToday();
  var monthLabel = _depositPeriodLabel(period);

  var h = '<div class="due-modal-title">💵 অনলাইন জমার বিস্তারিত</div>';
  // ── Month picker ──
  h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">';
  h += '<button class="btn btn-gh btn-sm" onclick="openDepositHistory(\''+_shiftPeriod(period,-1)+'\')">◀ পূর্ববর্তী</button>';
  h += '<div style="font-weight:700;font-size:13px;text-align:center;flex:1">'+monthLabel+'</div>';
  h += isCurrent
    ? '<button class="btn btn-gh btn-sm" disabled style="opacity:.35;cursor:default">পরবর্তী ▶</button>'
    : '<button class="btn btn-gh btn-sm" onclick="openDepositHistory(\''+_shiftPeriod(period,1)+'\')">পরবর্তী ▶</button>';
  h += '</div>';
  h += '<div style="background:#E3F2FD;border-radius:10px;padding:9px 12px;margin-bottom:12px;display:flex;justify-content:space-between;font-weight:700;font-size:13px">';
  h += '<span>মোট জমা</span><span style="color:var(--bl)">৳'+fm(r.total)+'</span></div>';
  if (!r.rows || !r.rows.length) {
    h += '<div style="text-align:center;padding:20px 0;color:var(--mt2)">কোনো জমার রেকর্ড নেই</div>';
  } else {
    h += '<div style="max-height:44vh;overflow-y:auto">';
    r.rows.forEach(function(row){
      var mLabel = row.method === 'depot' ? '🏬 ডিপো' : '🏦 ব্যাংক';
      h += '<div class="due-item" style="border-bottom:1px solid #EEF2FF;padding:9px 2px;display:flex;justify-content:space-between;align-items:center">';
      h += '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12.5px">'+fmtBn(row.date)+' <span class="bdg b-gr" style="font-size:9px">'+mLabel+'</span></div>';
      if (row.setBy) h += '<div style="font-size:10px;color:var(--mt2);margin-top:2px">✍️ '+esc(row.setBy)+'</div>';
      h += '</div>';
      h += '<div style="font-size:13px;font-weight:700;color:var(--bl);margin-left:8px">৳'+fm(row.amount)+'</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '<div style="display:flex;gap:8px;margin-top:12px">';
  h += '<button class="btn btn-am" style="flex:1" onclick="_downloadDepositSlip(\''+period+'\')">📄 PDF স্লিপ</button>';
  h += '<button class="btn btn-gh" style="flex:1" onclick="document.body.removeChild(document.getElementById(\'dep-hist-modal\'))">বন্ধ</button>';
  h += '</div>';
  box.innerHTML = h;
}
// month-navigation + label helpers, local to the deposit breakdown modal
function _shiftPeriod(period, delta) {
  var p = period.split('-').map(Number), y = p[0], m = p[1] + delta;
  while (m > 12) { m -= 12; y++; }
  while (m < 1)  { m += 12; y--; }
  return y + '-' + String(m).padStart(2,'0');
}
var _BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function _depositPeriodLabel(period) {
  var p = period.split('-').map(Number);
  var b = _cycleBounds(period);
  return _BN_MONTHS[p[1]-1]+' '+p[0]+' <span style="font-weight:400;color:var(--mt2);font-size:10.5px">('+fmtBn(b.start)+' – '+fmtBn(b.end)+')</span>';
}

  var slipHtml = '<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8">'

    +'<style>'

    +'.hdr{border:2px solid #000;padding:8px 10px 6px;margin-bottom:10px;text-align:center}'
    +'.hdr-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}'
    +'.logo-circle{width:44px;height:44px;border:2px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0}'
    +'.co-name{font-size:26px;font-weight:900;line-height:1;font-family:\'Noto Sans\',\'Hind Siliguri\',sans-serif}'
    +'.hdr-dist{font-size:10.5px;font-weight:600;color:#000;margin-top:2px}'
    +'.hdr-addr{font-size:9.5px;color:#333;margin-top:1px;line-height:1.5}'

// ════════════════════════════════════════════════════
//  GROUP CHAT
// ════════════════════════════════════════════════════
var _gcMsgs        = [];
var _gcSubClient   = null;
var _gcChannel     = null;
var _gcLive        = false;
var _gcSending     = false;
var _gcInited      = false;
var _gcPollTimer   = null;

var ROLE_LABELS_CHAT = { owner:'Owner', manager:'Manager', so:'SO', dsr:'DSR', driver:'Driver' };

function _gcRoleClass(role) {
  if (role==='owner')   return 'gc-role-owner';
  if (role==='manager') return 'gc-role-manager';
  if (role==='so')      return 'gc-role-so';
  if (role==='driver')  return 'gc-role-driver';
  return 'gc-role-dsr';
}

function _gcFmtTime(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    var h = d.getHours(), m = d.getMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  } catch(e) { return ''; }
}

function _gcFmtDate(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    var months = ['জানু','ফেব্রু','মার্চ','এপ্রি','মে','জুন','জুলা','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
    return d.getDate()+' '+months[d.getMonth()];
  } catch(e) { return iso.slice(0,10); }
}

function _gcDateKey(iso) { return iso ? String(iso).slice(0,10) : ''; }

function _gcBuildMsgHTML(msg, showDate) {
  var isMine = (msg.senderId === S.userId) ||
               (msg.senderRole === 'owner' && S.role === 'owner' && !msg.senderId);
  var cls = isMine ? 'mine' : 'other';
  var roleLabel = ROLE_LABELS_CHAT[msg.senderRole] || msg.senderRole;
  var roleCls   = _gcRoleClass(msg.senderRole);
  var h = '';
  if (showDate) {
    h += '<div class="gc-date-sep">'+_gcFmtDate(msg.createdAt)+'</div>';
  }
  h += '<div class="gc-msg '+cls+'" data-id="'+esc(msg.id)+'">';
  if (!isMine) {
    h += '<div class="gc-meta">';
    h += '<span style="font-weight:700">'+esc(msg.senderName)+'</span>';
    h += '<span class="gc-role-badge '+roleCls+'">'+esc(roleLabel)+'</span>';
    h += '</div>';
  }
  h += '<div class="gc-bubble">'+esc(msg.message).replace(/\n/g,'<br>')+'</div>';
  h += '<div class="gc-time">'+_gcFmtTime(msg.createdAt)+(isMine?' ✓':'')+'</div>';
  h += '</div>';
  return h;
}

function _gcRenderMessages() {
  var el = document.getElementById('gc-msgs-list');
  if (!el) return;
  if (!_gcMsgs.length) {
    el.innerHTML = '<div class="gc-empty"><div style="font-size:36px">💬</div><div>এখনো কোনো বার্তা নেই।<br>প্রথম বার্তাটি পাঠান!</div></div>';
    return;
  }
  var h = '';
  var lastDate = '';
  _gcMsgs.forEach(function(msg) {
    var dk = _gcDateKey(msg.createdAt);
    var showDate = dk !== lastDate;
    lastDate = dk;
    h += _gcBuildMsgHTML(msg, showDate);
  });
  el.innerHTML = h;
}

function _gcAppendMsg(msg) {
  var el = document.getElementById('gc-msgs-list');
  if (!el) return;
  // Remove empty state
  var empty = el.querySelector('.gc-empty');
  if (empty) el.innerHTML = '';
  // Date separator check
  var lastDate = '';
  if (_gcMsgs.length > 0) lastDate = _gcDateKey(_gcMsgs[_gcMsgs.length-1].createdAt);
  var dk = _gcDateKey(msg.createdAt);
  var showDate = dk !== lastDate;
  el.insertAdjacentHTML('beforeend', _gcBuildMsgHTML(msg, showDate));
  _gcScrollBottom();
}

function _gcScrollBottom() {
  var el = document.getElementById('gc-msgs-list');
  if (el) setTimeout(function(){ el.scrollTop = el.scrollHeight; }, 50);
}

function _gcSetLive(live) {
  _gcLive = live;
  var dot = document.getElementById('gc-conn-dot');
  if (dot) {
    dot.className = 'gc-conn-dot' + (live?' live':'');
    dot.title = live ? 'সরাসরি সংযুক্ত' : 'পোলিং মোড';
  }
}

async function _gcInitRealtime() {
  try {
    var cfg = await apiGet('/api/expenses?action=chat-config');
    if (!cfg || !cfg.ok || !cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      _gcStartPolling(); return;
    }
    if (typeof window.supabase === 'undefined') { _gcStartPolling(); return; }
    _gcSubClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    _gcChannel = _gcSubClient.channel('gc-global')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'group_chat_messages' },
        function(payload) {
          var raw = payload.new;
          if (!raw) return;
          // Dedup
          if (_gcMsgs.find(function(m){ return m.id === String(raw.id||''); })) return;
          var msg = { id:String(raw.id||''), senderId:String(raw.sender_id||''),
            senderName:raw.sender_name||'', senderRole:raw.sender_role||'',
            message:raw.message||'', createdAt:raw.created_at||'' };
          _gcMsgs.push(msg);
          _gcAppendMsg(msg);
        })
      .subscribe(function(status) {
        if (status === 'SUBSCRIBED') _gcSetLive(true);
        else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
          _gcSetLive(false); _gcStartPolling();
        }
      });
  } catch(e) { _gcStartPolling(); }
}

function _gcStartPolling() {
  if (_gcPollTimer) return;
  _gcPollTimer = setInterval(async function() {
    if (S.tab !== 'chat') return;
    var lastId = _gcMsgs.length ? _gcMsgs[_gcMsgs.length-1].createdAt : '';
    var r = await apiGet('/api/expenses?action=chat-msgs');
    if (!r || !r.ok) return;
    var newMsgs = (r.messages||[]).filter(function(m){
      return !_gcMsgs.find(function(x){ return x.id===m.id; });
    });
    newMsgs.forEach(function(m){ _gcMsgs.push(m); _gcAppendMsg(m); });
  }, 4000);
}

async function gcLoadAndInit() {
  if (_gcInited) { _gcScrollBottom(); return; }
  _gcInited = true;
  var r;
  try {
    var _tout = new Promise(function(res){ setTimeout(function(){ res({ok:false,error:'timeout'}); }, 12000); });
    r = await Promise.race([apiGet('/api/expenses?action=chat-msgs'), _tout]);
  } catch(e) { r = {ok:false,error:e.message}; }
  if (!r || !r.ok) {
    var _el = document.getElementById('gc-msgs-list');
    if (_el) _el.innerHTML = '<div class="gc-empty"><div style="font-size:32px">⚠️</div><div style="margin-top:8px;color:var(--mt)">লোড ব্যর্থ হয়েছে</div><button class="btn btn-bl" style="margin-top:12px;font-size:12px" ontouchstart="event.preventDefault();_gcInited=false;gcLoadAndInit()" onclick="_gcInited=false;gcLoadAndInit()">🔄 পুনরায় চেষ্টা করুন</button></div>';
    return;
  }
  _gcMsgs = r.messages || [];
  _gcRenderMessages();
  _gcScrollBottom();
  _gcInitRealtime();
}

async function gcSend() {
  if (_gcSending) return;
  var ta = document.getElementById('gc-input-ta');
  if (!ta) return;
  var msg = ta.value.trim();
  if (!msg) return;
  _gcSending = true;
  var btn = document.getElementById('gc-send-btn');
  if (btn) btn.disabled = true;
  var r = await apiPost('/api/expenses?action=chat-send', {
    senderId:   S.userId,
    senderName: S.userName || (S.role==='owner'?'Owner':'Manager'),
    senderRole: S.role,
    message:    msg
  });
  _gcSending = false;
  if (btn) btn.disabled = false;
  if (r && r.ok) {
    ta.value = '';
    ta.style.height = '';
    // Optimistic: if realtime is live it'll arrive; otherwise poll will pick it up
    // But add optimistically for immediate feedback
    if (!_gcLive) {
      var optMsg = { id:'opt-'+Date.now(), senderId:S.userId,
        senderName: S.userName||(S.role==='owner'?'Owner':''), senderRole:S.role,
        message:msg, createdAt:new Date().toISOString() };
      _gcMsgs.push(optMsg);
      _gcAppendMsg(optMsg);
    }
  } else {
    toast((r&&r.error)||'পাঠানো ব্যর্থ');
  }
}

function gcInputKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); gcSend(); }
  // Auto-resize
  var ta = e.target;
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,90)+'px';
}

  notices:           { lb:'নোটিশ' },
  live_locations:    { lb:'লাইভ লোকেশন ডেটা' },
  manager_approvals: { lb:'ম্যানেজার অনুমোদন অপেক্ষমাণ তালিকা' },
  shops:             { lb:'দোকান তালিকা (সব দোকানের তথ্য মুছে যাবে)', danger:true }
};
var RS = { unlocked:false, counts:{}, selected:{} };

function renderResetTab() {
  var el = document.getElementById('pg-reset'); if (!el) return;
  if (S.role !== 'owner') { el.innerHTML = '<div class="card" style="padding:16px;text-align:center;color:var(--mt2)">শুধুমাত্র Owner এই পাতা দেখতে পারবেন।</div>'; return; }
  if (!RS.unlocked) { renderResetGate(el); return; }
  renderResetPanel(el);
}

function renderResetGate(el) {
  var h = '<div class="card" style="padding:16px">';
  h += '<div style="font-size:15px;font-weight:700;margin-bottom:6px">🗑️ রিসেট সেন্টার</div>';
  h += '<div style="font-size:12px;color:var(--mt2);margin-bottom:14px">শুধুমাত্র Owner এখানে প্রবেশ করতে পারবেন। চালিয়ে যেতে আপনার পাসওয়ার্ড দিন।</div>';
  h += '<div class="fg"><label class="fl">🔐 Owner পাসওয়ার্ড</label>';
  h += '<input type="password" id="reset-gate-pin" placeholder="PIN দিন" maxlength="10" inputmode="numeric"></div>';
  h += '<button class="btn btn-bl" style="width:100%;margin-top:8px" onclick="resetGateSubmit()">প্রবেশ করুন</button>';
  h += '</div>';
  el.innerHTML = h;
  setTimeout(function(){ var e=document.getElementById('reset-gate-pin'); if (e) e.focus(); }, 100);
}

async function resetGateSubmit() {
  var pinEl = document.getElementById('reset-gate-pin');
  var pin = (pinEl ? pinEl.value : '').trim();
  if (!pin) return toast('পাসওয়ার্ড দিন');
  showOvl('যাচাই হচ্ছে...');
  var r = await apiPost('/api/auth', { password: pin });
  hideOvl();
  if (!r || !r.ok) return toast('❌ পাসওয়ার্ড ভুল');
  if (r.role !== 'owner') return toast('❌ শুধুমাত্র Owner প্রবেশ করতে পারবেন');
  RS.unlocked = true; RS.selected = {};
  showOvl('লোড হচ্ছে...');
  var cr = await apiGet('/api/auth?action=reset-counts');
  hideOvl();
  RS.counts = (cr && cr.ok) ? cr.counts : {};
  renderResetTab();
}

function renderResetPanel(el) {
  var keys = Object.keys(RESET_LABELS);
  var h = '<div class="card" style="padding:16px;margin-bottom:10px">';
  h += '<div style="font-size:15px;font-weight:700;margin-bottom:4px">🗑️ রিসেট সেন্টার</div>';
  h += '<div style="font-size:12px;color:var(--mt2)">যা যা নির্বাচন করবেন তা <b>স্থায়ীভাবে</b> মুছে যাবে — ফিরিয়ে আনা যাবে না। App হালকা রাখতে মাঝে মাঝে পুরনো ডেটা রিসেট করতে পারেন।</div>';
  h += '</div>';

  h += '<div class="card" style="padding:6px 14px">';
  keys.forEach(function(k){
    var c = RESET_LABELS[k];
    var cnt = RS.counts[k] != null ? RS.counts[k] : '…';
    var checked = RS.selected[k] ? 'checked' : '';
    var rowStyle = c.danger
      ? 'border:1px solid var(--re);border-radius:8px;padding:8px;margin:8px 0;background:var(--rel)'
      : 'padding:9px 0;border-bottom:1px solid var(--bdr)';
    h += '<label style="display:flex;align-items:center;gap:10px;'+rowStyle+';cursor:pointer">';
    h += '<input type="checkbox" '+checked+' onchange="RS.selected[\''+k+'\']=this.checked" style="width:18px;height:18px;flex:0 0 auto">';
    h += '<div style="flex:1"><div style="font-size:13px;font-weight:600">'+(c.danger?'⚠️ ':'')+esc(c.lb)+'</div>';
    h += '<div style="font-size:11px;color:var(--mt2)">'+cnt+' টি রেকর্ড</div></div>';
    h += '</label>';
  });
  h += '</div>';

  h += '<div style="display:flex;gap:8px;margin-top:12px">';
  h += '<button class="btn btn-gh" style="flex:1" onclick="RS.unlocked=false;renderResetTab()">বন্ধ করুন</button>';
  h += '<button class="btn" style="flex:1;background:var(--re);color:#fff" onclick="resetSelectedStep1()">নির্বাচিত রিসেট করুন</button>';
  h += '</div>';
  el.innerHTML = h;
}

function resetSelectedStep1() {
  var keys = Object.keys(RS.selected).filter(function(k){ return RS.selected[k]; });
  if (!keys.length) return toast('অন্তত একটি বিষয় নির্বাচন করুন');
  var totalRows = keys.reduce(function(s,k){ return s + (RS.counts[k]||0); }, 0);
  var names = keys.map(function(k){ return RESET_LABELS[k].lb; }).join(', ');

  var modal = document.createElement('div');
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){ if (e.target===modal) document.body.removeChild(modal); };
  var h = '<div class="due-modal">';
  h += '<div class="due-modal-title" style="color:var(--re)">⚠️ নিশ্চিতকরণ ধাপ ১/২</div>';
  h += '<div style="font-size:12px;margin-bottom:10px">আপনি এই বিষয়গুলো স্থায়ীভাবে মুছতে চলেছেন (মোট প্রায় '+totalRows+' টি রেকর্ড):</div>';
  h += '<div style="font-size:12px;font-weight:600;margin-bottom:12px;color:var(--re)">'+esc(names)+'</div>';
  h += '<div class="fg"><label class="fl">🔐 Owner পাসওয়ার্ড (১ম বার)</label>';
  h += '<input type="password" id="reset-pin-1" placeholder="PIN দিন" maxlength="10" inputmode="numeric"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:10px">';
  h += '<button class="btn btn-gh" style="flex:1" onclick="document.body.removeChild(this.closest(\'.due-modal-bg\'))">বাতিল</button>';
  h += '<button class="btn" style="flex:1;background:var(--re);color:#fff" onclick=\'resetSelectedStep2('+JSON.stringify(keys)+')\'>পরবর্তী ধাপ</button>';
  h += '</div></div>';
  modal.innerHTML = h;
  document.body.appendChild(modal);
  setTimeout(function(){ var e=document.getElementById('reset-pin-1'); if (e) e.focus(); }, 100);
}

async function resetSelectedStep2(keys) {
  var pinEl = document.getElementById('reset-pin-1');
  var pin1 = (pinEl ? pinEl.value : '').trim();
  if (!pin1) return toast('পাসওয়ার্ড দিন');
  showOvl('যাচাই হচ্ছে...');
  var r = await apiPost('/api/auth', { password: pin1 });
  hideOvl();
  if (!r || !r.ok || r.role !== 'owner') return toast('❌ পাসওয়ার্ড ভুল');

  var oldModal = document.querySelector('.due-modal-bg');
  if (oldModal) document.body.removeChild(oldModal);

  var modal = document.createElement('div');
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){ if (e.target===modal) document.body.removeChild(modal); };
  var h = '<div class="due-modal">';
  h += '<div class="due-modal-title" style="color:var(--re)">⚠️ নিশ্চিতকরণ ধাপ ২/২ — শেষ সুযোগ</div>';
  h += '<div style="font-size:12px;margin-bottom:10px">এটি একদম শেষ ধাপ। এরপর ডেটা <b>স্থায়ীভাবে মুছে যাবে</b>, ফিরিয়ে আনা যাবে না। নিশ্চিত হলে পাসওয়ার্ড আবার দিন।</div>';
  h += '<div class="fg"><label class="fl">🔐 Owner পাসওয়ার্ড (২য় বার)</label>';
  h += '<input type="password" id="reset-pin-2" placeholder="PIN আবার দিন" maxlength="10" inputmode="numeric"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:10px">';
  h += '<button class="btn btn-gh" style="flex:1" onclick="document.body.removeChild(this.closest(\'.due-modal-bg\'))">বাতিল</button>';
  h += '<button class="btn" style="flex:1;background:var(--re);color:#fff" onclick=\'resetSelectedExecute('+JSON.stringify(keys)+')\'>✅ স্থায়ীভাবে মুছুন</button>';
  h += '</div></div>';
  modal.innerHTML = h;
  document.body.appendChild(modal);
  setTimeout(function(){ var e=document.getElementById('reset-pin-2'); if (e) e.focus(); }, 100);
}

async function resetSelectedExecute(keys) {
  var pinEl = document.getElementById('reset-pin-2');
  var pin2 = (pinEl ? pinEl.value : '').trim();
  if (!pin2) return toast('পাসওয়ার্ড দিন');
  showOvl('রিসেট হচ্ছে...');
  var r = await apiPut('/api/auth', { action:'reset-data', password: pin2, categories: keys });
  hideOvl();
  var modal = document.querySelector('.due-modal-bg');
  if (modal) document.body.removeChild(modal);
  if (!r || !r.ok) return toast('❌ '+((r&&r.error)||'রিসেট ব্যর্থ হয়েছে'));
  toast('✅ নির্বাচিত ডেটা রিসেট সম্পন্ন হয়েছে');
  RS.selected = {};
  RS.unlocked = false; // require the password again next time, for safety
  loadAll();
  renderResetTab();
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</body>
</html>
